<script>
const control=document.querySelector('.selectList');
const frame=control.querySelector('.selectListFrame');
const menu=control.querySelector('.selectListOptions');
frame.addEventListener('click',()=>{ document.body.appendChild(menu); menu.style.visibility='visible'; });
menu.querySelectorAll('.selectListOption').forEach(option=>option.addEventListener('click',()=>{
  menu.querySelectorAll('.selected').forEach(old=>old.classList.remove('selected'));
  option.classList.add('selected'); frame.innerHTML=option.innerHTML;
  menu.style.visibility='hidden'; control.appendChild(menu);
}));
</script>
