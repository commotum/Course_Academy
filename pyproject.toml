[project]
name = "course-academy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bs4>=0.0.2",
    "matplotlib==3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "PyYAML>=6.0,<7",
    "sympy>=1.14.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
gen = "course_academy_gen:main"

[tool.setuptools]
py-modules = ["course_academy_gen"]
