ore, \n\n$$\na+b+c=3+1+3=7.\n$$", "fields": []}, {"entity": 17592186088984, "attribute": ":tutorial/content", "value": "Matrices arise naturally in *many* real-world problems. Weather forecasting, image processing and computer graphics, video games, and online customization algorithms are just a few of the many applications of matrices. \n\nLet's consider an example where we can use a matrix to model bus routes in a city. \n\nThe diagram below shows the bus routes between three stations (Station A, Station B, and Station C) in a particular city, where $A, B,$ and $C$ represent the stations and the arrows represent the directed routes between them. \n\n![](images/cb/cbdf5c2470229ae3ba10ee18bccd2dc764407897397466b157474bf2b819f5d9.png)\n\nNote that the circles $A,B,$ and $C$ in our diagram are called **nodes**.\n\nWe wish to represent this same diagram using a matrix. Let's start by putting this information into a table like the one below:\n\n<div class=\"route-matrix\">\n  <span class=\"matrix-to\">To<\/span>\n  <span class=\"matrix-from\">From<\/span>\n  <table aria-label=\"Route matrix: rows are From stations; columns are To stations\">\n    <thead>\n      <tr><td class=\"matrix-corner\"><\/td><th scope=\"col\">A<\/th><th scope=\"col\">B<\/th><th scope=\"col\">C<\/th><\/tr>\n    <\/thead>\n    <tbody>\n      <tr><th scope=\"row\">A<\/th><td><\/td><td><\/td><td><\/td><\/tr>\n      <tr><th scope=\"row\">B<\/th><td><\/td><td><\/td><td><\/td><\/tr>\n      <tr><th scope=\"row\">C<\/th><td><\/td><td><\/td><td><\/td><\/tr>\n    <\/tbody>\n  <\/table>\n<\/div>\n\nLet's now fill in the rows of our table. We begin by considering all of the bus routes from Station A to the other stations:\n\n- There are $\\color{blue}0$ bus routes from $A$ to itself.\n\n- There is $\\color{blue}1$ bus route from $A$ to $B.$\n\n- There is $\\color{blue}1$ bus route from $A$ to $C.$\n\nFilling in the first row of the table, we get the following:\n\n<div class=\"route-matrix\">\n  <span class=\"matrix-to\">To<\/span>\n  <span class=\"matrix-from\">From<\/span>\n  <table aria-label=\"Route matrix: rows are From stations; columns are To stations\">\n    <thead>\n      <tr><td class=\"matrix-corner\"><\/td><th scope=\"col\">A<\/th><th scope=\"col\">B<\/th><th scope=\"col\">C<\/th><\/tr>\n    <\/thead>\n    <tbody>\n      <tr><th scope=\"row\">A<\/th><td>$\\color{blue} 0$<\/td><td>$\\color{blue} 1$<\/td><td>$\\color{blue} 1$<\/td><\/tr>\n      <tr><th scope=\"row\">B<\/th><td><\/td><td><\/td><td><\/td><\/tr>\n      <tr><th scope=\"row\">C<\/th><td><\/td><td><\/td><td><\/td><\/tr>\n    <\/tbody>\n  <\/table>\n<\/div>\n\nFilling in the remaining rows in the same way, we get:\n\n<div class=\"route-matrix\">\n  <span class=\"matrix-to\">To<\/span>\n  <span class=\"matrix-from\">From<\/span>\n  <table aria-label=\"Route matrix: rows are From stations; columns are To stations\">\n    <thead>\n      <tr><td class=\"matrix-corner\"><\/td><th scope=\"col\">A<\/th><th scope=\"col\">B<\/th><th scope=\"col\">C<\/th><\/tr>\n    <\/thead>\n    <tbody>\n      <tr><th scope=\"row\">A<\/th><td>$0$<\/td><td>$1$<\/td><td>$1$<\/td><\/tr>\n      <tr><th scope=\"row\">B<\/th><td>$0$<\/td><td>$1$<\/td><td>$2$<\/td><\/tr>\n      <tr><th scope=\"row\">C<\/th><td>$1$<\/td><td>$0$<\/td><td>$0$<\/td><\/tr>\n    <\/tbody>\n  <\/table>\n<\/div>\n\nFinally, keeping only the essential information, we obtain the following matrix:\n\n$$\n\\begin{bmatrix}0 & 1 & 1 \\\\ 0 & 1 & 2 \\\\ 1 & 0 & 0\\end{bmatrix}\n$$", "fields": []}];
