<!doctype html><html data-theme="light"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="connect-src 'none'"><link rel="stylesheet" href="/ui/learning.css"><link rel="stylesheet" href="/ui/navigation.css"><script src="/ui/vendor/dompurify/purify.min.js"></script><script src="/ui/mathjax-config.js"></script><script src="/ui/vendor/mathjax/tex-svg.js"></script><body><main class="lesson-main" id="main"></main><script type="module">
import {marked} from '/ui/vendor/marked/marked.esm.js'; import {romanLists} from '/ui/prose-lists.js';
import {inlinePrompt,loadMathInputs,mountInlineFields,blankInput,checkboxControl,choiceIndicator,fieldFeedback,richSelect,freeInput} from '/ui/question-fields.js';
const el=(tag,className='',text='')=>{const n=document.createElement(tag);n.className=className;n.textContent=text;return n;};
const short=x=>String(x||'').split('/').at(-1),typeset=()=>{};
const assetURL=x=>'/api/asset?path='+encodeURIComponent(x);
const escapeHTML=text=>String(text).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
function markdown(value, className = 'prose', fields = []) {
  const container = el('div', className);
  // Protect TeX from Markdown's underscore, backslash, and table processing.
  const math = [];
  const prefix = 'CAMATH' + crypto.randomUUID().replaceAll('-', '') + 'TOKEN';
  const fieldKeys = new Set(fields.map(field => field.key));
  const placeholder = /\{\{(?:answer-field:)?([^}]+)\}\}/g;
  let source = inlinePrompt(value, fields).replace(/\\\[[\s\S]*?\\\]|\\\([\s\S]*?\\\)|\$\$[\s\S]*?\$\$|(?<!\\)\$(?!\$)(?:\\.|[^$\\])*?(?<!\\)\$/g, match => {
    math.push(match.replace(placeholder, (whole, key) => fieldKeys.has(key)
      ? `\\underbrace{\\qquad}_{\\text{answer ${fields.findIndex(field => field.key === key) + 1}}}` : whole));
    return prefix + (math.length - 1) + 'END';
  });
  source = source.replace(placeholder, (whole, key) => fieldKeys.has(key) ? `<span class="field-location">${escapeHTML(fieldLabel(key))}</span>` : whole);
  let html = marked.parse(romanLists(source), { async: false, gfm: true, breaks: false });
  html = html.replace(new RegExp(prefix + '(\\d+)END', 'g'), (_, i) => escapeHTML(math[Number(i)]));
  const fragment = DOMPurify.sanitize(html, {
    RETURN_DOM_FRAGMENT: true,
    USE_PROFILES: { html: true },
    FORBID_TAGS: ['style', 'form', 'input', 'button', 'textarea', 'select', 'iframe', 'object', 'embed'],
    FORBID_ATTR: ['style', 'srcset'],
  });
  for (const image of fragment.querySelectorAll('img')) {
    image.src = assetURL(image.getAttribute('src'));
    image.referrerPolicy = 'no-referrer';
    image.loading = 'lazy';
    image.addEventListener('error', () => {
      const note = el('span', 'math-error', `Image unavailable${image.alt ? ': ' + image.alt : '.'}`);
      image.replaceWith(note);
    }, { once: true });
  }
  for (const link of fragment.querySelectorAll('a')) {
    const href = link.getAttribute('href') || '';
    if (!/^https?:\/\//i.test(href) && !href.startsWith('#')) link.removeAttribute('href');
    else { link.target = '_blank'; link.rel = 'noopener noreferrer'; }

}
function answerValue(answer) {
  if (!answer) return el('span');
  const type = short(answer.type);
  if (type === 'image') {
    const holder = el('div', 'prose');
    const img = el('img'); img.src = assetURL(answer.value); img.alt = 'Answer option';
    holder.append(img); return holder;
  }
  const value = String(answer.value ?? '');
  return markdown(type === 'math' && !/^\s*(\$|\\\[|\\\()/.test(value) ? '$' + value + '$' : value);
}
function choiceOrder(choices, seed) {
  const hash = value => { let n = 2166136261; for (const c of value) n = Math.imul(n ^ c.charCodeAt(0), 16777619); return n >>> 0; };
  return [...choices].sort((a, b) => hash(`${seed}:${a.id}`) - hash(`${seed}:${b.id}`));
}
function fieldControl(field, readOnly, itemId, promptText = '', status = '') {
  const set = el('fieldset', 'answer-field');
  set.dataset.fieldId = String(field.id);
  set.dataset.type = short(field.type);
  const label = field.key === 'selection' ? 'Choose an answer' : fieldLabel(field.key);
  set.append(el('legend', field.key === 'selection' || short(field.type) === 'checkbox' ? 'sr-only' : '', label));
  const type = short(field.type), response = field.response;
  const choices = choiceOrder(field.choices || [], `${itemId}:${field.id}`);
  const responseId = response?.choiceId ?? response?.id;
  const checklist = checkboxControl(field, label => answerValue({ type: 'text', value: label }), readOnly);
  if (checklist) {
    set.append(checklist);
  } else if (type === 'free') {
    set.append(freeInput(field, label, field.id, value => markdown(value), typeset, readOnly));
  } else if (type === 'blank') {
    set.append(blankInput(field, label, field.id, readOnly));
  } else if (type === 'radio') {
    const list = el('div', 'choices');
    for (const choice of choices) {
      const option = el('label', 'choice');
      const input = el('input'); input.type = 'radio'; input.name = String(field.id); input.value = String(choice.id);
      input.checked = String(responseId) === String(choice.id); input.disabled = readOnly;
      option.append(choiceIndicator(input), answerValue(choice)); list.append(option);
    }
    set.append(list);
  } else if (type === 'select') {
    const select = el('select', 'answer-select'); select.name = String(field.id); select.disabled = readOnly;
    select.setAttribute('aria-label', label);
    const placeholder = el('option', '', 'Select an answer…'); placeholder.value = ''; select.append(placeholder);
    choices.forEach(choice => {
      const option = el('option', '', choice.value);
      option.value = String(choice.id); option.selected = String(responseId) === String(choice.id); select.append(option);
    });
    select.value = responseId == null ? '' : String(responseId);
    set.append(richSelect(select, choices, answerValue, answer => answer.id, typeset));
  }

    input.dataset.answerInput = 'true'; input.dataset.readOnly = String(readOnly);
  }
  fieldFeedback(set, field, status);
  return set;
}
function fieldLabel(key) {
  if (!key || key === 'selection') return 'Answer';
  const numbered = /^field-(\d+)$/.exec(key);
  return numbered ? `Answer ${numbered[1]}` : `Answer: ${key}`;
}

await loadMathInputs(); await MathJax.startup.promise;

 MathJax.typesetClear([main]); main.replaceChildren();

 article.dataset.entity=data.entity; main.append(article);
 const prompt=markdown(data.problem,'prose',fields),rest=el('div','answer-fields'); article.append(prompt,rest);
 mountInlineFields(prompt,rest,fields,f=>fieldControl(f,false,data.entity,data.problem,''));
 await MathJax.typesetPromise([main]);
 await Promise.all([...article.querySelectorAll('img')].map(i=>{i.loading='eager';return i.decode().catch(()=>{});}));
 await document.fonts.ready; await new Promise(requestAnimationFrame);
 const controls=[...article.querySelectorAll('[data-answer-input="true"]')];
 const initial=controls.map(n=>{const r=n.getBoundingClientRect();return {id:Number(n.getAttribute('name')),key:n.closest('[data-field-key]')?.dataset.fieldKey,label:n.getAttribute('aria-label'),tag:n.localName,width:r.width,height:r.height,left:r.left,right:r.right,visible:getComputedStyle(n).display!=='none'&&getComputedStyle(n).visibility!=='hidden',enabled:!n.disabled,tabIndex:n.tabIndex};});
 let access=[];
 for(const n of controls){
   n.scrollIntoView({block:'center',inline:'nearest'}); n.focus(); await new Promise(requestAnimationFrame);
   const r=n.getBoundingClientRect(),x=(r.left+r.right)/2,y=(r.top+r.bottom)/2,hit=document.elementFromPoint(x,y);
   access.push({id:Number(n.getAttribute('name')),focused:document.activeElement===n||n.matches(':focus-within')||Boolean(n.hasFocus?.()),activeTag:document.activeElement?.localName,activeClass:document.activeElement?.className,mathFocus:n.hasFocus?.(),centerInViewport:x>=0&&x<innerWidth&&y>=0&&y<innerHeight,pointerReachable:hit===n||n.contains(hit),rect:{left:r.left,right:r.right,top:r.top,bottom:r.bottom}});
   n.blur();
 }
 window.scrollTo(0,0); await new Promise(requestAnimationFrame);
 const plain=prompt.cloneNode(true);plain.querySelectorAll('mjx-container,pre,code,math-field').forEach(n=>n.remove());
 return {entity:data.entity,expectedFields:fields.length,expectedKeys:fields.map(f=>f.key).sort(),expectedIds:fields.map(f=>f.id).sort(),placeholderKeys:data.placeholderKeys,controls:initial,access,
  actualKeys:initial.map(x=>x.key).sort(),actualIds:initial.map(x=>x.id).sort(),matrix:data.matrix,tableControls:prompt.querySelectorAll('.matrix-answer td [data-answer-input="true"]').length,
  detachedControls:rest.querySelectorAll('[data-answer-input="true"]').length,remainingPlaceholders:[...prompt.querySelectorAll('[data-field-key]')].filter(n=>!n.querySelector('[data-answer-input="true"]')).map(n=>n.dataset.fieldKey),
  contentOverflow:prompt.scrollWidth>prompt.clientWidth+1,articleOverflow:article.scrollWidth>article.clientWidth+1,pageOverflow:document.documentElement.scrollWidth>innerWidth+1,
  mathErrors:[...article.querySelectorAll('[data-mjx-error],mjx-merror,[data-mml-node="mtext"][fill="red"]')].map(n=>n.outerHTML),
  codeBlocks:[...article.querySelectorAll('pre')].map(n=>n.textContent),rawTex:/\$|\\(?:begin|end|left|right|text|frac)\b/.test(plain.textContent)?plain.textContent:null};
};window.ready=true;
</script>
