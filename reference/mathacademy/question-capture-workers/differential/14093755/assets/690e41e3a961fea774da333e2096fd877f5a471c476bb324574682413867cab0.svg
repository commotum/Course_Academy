<title id="MathJax-SVG-4-Title">
y(x) \sim 
\fbox{<mjx-container class="MathJax CtxtMenu_Attached_0" jax="CHTML" tabindex="0" ctxtmenu_counter="5" style="font-size: 113.1%; position: relative;"><mjx-math class="MJX-TEX" aria-hidden="true"><mjx-texatom texclass="ORD"><mjx-mphantom><mjx-mi class="mjx-i"><mjx-c class="mjx-c1D434 TEX-I"></mjx-c></mjx-mi><mjx-mi class="mjx-i"><mjx-c class="mjx-c1D434 TEX-I"></mjx-c></mjx-mi><mjx-mi class="mjx-i"><mjx-c class="mjx-c1D434 TEX-I"></mjx-c></mjx-mi></mjx-mphantom></mjx-texatom><mjx-mo class="mjx-n"><mjx-c class="mjx-c3F"></mjx-c></mjx-mo><mjx-texatom texclass="ORD"><mjx-mphantom><mjx-mi class="mjx-i"><mjx-c class="mjx-c1D434 TEX-I"></mjx-c></mjx-mi><mjx-mi class="mjx-i"><mjx-c class="mjx-c1D434 TEX-I"></mjx-c></mjx-mi><mjx-mi class="mjx-i"><mjx-c class="mjx-c1D434 TEX-I"></mjx-c></mjx-mi></mjx-mphantom></mjx-texatom></mjx-math><mjx-assistive-mml unselectable="on" display="inline"><math xmlns="http://www.w3.org/1998/Math/MathML"><mrow data-mjx-texclass="ORD"><mphantom><mi>A</mi><mi>A</mi><mi>A</mi></mphantom></mrow><mo>?</mo><mrow data-mjx-texclass="ORD"><mphantom><mi>A</mi><mi>A</mi><mi>A</mi></mphantom></mrow></math></mjx-assistive-mml></mjx-container>}
+ \sum_{n=1}^\infty 
\dfrac{16(-1)^n}{n^2\pi^3\left(28-n^2\right)} \sin\left(\dfrac{n\pi x}{2}\right)
</title>
