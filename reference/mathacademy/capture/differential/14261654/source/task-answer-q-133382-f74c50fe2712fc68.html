<div id="source-question"><div class="questionText"><p>Suppose that a function <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>f</mi><mo stretchy="false">(</mo><mi>x</mi><mo>,</mo><mi>y</mi><mo>,</mo><mi>z</mi><mo stretchy="false">)</mo></math> and all of its higher-order partial derivatives are continuous on an open set <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>U</mi><mo>,</mo></math> and that</p>
<p><math xmlns="http://www.w3.org/1998/Math/MathML" display="true"><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><msup><mi>∂</mi><mn>2</mn></msup><mi>f</mi></mrow><mrow><mi>∂</mi><msup><mi>y</mi><mn>2</mn></msup></mrow></mfrac></mstyle><mo>=</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><mi>x</mi><msup><mi>e</mi><mrow data-mjx-texclass="ORD"><mi>y</mi><mi>z</mi></mrow></msup></mrow><mrow><mi>x</mi><mo>+</mo><mi>y</mi></mrow></mfrac></mstyle><mo>,</mo><mstyle scriptlevel="0"><mspace width="2em"></mspace></mstyle><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><msup><mi>∂</mi><mn>2</mn></msup><mi>f</mi></mrow><mrow><mi>∂</mi><mi>x</mi><mi>∂</mi><mi>z</mi></mrow></mfrac></mstyle><mo>=</mo><mo>−</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><mi>z</mi><msup><mi>e</mi><mrow data-mjx-texclass="ORD"><mi>y</mi><mi>z</mi></mrow></msup></mrow><mrow><mi>x</mi><mo>+</mo><mi>y</mi></mrow></mfrac></mstyle><mo>.</mo></math> </p>
<p>Evaluate the following expression at the point <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mo stretchy="false">(</mo><mn>1</mn><mo>,</mo><mn>1</mn><mo>,</mo><mn>0</mn><mo stretchy="false">)</mo><mrow data-mjx-texclass="BIN"><mo>:</mo></mrow></math></p>
<p><math xmlns="http://www.w3.org/1998/Math/MathML" display="true"><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><msup><mi>∂</mi><mn>3</mn></msup><mi>f</mi></mrow><mrow><mi>∂</mi><mi>y</mi><mi>∂</mi><mi>x</mi><mi>∂</mi><mi>y</mi></mrow></mfrac></mstyle><mo>+</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><msup><mi>∂</mi><mn>3</mn></msup><mi>f</mi></mrow><mrow><mi>∂</mi><mi>z</mi><mi>∂</mi><mi>x</mi><mi>∂</mi><mi>z</mi></mrow></mfrac></mstyle></math></p>
