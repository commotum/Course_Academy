<div id="source-question"><div class="questionText"><p>Given that <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>X</mi></math> is a <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>2</mn><mo>×</mo><mn>4</mn></math> matrix, <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>Y</mi></math> is a <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>4</mn><mo>×</mo><mn>2</mn></math> matrix, and <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>Z</mi></math> is a <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>4</mn><mo>×</mo><mn>4</mn></math> matrix, in which of the following expressions are the Hadamard products well-defined?</p>
<ol class="questionStatements"><li>  <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>X</mi><mi>Y</mi><mo>⊙</mo><mi>Z</mi></math> </li><li>  <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>Y</mi><mi>X</mi><mo>⊙</mo><msup><mi>Z</mi><mi>T</mi></msup></math> </li><li>  <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mo stretchy="false">(</mo><mi>X</mi><mi>Y</mi><msup><mo stretchy="false">)</mo><mi>T</mi></msup><mo>⊙</mo><mi>Z</mi></math> </li></ol></div><table class="questionWidget-choicesTable"><tbody><tr><td><span class="choiceLetterCircle" id="source-choice-1">a</span></td><td class="choiceText"> II only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-2">b</span></td><td class="choiceText"> I only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-3">c</span></td><td class="choiceText"> III only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-4">d</span></td><td class="choiceText"> I and II only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-5">e</span></td><td class="choiceText"> II and III only</td></tr></tbody></table></div>
