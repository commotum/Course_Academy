<div id="questionExplanation-107246" class="questionExplanation" style="display: block;"><p>The solid is a <strong>right cylinder</strong>. </p>
<p>Notice the following:</p>
<ul>
<li><p>The solid has two parallel circular bases. So, it's a cylinder. </p>
</li>
<li><p>The axis that passes through the centers of the circles is perpendicular to the bases. So, it's right.</p>
</li>
</ul>
</div>
