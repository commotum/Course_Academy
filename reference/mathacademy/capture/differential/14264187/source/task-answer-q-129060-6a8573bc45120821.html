<div id="source-question"><div class="questionText"><p>The level curves of the function <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>f</mi><mo stretchy="false">(</mo><mi>x</mi><mo>,</mo><mi>y</mi><mo stretchy="false">)</mo><mo>=</mo><mi>x</mi><msup><mi>y</mi><mn>2</mn></msup><mo>−</mo><msup><mi>x</mi><mn>2</mn></msup><mi>y</mi></math> are given by <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>f</mi><mo stretchy="false">(</mo><mi>x</mi><mo>,</mo><mi>y</mi><mo stretchy="false">)</mo><mo>=</mo><mi>c</mi><mo>.</mo></math> Which of the following statements are true?</p>
<ol class="questionStatements"><li>  <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>c</mi><mo>=</mo><mo>−</mo><mn>1</mn></math> gives a parabola </li><li>  <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>c</mi><mo>=</mo><mn>0</mn></math> gives the <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>y</mi></math>-axis, the <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>x</mi></math>-axis and the line <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>y</mi><mo>=</mo><mi>x</mi></math> </li><li>  <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>c</mi><mo>=</mo><mn>1</mn></math> gives the line <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>y</mi><mo>=</mo><mn>2</mn><mi>x</mi></math> </li></ol></div><table class="questionWidget-choicesTable"><tbody><tr><td><span class="choiceLetterCircle" id="source-choice-1">a</span></td><td class="choiceText">II only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-2">b</span></td><td class="choiceText">III only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-3">c</span></td><td class="choiceText">I only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-4">d</span></td><td class="choiceText">I and III only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-5">e</span></td><td class="choiceText">None of the listed</td></tr></tbody></table></div>
