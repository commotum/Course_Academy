<title id="MathJax-SVG-3-Title">
	\eqalign{
\dfrac{x}{\sqrt{2}-\sqrt{x}} &amp;= <span>\</span>[5pt]
\dfrac{x}{\sqrt{2}-\sqrt{x}} \cdot \dfrac{\sqrt{2}+\sqrt{x}}{\sqrt{2}+\sqrt{x}} &amp;= <span>\</span>[5pt]
\dfrac{x(\sqrt{2}+\sqrt{x}) }{(\sqrt{2}-\sqrt{x})(\sqrt{2}+\sqrt{x})} &amp;= <span>\</span>[5pt]
\dfrac{x(\sqrt{2}+\sqrt{x}) }{(\sqrt{2})^2-(\sqrt{x})^2} &amp;= <span>\</span>[5pt]
\dfrac{x(\sqrt{2}+\sqrt{x}) }{2-x} 
	}
</title>
