<div id="source-question"><div class="questionText"><p>Which of the following statements are true regarding the limit given below?
<math xmlns="http://www.w3.org/1998/Math/MathML" display="true"><munder><mo data-mjx-texclass="OP" movablelimits="true">lim</mo><mrow data-mjx-texclass="ORD"><mrow data-mjx-texclass="ORD"><mi mathvariant="bold">x</mi></mrow><mo accent="false" stretchy="false">→</mo><mo stretchy="false">(</mo><mn>0</mn><mo>,</mo><mn>0</mn><mo stretchy="false">)</mo></mrow></munder><mstyle scriptlevel="0"><mspace width="0.167em"></mspace></mstyle><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><mn>2</mn><mi>x</mi><mi>y</mi></mrow><mrow><mn>3</mn><msup><mi>y</mi><mn>2</mn></msup><mo>−</mo><msup><mi>x</mi><mn>2</mn></msup></mrow></mfrac></mstyle></math></p>
<ol class="questionStatements"><li>  The limit evaluates to <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>0</mn></math> along the path <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>y</mi><mo>=</mo><mn>0</mn></math> </li><li>  The limit evaluates to <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mstyle displaystyle="true" scriptlevel="0"><mfrac><mn>2</mn><mn>3</mn></mfrac></mstyle></math> along the path <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>y</mi><mo>=</mo><mi>x</mi></math> </li><li>  The limit does not exist </li></ol></div><table class="questionWidget-choicesTable"><tbody><tr><td><span class="choiceLetterCircle" id="source-choice-1">a</span></td><td class="choiceText">I and III only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-2">b</span></td><td class="choiceText">II and III only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-3">c</span></td><td class="choiceText">III only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-4">d</span></td><td class="choiceText">I, II, and III </td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-5">e</span></td><td class="choiceText">II only</td></tr></tbody></table></div>
