<div id="source-question"><div class="questionText"><p>Which of the following statements are true?</p>
<ol class="questionStatements"><li>  <strong>If</strong> <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>3</mn><mo>+</mo><mn>4</mn><mo>&lt;</mo><mn>5</mn><mo>,</mo></math> <strong>then</strong> <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>2</mn><mo>+</mo><mn>7</mn><mo>&lt;</mo><mn>5.</mn></math> </li><li>  <strong>If</strong> <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>2</mn><mo>+</mo><mn>4</mn><mo>&lt;</mo><mn>7</mn><mo>,</mo></math> <strong>then</strong> <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>1</mn><mo>+</mo><mn>5</mn><mo>&lt;</mo><mn>4.</mn></math> </li><li>  <strong>If</strong> <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>2</mn><mo>+</mo><mn>3</mn><mo>&lt;</mo><mn>4</mn><mo>,</mo></math> <strong>then</strong> <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>3</mn><mo>+</mo><mn>2</mn><mo>&lt;</mo><mn>1.</mn></math> </li></ol></div><table class="questionWidget-choicesTable"><tbody><tr><td><span class="choiceLetterCircle" id="source-choice-1">a</span></td><td class="choiceText">I and III only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-2">b</span></td><td class="choiceText">I and II only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-3">c</span></td><td class="choiceText">II and III only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-4">d</span></td><td class="choiceText">III only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-5">e</span></td><td class="choiceText">II only</td></tr></tbody></table></div>
