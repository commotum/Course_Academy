<div id="source-question"><div class="questionText"><p>A surface <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>S</mi></math> is defined by <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>z</mi><mo>=</mo><mi>f</mi><mo stretchy="false">(</mo><mi>x</mi><mo>,</mo><mi>y</mi><mo stretchy="false">)</mo><mo>.</mo></math> The curve <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>C</mi></math> is the intersection of <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>S</mi></math> with the plane <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>x</mi><mo>=</mo><mn>1.</mn></math> Given that the point <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>P</mi><mo stretchy="false">(</mo><mn>1</mn><mo>,</mo><mn>1</mn><mo>,</mo><mo>−</mo><mn>1</mn><mo stretchy="false">)</mo></math> lies on <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>C</mi></math>, and that <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><msub><mi>f</mi><mi>y</mi></msub><mo>=</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><msup><mi>e</mi><mi>x</mi></msup><mo>−</mo><msup><mi>e</mi><mi>y</mi></msup></mrow><mrow><mn>2</mn><mi>x</mi></mrow></mfrac></mstyle><mo>+</mo><mn>2</mn><mi>y</mi></math>, find the slope of the tangent to <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>C</mi></math> at <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>P</mi><mo>.</mo></math> </p>
