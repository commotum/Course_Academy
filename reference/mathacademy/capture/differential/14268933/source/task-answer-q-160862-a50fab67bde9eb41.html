<div id="source-question"><div class="questionText"><p>Let <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>U</mi></math> be the set of polynomials of the form <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>a</mi><msup><mi>x</mi><mn>5</mn></msup><mo>,</mo></math> where <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>a</mi><mo>∈</mo><mrow data-mjx-texclass="ORD"><mi mathvariant="double-struck">R</mi></mrow><mo>.</mo></math> Which of the following statements are true?</p>
<ol class="questionStatements"><li>  <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>f</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo>∈</mo><mi>U</mi><mo>,</mo></math> where <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>f</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo>=</mo><mn>5</mn><msup><mi>x</mi><mn>3</mn></msup><mo>.</mo></math> </li><li>  For any <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>p</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo>∈</mo><mi>U</mi></math> and <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>k</mi><mo>∈</mo><mrow data-mjx-texclass="ORD"><mi mathvariant="double-struck">R</mi></mrow><mo>,</mo></math> we have <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>k</mi><mo>⋅</mo><mi>p</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo>∈</mo><mi>U</mi><mo>.</mo></math> </li><li>  The set is closed under scalar multiplication. </li></ol></div><table class="questionWidget-choicesTable"><tbody><tr><td><span class="choiceLetterCircle" id="source-choice-1">a</span></td><td class="choiceText">II and III only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-2">b</span></td><td class="choiceText">I only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-3">c</span></td><td class="choiceText">II only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-4">d</span></td><td class="choiceText">III only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-5">e</span></td><td class="choiceText">I and II only</td></tr></tbody></table></div>
