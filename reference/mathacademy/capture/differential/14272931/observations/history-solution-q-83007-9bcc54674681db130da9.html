<div id="questionExplanation-83007" class="questionExplanation" style="display: block;"><p></p><p>First, let's write the sentence more concisely:</p><p></p>
<blockquote>
<p>"The juice is strawberry or orange."</p>
</blockquote>
<p>Using the commutative law, we can swap the order of the words "strawberry" and "orange." The sentence now reads</p>
<blockquote>
<p>"The juice is orange or strawberry."</p>
</blockquote>
