<div id="source-question"><div class="questionText"><p>Which of the following statements are true about the function <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>f</mi><mo stretchy="false">(</mo><mi>x</mi><mo>,</mo><mi>y</mi><mo>,</mo><mi>z</mi><mo stretchy="false">)</mo><mo>=</mo><msqrt><mi>z</mi><mo>+</mo><mi>y</mi><mo>−</mo><msup><mi>x</mi><mn>2</mn></msup></msqrt><mo>?</mo></math></p>
<ol class="questionStatements"><li>  The partial derivative with respect to <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>x</mi></math> is defined at <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mo stretchy="false">(</mo><mn>0</mn><mo>,</mo><mn>0</mn><mo>,</mo><mn>1</mn><mo stretchy="false">)</mo></math> </li><li>  <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><msub><mi>f</mi><mi>y</mi></msub><mo stretchy="false">(</mo><mn>1</mn><mo>,</mo><mn>2</mn><mo>,</mo><mn>0</mn><mo stretchy="false">)</mo></math> is defined </li><li>  <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><msub><mi>f</mi><mi>z</mi></msub><mo stretchy="false">(</mo><mn>1</mn><mo>,</mo><mn>1</mn><mo>,</mo><mn>0</mn><mo stretchy="false">)</mo></math> is defined </li></ol></div><table class="questionWidget-choicesTable"><tbody><tr><td><span class="choiceLetterCircle" id="source-choice-1">a</span></td><td class="choiceText">I and II only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-2">b</span></td><td class="choiceText">I and III only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-3">c</span></td><td class="choiceText">II and III only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-4">d</span></td><td class="choiceText">II only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-5">e</span></td><td class="choiceText">I only</td></tr></tbody></table></div>
