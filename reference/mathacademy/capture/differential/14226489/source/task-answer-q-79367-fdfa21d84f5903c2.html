<div id="source-question"><div class="questionText"><p>Which of the following statements are true given that <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>A</mi></math> is a <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>5</mn><mo>×</mo><mn>5</mn></math> matrix with <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>3</mn></math> pivot columns?</p>
