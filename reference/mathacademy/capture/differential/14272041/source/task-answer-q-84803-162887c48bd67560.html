<div id="source-question"><div class="questionText"><p>A fair <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>12</mn></math>-sided die with numbers <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>1</mn></math> through <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>12</mn></math> is rolled <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>20</mn></math> times. What is the probability that we get a number greater than <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>10</mn></math> more than <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>2</mn></math> times? Round your answer to <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>3</mn></math> decimal places.</p>
