<div id="source-question"><div class="questionText"><p>A publisher has noticed that the minimum time needed to review a book is <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>115</mn></math> working days, and the maximum time is <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>235</mn></math> days. Assuming that the review time is uniformly distributed, what is the variance of the time needed to review a book?</p>
