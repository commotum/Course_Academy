<p>The chain rule can be extended in the natural way as follows:</p>
<p><span class="mjpage mjpage__block"><svg xmlns:xlink="http://www.w3.org/1999/xlink" width="32.096ex" height="9.509ex" style="vertical-align: -6.005ex; margin-right: -0.056ex;" viewBox="0 -1508.9 13819.2 4094.3" role="img" focusable="false" xmlns="http://www.w3.org/2000/svg" aria-labelledby="MathJax-SVG-2-Title">
<title id="MathJax-SVG-2-Title">
\dfrac{\textrm d}{\textrm d \mathbf x} \mathbf{f}(\mathbf{z}(\mathbf{y}(\mathbf x))) 
= 
\underbrace{\dfrac{\textrm d\mathbf f}{\textrm d \mathbf z}}_{m\times q} 
\cdot 
\underbrace{\dfrac{\textrm d\mathbf z}{\textrm d \mathbf y}}_{q\times p} 
\cdot 
\underbrace{\dfrac{\textrm d\mathbf y}{\textrm d \mathbf x}}_{p\times n} 
</title>
