<div id="source-question"><div class="questionText"><p>Consider the vector field <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mrow data-mjx-texclass="ORD"><mi mathvariant="bold">F</mi></mrow></math> and the surface <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>S</mi></math> with parametrization <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mrow data-mjx-texclass="ORD"><mi mathvariant="bold">r</mi></mrow><mo stretchy="false">(</mo><mi>u</mi><mo>,</mo><mi>v</mi><mo stretchy="false">)</mo><mo>,</mo></math> where</p>
<p><math xmlns="http://www.w3.org/1998/Math/MathML" display="true"><mrow data-mjx-texclass="ORD"><mi mathvariant="bold">F</mi></mrow><mo stretchy="false">(</mo><mi>x</mi><mo>,</mo><mi>y</mi><mo>,</mo><mi>z</mi><mo stretchy="false">)</mo><mo>=</mo><mrow data-mjx-texclass="INNER"><mo data-mjx-texclass="OPEN">⟨</mo><mi>x</mi><mo>,</mo><mstyle scriptlevel="0"><mspace width="0.222em"></mspace></mstyle><mi>y</mi><mo>,</mo><mstyle scriptlevel="0"><mspace width="0.222em"></mspace></mstyle><mi>x</mi><mi>z</mi><mo data-mjx-texclass="CLOSE">⟩</mo></mrow><mo>,</mo><mstyle scriptlevel="0"><mspace width="1em"></mspace></mstyle><mrow data-mjx-texclass="ORD"><mi mathvariant="bold">r</mi></mrow><mo stretchy="false">(</mo><mi>u</mi><mo>,</mo><mi>v</mi><mo stretchy="false">)</mo><mo>=</mo><mrow data-mjx-texclass="INNER"><mo data-mjx-texclass="OPEN">⟨</mo><mi>u</mi><mo>,</mo><mstyle scriptlevel="0"><mspace width="0.222em"></mspace></mstyle><msup><mi>v</mi><mn>2</mn></msup><mo>,</mo><mstyle scriptlevel="0"><mspace width="0.222em"></mspace></mstyle><mi>u</mi><mi>v</mi><mo data-mjx-texclass="CLOSE">⟩</mo></mrow><mo>,</mo><mstyle scriptlevel="0"><mspace width="1em"></mspace></mstyle><mo stretchy="false">(</mo><mi>u</mi><mo>,</mo><mi>v</mi><mo stretchy="false">)</mo><mo>∈</mo><mi>D</mi><mo>⊂</mo><msup><mrow data-mjx-texclass="ORD"><mi mathvariant="double-struck">R</mi></mrow><mn>2</mn></msup><mo>.</mo></math></p>
<p>If the flux of <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mrow data-mjx-texclass="ORD"><mi mathvariant="bold">F</mi></mrow></math> across <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>S</mi></math> with respect to <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mrow data-mjx-texclass="ORD"><mi mathvariant="bold">n</mi></mrow></math> is given by</p>
<p><math xmlns="http://www.w3.org/1998/Math/MathML" display="true"><munder><mo data-mjx-texclass="OP">∬</mo><mi>S</mi></munder><mrow data-mjx-texclass="ORD"><mi mathvariant="bold">F</mi></mrow><mo>⋅</mo><mtext>d</mtext><mrow data-mjx-texclass="ORD"><mi mathvariant="bold">S</mi></mrow><mo>=</mo><munder><mo data-mjx-texclass="OP">∬</mo><mi>D</mi></munder><mstyle mathbackground="Gainsboro"><mpadded height="+2pt" depth="+2pt" lspace="2pt" width="+4pt"><mi>a</mi></mpadded></mstyle><msup><mi>u</mi><mn>2</mn></msup><msup><mi>v</mi><mn>2</mn></msup><mo>+</mo><mstyle mathbackground="Gainsboro"><mpadded height="+2pt" depth="+2pt" lspace="2pt" width="+4pt"><mi>b</mi></mpadded></mstyle><mi>u</mi><msup><mi>v</mi><mn>2</mn></msup><mstyle scriptlevel="0"><mspace width="0.222em"></mspace></mstyle><mtext>d</mtext><mi>A</mi></math></p>
<p>what is the value of <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>a</mi><mo>+</mo><mi>b</mi><mo>?</mo></math></p>
