<div id="source-question"><div class="questionText"><p>A linear system of ODEs has the equilibrium at <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><msup><mrow data-mjx-texclass="ORD"><mi mathvariant="bold">x</mi></mrow><mo>∗</mo></msup><mo>=</mo><mo stretchy="false">[</mo><mn>1</mn><mo>,</mo><mstyle scriptlevel="0"><mspace width="0.167em"></mspace></mstyle><mo>−</mo><mn>1</mn><msup><mo stretchy="false">]</mo><mi>T</mi></msup><mo>.</mo></math> Two linearly independent eigenvectors of the system's matrix are <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><msub><mrow data-mjx-texclass="ORD"><mi mathvariant="bold">v</mi></mrow><mn>1</mn></msub></math> and <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><msub><mrow data-mjx-texclass="ORD"><mi mathvariant="bold">v</mi></mrow><mn>2</mn></msub><mo>.</mo></math> After shifting using <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mrow data-mjx-texclass="ORD"><mi mathvariant="bold">u</mi></mrow><mo>=</mo><mrow data-mjx-texclass="ORD"><mi mathvariant="bold">x</mi></mrow><mo>−</mo><msup><mrow data-mjx-texclass="ORD"><mi mathvariant="bold">x</mi></mrow><mo>∗</mo></msup><mo>,</mo></math> the system becomes <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><msup><mrow data-mjx-texclass="ORD"><mi mathvariant="bold">u</mi></mrow><mo data-mjx-alternate="1">′</mo></msup><mo>=</mo><mi>A</mi><mrow data-mjx-texclass="ORD"><mi mathvariant="bold">u</mi></mrow><mo>.</mo></math> Which of the following is <strong>guaranteed</strong> to be an eigenvector of the matrix <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>A</mi><mo>?</mo></math></p>
</div><table class="questionWidget-choicesTable"><tbody><tr><td><span class="choiceLetterCircle" id="source-choice-1">a</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mo>−</mo><msub><mrow data-mjx-texclass="ORD"><mi mathvariant="bold">v</mi></mrow><mn>2</mn></msub></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-2">b</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mrow data-mjx-texclass="ORD"><mn mathvariant="bold">0</mn></mrow></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-3">c</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><msup><mrow data-mjx-texclass="ORD"><mi mathvariant="bold">x</mi></mrow><mo>∗</mo></msup></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-4">d</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><msub><mrow data-mjx-texclass="ORD"><mi mathvariant="bold">v</mi></mrow><mn>1</mn></msub><mo>+</mo><msup><mrow data-mjx-texclass="ORD"><mi mathvariant="bold">x</mi></mrow><mo>∗</mo></msup></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-5">e</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><msub><mrow data-mjx-texclass="ORD"><mi mathvariant="bold">v</mi></mrow><mn>2</mn></msub><mo>−</mo><msup><mrow data-mjx-texclass="ORD"><mi mathvariant="bold">x</mi></mrow><mo>∗</mo></msup></math></td></tr></tbody></table></div>
