<div id="source-question"><div class="questionText"><p>Suppose <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>X</mi></math> and <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>Y</mi></math> are discrete random variables. Let the joint CDF of <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>X</mi></math> and <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>Y</mi></math> be <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>F</mi><mo stretchy="false">(</mo><mi>x</mi><mo>,</mo><mi>y</mi><mo stretchy="false">)</mo><mo>,</mo></math> where the supports of <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>X</mi></math> and <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>Y</mi></math>, respectively, are</p>
<p><math xmlns="http://www.w3.org/1998/Math/MathML" display="true"><msub><mi>S</mi><mi>X</mi></msub><mo>=</mo><mo fence="false" stretchy="false">{</mo><mn>1</mn><mo>,</mo><mn>2</mn><mo>,</mo><mn>3</mn><mo>,</mo><mn>4</mn><mo fence="false" stretchy="false">}</mo><mo>,</mo><mstyle scriptlevel="0"><mspace width="1em"></mspace></mstyle><msub><mi>S</mi><mi>Y</mi></msub><mo>=</mo><mo fence="false" stretchy="false">{</mo><mn>0</mn><mo>,</mo><mn>1</mn><mo>,</mo><mn>2</mn><mo>,</mo><mn>3</mn><mo fence="false" stretchy="false">}</mo><mo>.</mo></math></p>
<p>Find an expression for the corresponding joint CDF when <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>x</mi><mo>&gt;</mo><mn>4</mn><mo>,</mo><mi>y</mi><mo>&gt;</mo><mn>3.</mn></math></p>
