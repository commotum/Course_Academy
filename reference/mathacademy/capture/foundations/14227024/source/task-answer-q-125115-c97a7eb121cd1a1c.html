<div id="source-question"><div class="questionText"><p>Which of the following is equivalent to the integral <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mstyle displaystyle="true" scriptlevel="0"><munder><mo data-mjx-texclass="OP">∫</mo><mrow data-mjx-texclass="ORD"><mi>C</mi></mrow></munder><mrow data-mjx-texclass="ORD"><mi mathvariant="bold">F</mi></mrow><mo>⋅</mo><mtext>d</mtext><mrow data-mjx-texclass="ORD"><mi mathvariant="bold">r</mi></mrow><mo>,</mo></mstyle></math> where <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mrow data-mjx-texclass="ORD"><mi mathvariant="bold">F</mi></mrow><mo stretchy="false">(</mo><mi>x</mi><mo>,</mo><mi>y</mi><mo stretchy="false">)</mo><mo>=</mo><msup><mi>x</mi><mn>2</mn></msup><mstyle scriptlevel="0"><mspace width="0.167em"></mspace></mstyle><mrow data-mjx-texclass="ORD"><mi mathvariant="bold">i</mi></mrow><mo>+</mo><mi>ln</mi><mo data-mjx-texclass="NONE">⁡</mo><mrow data-mjx-texclass="ORD"><mi>y</mi></mrow><mstyle scriptlevel="0"><mspace width="0.167em"></mspace></mstyle><mrow data-mjx-texclass="ORD"><mi mathvariant="bold">j</mi></mrow></math> and <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>C</mi></math> is the curve <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>y</mi><mo>=</mo><msup><mi>e</mi><mrow data-mjx-texclass="ORD"><mn>2</mn><mi>x</mi></mrow></msup></math> traversed from the point <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>A</mi><mo stretchy="false">(</mo><mn>0</mn><mo>,</mo><mn>1</mn><mo stretchy="false">)</mo></math> to the point <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>B</mi><mo stretchy="false">(</mo><mn>1</mn><mo>,</mo><msup><mi>e</mi><mn>2</mn></msup><mo stretchy="false">)</mo><mo>?</mo></math></p>
<p><em>Hint: Use the parametrization <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mrow data-mjx-texclass="ORD"><mi mathvariant="bold">r</mi></mrow><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>=</mo><mi>t</mi><mstyle scriptlevel="0"><mspace width="0.167em"></mspace></mstyle><mrow data-mjx-texclass="ORD"><mi mathvariant="bold">i</mi></mrow><mo>+</mo><msup><mi>e</mi><mrow data-mjx-texclass="ORD"><mn>2</mn><mi>t</mi></mrow></msup><mstyle scriptlevel="0"><mspace width="0.167em"></mspace></mstyle><mrow data-mjx-texclass="ORD"><mi mathvariant="bold">j</mi></mrow><mo>.</mo></math></em></p>
