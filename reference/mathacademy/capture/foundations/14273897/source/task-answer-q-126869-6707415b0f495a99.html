</li>
<li><p><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><msub><mi>C</mi><mn>2</mn></msub></math> is parametrized by <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><msub><mrow data-mjx-texclass="ORD"><mi mathvariant="bold">r</mi></mrow><mn>2</mn></msub><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>=</mo><mstyle scriptlevel="0"><mspace width="0.222em"></mspace></mstyle><mrow data-mjx-texclass="ORD"><mi mathvariant="bold">i</mi></mrow><mo>−</mo><mi>t</mi><mstyle scriptlevel="0"><mspace width="0.222em"></mspace></mstyle><mrow data-mjx-texclass="ORD"><mi mathvariant="bold">j</mi></mrow></math> for <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>t</mi><mo>∈</mo><mrow data-mjx-texclass="INNER"><mo data-mjx-texclass="OPEN">[</mo><mo>−</mo><mn>1</mn><mo>,</mo><mn>1</mn><mo data-mjx-texclass="CLOSE">]</mo></mrow><mo>.</mo></math></p>
</li>

<p>Use Green's theorem to find the area of the region.</p>
