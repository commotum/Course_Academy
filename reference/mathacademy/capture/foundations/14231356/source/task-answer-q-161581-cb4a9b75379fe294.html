<div id="source-question"><div class="questionText"><p>Evaluate the triple integral </p>
<p><math xmlns="http://www.w3.org/1998/Math/MathML" display="true"><mstyle displaystyle="true" scriptlevel="0"><munder><mo data-mjx-texclass="OP">∭</mo><mi>R</mi></munder><mi>y</mi><mstyle scriptlevel="0"><mspace width="0.222em"></mspace></mstyle><mrow data-mjx-texclass="ORD"><mi mathvariant="normal">d</mi></mrow><mi>V</mi></mstyle></math></p>
<p>where the region <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>R</mi></math> is given by
<math xmlns="http://www.w3.org/1998/Math/MathML" display="true"><mi>R</mi><mo>=</mo><mrow data-mjx-texclass="INNER"><mo data-mjx-texclass="OPEN">{</mo><mo stretchy="false">(</mo><mi>x</mi><mo>,</mo><mi>y</mi><mo>,</mo><mi>z</mi><mo stretchy="false">)</mo><mstyle scriptlevel="0"><mspace width="0.222em"></mspace></mstyle><mo>:</mo><mstyle scriptlevel="0"><mspace width="0.222em"></mspace></mstyle><mo stretchy="false">(</mo><mi>y</mi><mo>,</mo><mi>z</mi><mo stretchy="false">)</mo><mo>∈</mo><mi>D</mi><mo>,</mo><mstyle scriptlevel="0"><mspace width="0.222em"></mspace></mstyle><mn>0</mn><mo>≤</mo><mi>x</mi><mo>≤</mo><mi>y</mi><mo>+</mo><mi>z</mi><mo>+</mo><mn>2</mn><mo data-mjx-texclass="CLOSE">}</mo></mrow><mo>,</mo></math>
and <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>D</mi></math> is a finite region in <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>y</mi><mi>z</mi></math>-plane enclosed between the <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>y</mi></math>-axis, the <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>z</mi></math>-axis and the line <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>z</mi><mo>=</mo><mn>2</mn><mo>−</mo><mi>y</mi></math> in the first quadrant. </p>
