<div id="source-question"><div class="questionText"><p>What type of quadratic curve is defined by the following equation?
<math xmlns="http://www.w3.org/1998/Math/MathML" display="true"><mn>2</mn><msubsup><mi>x</mi><mn>1</mn><mn>2</mn></msubsup><mo>+</mo><mn>3</mn><msubsup><mi>x</mi><mn>2</mn><mn>2</mn></msubsup><mo>−</mo><mn>4</mn><msub><mi>x</mi><mn>1</mn></msub><mo>+</mo><mn>12</mn><msub><mi>x</mi><mn>2</mn></msub><mo>=</mo><mo>−</mo><mn>8</mn></math></p>
</div><table class="questionWidget-choicesTable"><tbody><tr><td><span class="choiceLetterCircle" id="source-choice-1">a</span></td><td class="choiceText">An ellipse with semiaxes <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><msqrt><mn>3</mn></msqrt></math> and <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><msqrt><mn>2</mn></msqrt></math> </td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-2">b</span></td><td class="choiceText">A hyperbola with semiaxes <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>3</mn></math> and <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>4</mn></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-3">c</span></td><td class="choiceText">A parabola</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-4">d</span></td><td class="choiceText">An ellipse with semiaxes <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>9</mn></math> and <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>4</mn></math> </td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-5">e</span></td><td class="choiceText">A pair of parallel lines</td></tr></tbody></table></div>
