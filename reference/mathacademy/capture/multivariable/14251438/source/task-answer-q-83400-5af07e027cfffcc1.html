<div id="source-question"><div class="questionText"><p>Find the global maximum of the function <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>f</mi><mo stretchy="false">(</mo><mi>x</mi><mo>,</mo><mi>y</mi><mo stretchy="false">)</mo><mo>=</mo><mn>2</mn><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>−</mo><mn>4</mn><mi>x</mi><mo>−</mo><mn>2</mn><mi>y</mi></math> on the closed triangular region  <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>D</mi><mo>=</mo><mrow data-mjx-texclass="ORD"><mo minsize="1.2em" maxsize="1.2em">{</mo></mrow><mo stretchy="false">(</mo><mi>x</mi><mo>,</mo><mi>y</mi><mo stretchy="false">)</mo><mstyle scriptlevel="0"><mspace width="0.222em"></mspace></mstyle><mo>:</mo><mstyle scriptlevel="0"><mspace width="0.222em"></mspace></mstyle><mn>0</mn><mo>≤</mo><mi>x</mi><mo>≤</mo><mn>2</mn><mo>,</mo><mstyle scriptlevel="0"><mspace width="0.222em"></mspace></mstyle><mn>0</mn><mo>≤</mo><mi>y</mi><mo>≤</mo><mn>2</mn><mo>−</mo><mi>x</mi><mrow data-mjx-texclass="ORD"><mo minsize="1.2em" maxsize="1.2em">}</mo></mrow><mo>.</mo></math> You're given that <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>f</mi></math> has a critical point at <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mo stretchy="false">(</mo><mn>1</mn><mo>,</mo><mn>1</mn><mo stretchy="false">)</mo></math> and on the boundary of the triangle the points that could give rise to extreme values are the vertices.</p>
