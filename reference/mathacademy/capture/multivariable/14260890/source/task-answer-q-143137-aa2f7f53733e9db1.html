<div id="source-question"><div class="questionText"><p>The side length of a square increases at a rate inversely proportional to the square of its area. Write down a differential equation describing the rate of change of the area, <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>A</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>,</mo></math> in this process. Assume that <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>K</mi><mo>&gt;</mo><mn>0.</mn></math></p>
</div><table class="questionWidget-choicesTable"><tbody><tr><td><span class="choiceLetterCircle" id="source-choice-1">a</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><mtext>d</mtext><mi>A</mi></mrow><mrow><mtext>d</mtext><mi>t</mi></mrow></mfrac></mstyle><mo>=</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mi>K</mi><msup><mi>A</mi><mrow data-mjx-texclass="ORD"><mn>3</mn><mrow data-mjx-texclass="ORD"><mo>/</mo></mrow><mn>2</mn></mrow></msup></mfrac></mstyle></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-2">b</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><mtext>d</mtext><mi>A</mi></mrow><mrow><mtext>d</mtext><mi>t</mi></mrow></mfrac></mstyle><mo>=</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mi>K</mi><msqrt><mi>A</mi></msqrt></mfrac></mstyle></math> </td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-3">c</span></td><td class="choiceText"> <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><mtext>d</mtext><mi>A</mi></mrow><mrow><mtext>d</mtext><mi>t</mi></mrow></mfrac></mstyle><mo>=</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mi>K</mi><msup><mi>A</mi><mn>2</mn></msup></mfrac></mstyle></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-4">d</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><mtext>d</mtext><mi>A</mi></mrow><mrow><mtext>d</mtext><mi>t</mi></mrow></mfrac></mstyle><mo>=</mo><mi>K</mi><mi>A</mi></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-5">e</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><mtext>d</mtext><mi>A</mi></mrow><mrow><mtext>d</mtext><mi>t</mi></mrow></mfrac></mstyle><mo>=</mo><mi>K</mi></math></td></tr></tbody></table></div>
