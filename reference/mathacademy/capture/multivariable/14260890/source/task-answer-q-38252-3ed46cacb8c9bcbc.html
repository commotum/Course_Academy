<div id="source-question"><div class="questionText"><p>Tom's spherical basketball has a hole in it. Its volume decreases at a rate that's proportional to its surface area. Write down a differential equation describing the rate of change of the radius, <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>r</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>,</mo></math> of the ball. Assume that <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>k</mi><mo>&gt;</mo><mn>0.</mn></math></p>
</div><table class="questionWidget-choicesTable"><tbody><tr><td><span class="choiceLetterCircle" id="source-choice-1">a</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><mtext>d</mtext><mi>r</mi></mrow><mrow><mtext>d</mtext><mi>t</mi></mrow></mfrac></mstyle><mo>=</mo><mo>−</mo><mi>k</mi></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-2">b</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><mtext>d</mtext><mi>r</mi></mrow><mrow><mtext>d</mtext><mi>t</mi></mrow></mfrac></mstyle><mo>=</mo><mo>−</mo><mn>3</mn><mi>k</mi><mi>r</mi></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-3">c</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><mtext>d</mtext><mi>r</mi></mrow><mrow><mtext>d</mtext><mi>t</mi></mrow></mfrac></mstyle><mo>=</mo><mo>−</mo><mi>k</mi><mi>r</mi><mo>+</mo><mn>2</mn><mi>π</mi></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-4">d</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><mtext>d</mtext><mi>r</mi></mrow><mrow><mtext>d</mtext><mi>t</mi></mrow></mfrac></mstyle><mo>=</mo><mi>k</mi></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-5">e</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><mtext>d</mtext><mi>r</mi></mrow><mrow><mtext>d</mtext><mi>t</mi></mrow></mfrac></mstyle><mo>=</mo><mo>−</mo><mn>4</mn><mi>π</mi><mi>k</mi><msup><mi>r</mi><mn>2</mn></msup></math></td></tr></tbody></table></div>
