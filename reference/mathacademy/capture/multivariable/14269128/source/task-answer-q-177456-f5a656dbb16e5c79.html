<div id="source-question"><div class="questionText"><blockquote>
<p><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>10</mn></math> is a composite number, <strong>and</strong> <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><msqrt><mn>6</mn></msqrt></math> is less than <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>3</mn></math> <strong>or</strong> irrational.</p>
</blockquote>
<p>Express the compound statement above in symbolic form given the following notations:</p>
<ul>
<li><p><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>R</mi><mo>:</mo><mrow><mrow data-mjx-texclass="ORD"><mn>10</mn></mrow><mtext>&nbsp;is a composite number</mtext></mrow></math> </p>
</li>
<li><p><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>S</mi><mo>:</mo><mrow><mrow data-mjx-texclass="ORD"><msqrt><mn>6</mn></msqrt></mrow><mtext>&nbsp;is less than&nbsp;</mtext><mrow data-mjx-texclass="ORD"><mn>3</mn></mrow></mrow></math></p>
</li>
<li><p><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>T</mi><mo>:</mo><mrow><mrow data-mjx-texclass="ORD"><msqrt><mn>6</mn></msqrt></mrow><mtext>&nbsp;is irrational</mtext></mrow></math></p>
</li>
</ul>
