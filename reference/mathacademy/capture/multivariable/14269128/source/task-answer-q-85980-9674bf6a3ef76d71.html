<div id="source-question"><div class="questionText"><p>The population <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>P</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo></math> of owls in a certain forest follows the logistic growth model</p>
<p><math xmlns="http://www.w3.org/1998/Math/MathML" display="true"><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><mrow data-mjx-texclass="ORD"><mi mathvariant="normal">d</mi></mrow><mi>P</mi></mrow><mrow><mrow data-mjx-texclass="ORD"><mi mathvariant="normal">d</mi></mrow><mi>t</mi></mrow></mfrac></mstyle><mo>=</mo><mn>6</mn><mi>P</mi><mo>−</mo><mn>0.001</mn><mstyle scriptlevel="0"><mspace width="0.167em"></mspace></mstyle><mn>5</mn><msup><mi>P</mi><mn>2</mn></msup><mo>,</mo><mstyle scriptlevel="0"><mspace width="2em"></mspace></mstyle><mi>P</mi><mo stretchy="false">(</mo><mn>0</mn><mo stretchy="false">)</mo><mo>=</mo><mn>400</mn><mo>,</mo></math></p>
<p>where <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>t</mi></math> is the time, measured in years. For which value of <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>P</mi></math> is the owl population growing at the fastest possible rate?</p>
