<div id="source-question"><div class="questionText"><p>A child <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>C</mi></math> is flying a balloon <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>B</mi></math> with a <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>120</mn><mstyle scriptlevel="0"><mspace width="0.167em"></mspace></mstyle><mtext>cm</mtext></math> length of string. If the balloon is rising vertically at a constant speed of <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>2</mn><mstyle scriptlevel="0"><mspace width="0.167em"></mspace></mstyle><mtext>cm/s</mtext><mo>,</mo></math> at what rate is the angle of elevation <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>θ</mi></math> increasing when <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>θ</mi><mo>=</mo><msup><mn>45</mn><mo>∘</mo></msup><mo>?</mo></math></p>
