<div id="source-question"><div class="questionText"><p>A plate of mass <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>M</mi></math> occupies the region <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>D</mi></math> bounded by the lines <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>y</mi><mo>=</mo><mn>2</mn><mi>x</mi><mo>,</mo></math> <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>x</mi><mo>=</mo><mn>1</mn><mo>,</mo></math> and the <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>x</mi></math>-axis. Its mass density at any point on the plate is given by <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>λ</mi><mo stretchy="false">(</mo><mi>x</mi><mo>,</mo><mi>y</mi><mo stretchy="false">)</mo><mo>=</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><mn>3</mn><mi>M</mi></mrow><mn>2</mn></mfrac></mstyle><mi>x</mi><mo>.</mo></math> Find the radius of gyration of the plate about the origin.</p>
</div><table class="questionWidget-choicesTable"><tbody><tr><td><span class="choiceLetterCircle" id="source-choice-1">a</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><msqrt><mstyle displaystyle="true" scriptlevel="0"><mfrac><mn>7</mn><mn>5</mn></mfrac></mstyle></msqrt></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-2">b</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mstyle displaystyle="true" scriptlevel="0"><mfrac><msqrt><mn>15</mn></msqrt><mn>4</mn></mfrac></mstyle></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-3">c</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mstyle displaystyle="true" scriptlevel="0"><mfrac><mn>8</mn><mn>9</mn></mfrac></mstyle></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-4">d</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>1</mn></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-5">e</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mstyle displaystyle="true" scriptlevel="0"><mfrac><msqrt><mn>3</mn></msqrt><mn>2</mn></mfrac></mstyle></math></td></tr></tbody></table></div>
