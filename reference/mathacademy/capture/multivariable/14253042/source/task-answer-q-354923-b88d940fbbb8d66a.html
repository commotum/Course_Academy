<div id="source-question"><div class="questionText"><p>A scientist bought <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>1</mn></math> fluid ounce of a chemical solution and paid <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi mathvariant="normal">$</mi><mn>1.60</mn></math> for it. What's the unit price per cup?</p>
<p>Assume that there are <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>8</mn></math> fluid ounces in one cup.</p>
</div><table class="questionWidget-choicesTable"><tbody><tr><td><span class="choiceLetterCircle" id="source-choice-1">a</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi mathvariant="normal">$</mi><mn>12.80</mn></math> per cup</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-2">b</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi mathvariant="normal">$</mi><mn>8.00</mn></math> per cup</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-3">c</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi mathvariant="normal">$</mi><mn>9.60</mn></math> per cup</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-4">d</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi mathvariant="normal">$</mi><mn>10.20</mn></math> per cup</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-5">e</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi mathvariant="normal">$</mi><mn>14.40</mn></math> per cup</td></tr></tbody></table></div>
