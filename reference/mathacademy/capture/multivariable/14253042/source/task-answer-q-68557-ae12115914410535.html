<div id="source-question"><div class="questionText"><p>Maria bought <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>1</mn></math> gallon of olive oil and paid <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi mathvariant="normal">$</mi><mn>28.80</mn></math> for it.  What's the unit price per cup?</p>
<p>Assume that there are <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>16</mn></math> cups in one gallon.</p>
</div><table class="questionWidget-choicesTable"><tbody><tr><td><span class="choiceLetterCircle" id="source-choice-1">a</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi mathvariant="normal">$</mi><mn>1.80</mn></math> per cup</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-2">b</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi mathvariant="normal">$</mi><mn>2.65</mn></math> per cup</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-3">c</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi mathvariant="normal">$</mi><mn>1.55</mn></math> per cup</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-4">d</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi mathvariant="normal">$</mi><mn>2.45</mn></math> per cup</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-5">e</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi mathvariant="normal">$</mi><mn>1.35</mn></math> per cup</td></tr></tbody></table></div>
