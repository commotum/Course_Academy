<div id="source-question"><div class="questionText"><p>Emily bought <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>1</mn></math> foot of gold wire and paid <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi mathvariant="normal">$</mi><mn>5.60</mn></math> for it. What's the unit price per yard?</p>
<p>Assume that there are <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>3</mn></math> feet in one yard.</p>
