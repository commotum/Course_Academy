<div id="source-question"><div class="questionText"><p>Given that <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>A</mi></math> is a <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>6</mn><mo>×</mo><mn>6</mn></math> real symmetric matrix, which of the following statements are true?</p>
<ol class="questionStatements"><li>  <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>A</mi></math> is orthogonally diagonalizable </li><li>  <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>A</mi></math> must have <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>36</mn></math> real eigenvalues </li><li>  If <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mrow data-mjx-texclass="ORD"><mi mathvariant="bold">u</mi></mrow></math> and <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mrow data-mjx-texclass="ORD"><mi mathvariant="bold">v</mi></mrow></math> are two eigenvectors, then <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mrow data-mjx-texclass="ORD"><mi mathvariant="bold">u</mi></mrow></math> is parallel to <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mrow data-mjx-texclass="ORD"><mi mathvariant="bold">v</mi></mrow></math> </li></ol></div><table class="questionWidget-choicesTable"><tbody><tr><td><span class="choiceLetterCircle" id="source-choice-1">a</span></td><td class="choiceText">I only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-2">b</span></td><td class="choiceText">II only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-3">c</span></td><td class="choiceText">III only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-4">d</span></td><td class="choiceText">I and III only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-5">e</span></td><td class="choiceText">II and III only</td></tr></tbody></table></div>
