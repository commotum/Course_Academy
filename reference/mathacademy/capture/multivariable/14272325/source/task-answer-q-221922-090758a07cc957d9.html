<div id="source-question"><div class="questionText"><p>Which of the following statements must be true for any integers <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>x</mi></math> and <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>y</mi><mo>?</mo></math></p>
