<div id="source-question"><div class="questionText"><p>Consider a linear transformation <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mrow data-mjx-texclass="ORD"><mi mathvariant="bold">T</mi></mrow></math> that maps <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><msup><mrow data-mjx-texclass="ORD"><mi mathvariant="double-struck">R</mi></mrow><mn>2</mn></msup></math> onto the line <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>y</mi><mo>=</mo><mn>6</mn><mi>x</mi><mo>.</mo></math> Which of the following statements are true?</p>
<ol class="questionStatements"><li>  <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mo fence="false" stretchy="false">⟨</mo><mn>2</mn><mo>,</mo><mstyle scriptlevel="0"><mspace width="0.222em"></mspace></mstyle><mn>12</mn><mo fence="false" stretchy="false">⟩</mo><mo>∈</mo><mtext>Im</mtext><mo stretchy="false">(</mo><mrow data-mjx-texclass="ORD"><mi mathvariant="bold">T</mi></mrow><mo stretchy="false">)</mo></math> </li><li>  <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mtext>Ker</mtext><mo stretchy="false">(</mo><mrow data-mjx-texclass="ORD"><mi mathvariant="bold">T</mi></mrow><mo stretchy="false">)</mo><mo>=</mo><mo fence="false" stretchy="false">{</mo><mrow data-mjx-texclass="ORD"><mn mathvariant="bold">0</mn></mrow><mo fence="false" stretchy="false">}</mo></math> </li><li>  <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mtext>nullity</mtext><mo stretchy="false">(</mo><mi>T</mi><mo stretchy="false">)</mo><mo>=</mo><mn>1</mn></math>, where <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>T</mi></math> is the standard matrix of <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mrow data-mjx-texclass="ORD"><mi mathvariant="bold">T</mi></mrow></math> </li></ol></div><table class="questionWidget-choicesTable"><tbody><tr><td><span class="choiceLetterCircle" id="source-choice-1">a</span></td><td class="choiceText">I and III only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-2">b</span></td><td class="choiceText">II only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-3">c</span></td><td class="choiceText">I and II only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-4">d</span></td><td class="choiceText">I, II, and III</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-5">e</span></td><td class="choiceText">None of the statements are true</td></tr></tbody></table></div>
