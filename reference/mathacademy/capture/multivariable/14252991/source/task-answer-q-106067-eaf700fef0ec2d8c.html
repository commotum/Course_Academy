<div id="source-question"><div class="questionText"><p>Find a point that satisfies the mean value theorem for <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>f</mi><mo stretchy="false">(</mo><mi>x</mi><mo>,</mo><mi>y</mi><mo stretchy="false">)</mo><mo>=</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>+</mo><mn>1</mn></math> on the line segment <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mover><mrow><mi>A</mi><mi>B</mi></mrow><mo accent="true">―</mo></mover><mo>,</mo></math> where the position vectors of <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>A</mi></math> and <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>B</mi></math> are <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mrow data-mjx-texclass="ORD"><mi mathvariant="bold">a</mi></mrow><mo>=</mo><mo fence="false" stretchy="false">⟨</mo><mo>−</mo><mn>1</mn><mo>,</mo><mn>1</mn><mo fence="false" stretchy="false">⟩</mo></math> and <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mrow data-mjx-texclass="ORD"><mi mathvariant="bold">b</mi></mrow><mo>=</mo><mo fence="false" stretchy="false">⟨</mo><mn>2</mn><mo>,</mo><mo>−</mo><mn>2</mn><mo fence="false" stretchy="false">⟩</mo><mo>,</mo></math> respectively.  </p>
