<div id="source-question"><div class="questionText"><p>The area of a circle decreases at a rate that's proportional to the cube of its radius. Write down a differential equation describing the rate of change of the radius, <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>r</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>,</mo></math> in this process. Assume that <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>K</mi><mo>&gt;</mo><mn>0.</mn></math></p>
</div><table class="questionWidget-choicesTable"><tbody><tr><td><span class="choiceLetterCircle" id="source-choice-1">a</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><mtext>d</mtext><mi>r</mi></mrow><mrow><mtext>d</mtext><mi>t</mi></mrow></mfrac></mstyle><mo>=</mo><mo>−</mo><mi>K</mi><msup><mi>r</mi><mn>2</mn></msup></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-2">b</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><mtext>d</mtext><mi>r</mi></mrow><mrow><mtext>d</mtext><mi>t</mi></mrow></mfrac></mstyle><mo>=</mo><mo>−</mo><mi>K</mi><mi>r</mi></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-3">c</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><mtext>d</mtext><mi>r</mi></mrow><mrow><mtext>d</mtext><mi>t</mi></mrow></mfrac></mstyle><mo>=</mo><mo>−</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mi>K</mi><mi>r</mi></mfrac></mstyle></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-4">d</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><mtext>d</mtext><mi>r</mi></mrow><mrow><mtext>d</mtext><mi>t</mi></mrow></mfrac></mstyle><mo>=</mo><mo>−</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mi>K</mi><msup><mi>r</mi><mn>2</mn></msup></mfrac></mstyle></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-5">e</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><mtext>d</mtext><mi>r</mi></mrow><mrow><mtext>d</mtext><mi>t</mi></mrow></mfra
