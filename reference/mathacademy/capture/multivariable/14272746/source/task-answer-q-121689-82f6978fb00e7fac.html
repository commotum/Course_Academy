<div id="source-question"><div class="questionText"><p>The height of a conical paper cup is <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>75</mn><mtext>&nbsp;cm</mtext></math> and the radius of the base is <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>15</mn><mtext>&nbsp;cm</mtext><mo>.</mo></math> The cup is being filled with water so that the water level, <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>h</mi></math>, rises at a rate of  <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mstyle displaystyle="true" scriptlevel="0"><mfrac><mn>1</mn><msup><mi>h</mi><mn>2</mn></msup></mfrac></mstyle><mstyle scriptlevel="0"><mspace width="0.167em"></mspace></mstyle><mtext>cm/s</mtext><mo>.</mo></math> At what rate is the volume of water in the cup increasing?</p>
