<div id="source-question"><div class="questionText"><p>A liquid is flowing out of a conical-shaped tube at a constant rate of  <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>108</mn><mi>π</mi><mstyle scriptlevel="0"><mspace width="0.167em"></mspace></mstyle><msup><mtext>in</mtext><mn>3</mn></msup><mtext>/h</mtext><mo>.</mo></math> The larger section of the tube is <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>60</mn><mstyle scriptlevel="0"><mspace width="0.167em"></mspace></mstyle><mtext>in</mtext></math> in radius and the length of the tube is <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>120</mn><mstyle scriptlevel="0"><mspace width="0.167em"></mspace></mstyle><mtext>in</mtext><mo>.</mo></math> How fast is the liquid level dropping when there is <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>144</mn><mi>π</mi><mstyle scriptlevel="0"><mspace width="0.167em"></mspace></mstyle><msup><mtext>in</mtext><mn>3</mn></msup></math> of liquid remaining in the tube?</p>
