<div id="source-question"><div class="questionText"><p>Consider a linear transformation <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mrow data-mjx-texclass="ORD"><mi mathvariant="bold">T</mi></mrow></math> that maps <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><msup><mrow data-mjx-texclass="ORD"><mi mathvariant="double-struck">R</mi></mrow><mn>2</mn></msup></math> to the origin. Which of the following statements are true?</p>
<ol class="questionStatements"><li>  <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mtext>rank</mtext><mo stretchy="false">(</mo><mi>T</mi><mo stretchy="false">)</mo><mo>=</mo><mn>1</mn></math>,  where <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>T</mi></math> is the standard matrix of <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mrow data-mjx-texclass="ORD"><mi mathvariant="bold">T</mi></mrow></math> </li><li>  <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mtext>Im</mtext><mo stretchy="false">(</mo><mrow data-mjx-texclass="ORD"><mi mathvariant="bold">T</mi></mrow><mo stretchy="false">)</mo></math> contains no vectors of <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><msup><mrow data-mjx-texclass="ORD"><mi mathvariant="double-struck">R</mi></mrow><mn>2</mn></msup></math> </li><li>  <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mtext>Ker</mtext><mo stretchy="false">(</mo><mrow data-mjx-texclass="ORD"><mi mathvariant="bold">T</mi></mrow><mo stretchy="false">)</mo><mo>=</mo><msup><mrow data-mjx-texclass="ORD"><mi mathvariant="double-struck">R</mi></mrow><mn>2</mn></msup></math> </li></ol></div><table class="questionWidget-choicesTable"><tbody><tr><td><span class="choiceLetterCircle" id="source-choice-1">a</span></td><td class="choiceText">III only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-2">b</span></td><td class="choiceText">II and III only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-3">c</span></td><td class="choiceText">II only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-4">d</span></td><td class="choiceText">I only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-5">e</span></td><td class="choiceText">I and II only</td></tr></tbody></table></div>
