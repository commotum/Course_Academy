<div id="source-question"><div class="questionText"><p>Given that the power series <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mstyle displaystyle="true" scriptlevel="0"><munderover><mo data-mjx-texclass="OP">∑</mo><mrow data-mjx-texclass="ORD"><mi>n</mi><mo>=</mo><mn>1</mn></mrow><mrow data-mjx-texclass="ORD"><mi mathvariant="normal">∞</mi></mrow></munderover><msub><mi>a</mi><mi>n</mi></msub><mo stretchy="false">(</mo><mi>x</mi><mo>−</mo><mn>1</mn><msup><mo stretchy="false">)</mo><mi>n</mi></msup></mstyle></math> converges at  <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>x</mi><mo>=</mo><mo>−</mo><mn>3</mn><mo>,</mo></math> which of the following <strong>must</strong> be true?</p>
<ol class="questionStatements"><li>  The series converges at <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>x</mi><mo>=</mo><mn>5</mn></math> </li><li>  The series diverges at <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>x</mi><mo>=</mo><mo>−</mo><mn>4</mn></math> </li><li>  The series converges at <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>x</mi><mo>=</mo><mo>−</mo><mn>2</mn></math> </li></ol></div><table class="questionWidget-choicesTable"><tbody><tr><td><span class="choiceLetterCircle" id="source-choice-1">a</span></td><td class="choiceText">III only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-2">b</span></td><td class="choiceText">II only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-3">c</span></td><td class="choiceText">I only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-4">d</span></td><td class="choiceText">I and III only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-5">e</span></td><td class="choiceText">I, II, and III</td></tr></tbody></table></div>
