<div id="questionExplanation-177347" class="questionExplanation" style="display: block;"><p>The word "and" is represented by the symbol "$\land$".</p>
<p>So, the sentence reads</p>
<p>\[
\underbrace{6 \vphantom{p}\textrm{ is a composite number} }_R \quad \underbrace{\vphantom{p}\textbf{and}}_{\land} \quad 
\underbrace{2 \vphantom{p}\textrm{ is negative} }_S,
\]</p>
<p>that is, $R \land S.$</p>
</div>
