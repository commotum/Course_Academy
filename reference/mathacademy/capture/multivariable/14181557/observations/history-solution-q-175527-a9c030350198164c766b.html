<div id="questionExplanation-175527" class="questionExplanation" style="display: block;"><p>The word "and" is represented by the symbol "$\land$".</p>
<p>So, the sentence reads</p>
<p>\[
\underbrace{2 \vphantom{p}\textrm{ is odd} }_P \quad \underbrace{\vphantom{p}\textbf{and}}_{\land} \quad \underbrace{3 \vphantom{p}\textrm{ is prime} }_Q,
\]</p>
<p>that is, $P \land Q.$</p>
</div>
