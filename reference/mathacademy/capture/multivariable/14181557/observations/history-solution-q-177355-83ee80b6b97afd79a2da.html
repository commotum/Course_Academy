<div id="questionExplanation-177355" class="questionExplanation" style="display: block;"><p>The word "or" is represented by the symbol "$\lor$".</p>
<p>So, the sentence reads</p>
<p>\[
\underbrace{2+3 \vphantom{p}\textrm{ equals }\vphantom{p} 5 }_A \quad \underbrace{\vphantom{p}\textbf{or}}_{\lor} \quad 
\underbrace{\pi \vphantom{p}\textrm{ is rational} }_B,
\]</p>
<p>that is, $A \lor B.$</p>
</div>
