<div id="source-question"><div class="questionText"><p>Which of the following relations on the set <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>A</mi><mo>=</mo><mo fence="false" stretchy="false">{</mo><mi>α</mi><mo>,</mo><mi>β</mi><mo>,</mo><mi>δ</mi><mo fence="false" stretchy="false">}</mo></math> are transitive?</p>
<ol class="questionStatements"><li>  <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><msub><mi>R</mi><mn>1</mn></msub><mo>=</mo><mi mathvariant="normal">∅</mi></math> </li><li>  <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><msub><mi>R</mi><mn>2</mn></msub><mo>=</mo><mo fence="false" stretchy="false">{</mo><mo stretchy="false">(</mo><mi>α</mi><mo>,</mo><mi>β</mi><mo stretchy="false">)</mo><mo>,</mo><mo stretchy="false">(</mo><mi>β</mi><mo>,</mo><mi>δ</mi><mo stretchy="false">)</mo><mo fence="false" stretchy="false">}</mo></math> </li><li>  <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><msub><mi>R</mi><mn>3</mn></msub><mo>=</mo><msup><mi>A</mi><mn>2</mn></msup></math> </li></ol></div><table class="questionWidget-choicesTable"><tbody><tr><td><span class="choiceLetterCircle" id="source-choice-1">a</span></td><td class="choiceText">I and III only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-2">b</span></td><td class="choiceText">II and III only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-3">c</span></td><td class="choiceText">I and II only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-4">d</span></td><td class="choiceText">II only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-5">e</span></td><td class="choiceText">I only</td></tr></tbody></table></div>
