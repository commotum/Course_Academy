<div id="source-question"><div class="questionText"><p>Which of the following relations are transitive? </p>
<ul>

</li>
<li><p><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>x</mi><mstyle scriptlevel="0"><mspace width="0.222em"></mspace></mstyle><mi>S</mi><mstyle scriptlevel="0"><mspace width="0.222em"></mspace></mstyle><mi>y</mi></math> if and only if <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>x</mi><mo>∣</mo><mo stretchy="false">(</mo><mi>y</mi><mo>+</mo><mn>3</mn><mo stretchy="false">)</mo><mo>,</mo></math> defined on <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mrow data-mjx-texclass="ORD"><mi mathvariant="double-struck">Z</mi></mrow></math></p>
</li>
<li><p><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>x</mi><mstyle scriptlevel="0"><mspace width="0.222em"></mspace></mstyle><mi>T</mi><mstyle scriptlevel="0"><mspace width="0.222em"></mspace></mstyle><mi>y</mi></math> if and only if <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>x</mi><mo>∤</mo><mi>y</mi><mo>,</mo></math> defined on <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mrow data-mjx-texclass="ORD"><mi mathvariant="double-struck">Z</mi></mrow></math></p>
</li>
</ul>
