<div id="questionExplanation-82724" class="questionExplanation" style="display: block;"><p></p><p>First, let's write the sentence more concisely:</p><p></p>
<blockquote>
<p>"The apple is green or red."</p>
</blockquote>
<p>Using the commutative law, we can swap the order of the words "green" and "red." The sentence now reads</p>
<blockquote>
<p>"The apple is red or green."</p>
</blockquote>
