<div id="source-question"><div class="questionText"><p>Identify the sentence that is equivalent to the following: "The apple is green or it is red."</p>
</div><table class="questionWidget-choicesTable"><tbody><tr><td><span class="choiceLetterCircle" id="source-choice-1">a</span></td><td class="choiceText">The apple is red or green.</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-2">b</span></td><td class="choiceText"> The apple is red.</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-3">c</span></td><td class="choiceText"> The apple is green.</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-4">d</span></td><td class="choiceText"> The apple is green and red.</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-5">e</span></td><td class="choiceText"> The apple is red or green but not both.</td></tr></tbody></table></div>
