<div id="source-question"><div class="questionText"><p>If <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>B</mi></math> is a <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>4</mn><mo>×</mo><mn>4</mn></math> matrix and <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>λ</mi><mo>=</mo><mn>4</mn></math> is an eigenvalue of <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>B</mi><mo>,</mo></math> which of the following statements are true?</p>
<ol class="questionStatements"><li>  <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mo stretchy="false">(</mo><mi>B</mi><mo>−</mo><mn>4</mn><mi>I</mi><mo stretchy="false">)</mo><mrow data-mjx-texclass="ORD"><mi mathvariant="bold">x</mi></mrow><mo>=</mo><mrow data-mjx-texclass="ORD"><mn mathvariant="bold">0</mn></mrow></math> has a nonzero solution </li><li>  <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mtext>rank</mtext><mo stretchy="false">(</mo><mi>B</mi><mo>−</mo><mn>4</mn><mi>I</mi><mo stretchy="false">)</mo><mo>=</mo><mn>4</mn></math> </li><li>  <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mtext>nullity</mtext><mo stretchy="false">(</mo><mi>B</mi><mo>−</mo><mn>4</mn><mi>I</mi><mo stretchy="false">)</mo><mo>≠</mo><mn>0</mn></math> </li></ol></div><table class="questionWidget-choicesTable"><tbody><tr><td><span class="choiceLetterCircle" id="source-choice-1">a</span></td><td class="choiceText">I and III only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-2">b</span></td><td class="choiceText">II and III only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-3">c</span></td><td class="choiceText">I and II only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-4">d</span></td><td class="choiceText">I only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-5">e</span></td><td class="choiceText">II only</td></tr></tbody></table></div>
