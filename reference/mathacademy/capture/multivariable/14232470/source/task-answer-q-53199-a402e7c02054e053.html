<div id="source-question"><div class="questionText"><p>A boy <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>B</mi></math> is flying a kite <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>K</mi></math> with a <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>20</mn><mstyle scriptlevel="0"><mspace width="0.167em"></mspace></mstyle><mtext>m</mtext></math> length of string. If the kite is rising vertically at a constant speed of <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>1</mn><mstyle scriptlevel="0"><mspace width="0.167em"></mspace></mstyle><mtext>m/s</mtext><mo>,</mo></math> at what rate is the angle of elevation <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>θ</mi></math> increasing when <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>θ</mi><mo>=</mo><msup><mn>45</mn><mo>∘</mo></msup><mo>?</mo></math></p>
