<div id="source-question"><div class="questionText"><blockquote>
<p><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>2</mn></math> is prime, <strong>or</strong> <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>14</mn></math> is a multiple of <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>7</mn></math> <strong>and</strong> <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>5.</mn></math></p>
</blockquote>
<p>Express the compound statement above in symbolic form given the following notations:</p>
<ul>
<li><p><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>R</mi><mo>:</mo><mrow><mrow data-mjx-texclass="ORD"><mn>2</mn></mrow><mtext>&nbsp;is prime</mtext></mrow></math> </p>
