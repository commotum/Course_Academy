<div id="source-question"><div class="questionText"><p>A rectangle <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>A</mi><mi>B</mi><mi>C</mi><mi>D</mi></math> is reflected over the <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>y</mi></math>-axis and then reflected over the <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>x</mi></math>-axis. If the resulting quadrilateral is <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>P</mi><mi>Q</mi><mi>R</mi><mi>S</mi><mo>,</mo></math> which of the following statements must be true?</p>
<ol class="questionStatements"><li>  <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>A</mi><mi>B</mi><mi>C</mi><mi>D</mi><mo>∼</mo><mi>P</mi><mi>Q</mi><mi>R</mi><mi>S</mi></math> </li><li>  <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>A</mi><mi>B</mi><mi>C</mi><mi>D</mi><mo>≅</mo><mi>P</mi><mi>Q</mi><mi>R</mi><mi>S</mi></math> </li><li>  <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mover><mrow><mi>B</mi><mi>C</mi></mrow><mo accent="true">―</mo></mover><mo>≅</mo><mover><mrow><mi>Q</mi><mi>R</mi></mrow><mo accent="true">―</mo></mover></math> </li></ol></div><table class="questionWidget-choicesTable"><tbody><tr><td><span class="choiceLetterCircle" id="source-choice-1">a</span></td><td class="choiceText">I, II, and III

</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-4">d</span></td><td class="choiceText">I only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-5">e</span></td><td class="choiceText">II only</td></tr></tbody></table></div>
