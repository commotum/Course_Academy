<div id="source-question"><div class="questionText"><p>The speed of a car moving with a constant acceleration is given by the formula <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>v</mi><mo>=</mo><mi>a</mi><mi>t</mi><mo>,</mo></math> where <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>a</mi></math> is the car's acceleration, and <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>t</mi></math> is the time passed. Given that the acceleration is measured in <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mstyle displaystyle="true" scriptlevel="0"><mfrac><mtext>m</mtext><msup><mtext>s</mtext><mn>2</mn></msup></mfrac></mstyle></math>, determine the units of speed in terms of meters and seconds.</p>
</div><table class="questionWidget-choicesTable"><tbody><tr><td><span class="choiceLetterCircle" id="source-choice-1">a</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mstyle displaystyle="true" scriptlevel="0"><mfrac><mtext>m</mtext><mtext>s</mtext></mfrac></mstyle></math> </td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-2">b</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mstyle displaystyle="true" scriptlevel="0"><mfrac><mtext>s</mtext><mtext>m</mtext></mfrac></mstyle></math> </td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-3">c</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mstyle displaystyle="true" scriptlevel="0"><mfrac><msup><mtext>s</mtext><mn>2</mn></msup><msup><mtext>m</mtext><mn>2</mn></msup></mfrac></mstyle></math> </td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-4">d</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mstyle displaystyle="true" scriptlevel="0"><mfrac><mtext>m</mtext><msup><mtext>s</mtext><mn>2</mn></msup></mfrac></mstyle></math> </td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-5">e</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mstyle displaystyle="true" scriptlevel="0"><mfrac><mtext>s</mtext><msup><mtext>m</mtext><mn>2</mn></msup></mfrac></mstyle></math> </td></tr></tbody></table></div>
