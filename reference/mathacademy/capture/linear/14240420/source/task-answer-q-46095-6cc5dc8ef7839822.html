<div id="source-question"><div class="questionText"><p>The acceleration <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>a</mi></math> of a body is related to applied force <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>F</mi></math> and mass <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>m</mi></math> by the equation <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>a</mi><mo>=</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mi>F</mi><mi>m</mi></mfrac></mstyle><mo>.</mo></math> If <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>F</mi></math> is measured in Newtons <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mrow data-mjx-texclass="INNER"><mo data-mjx-texclass="OPEN">(</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><mtext>kg</mtext><mstyle scriptlevel="0"><mspace width="0.167em"></mspace></mstyle><mtext>m</mtext></mrow><msup><mtext>s</mtext><mn>2</mn></msup></mfrac></mstyle><mo data-mjx-texclass="CLOSE">)</mo></mrow></math> and <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>m</mi></math> is measured in kilograms, determine an appropriate measurement unit for acceleration.</p>
</div><table class="questionWidget-choicesTable"><tbody><tr><td><span class="choiceLetterCircle" id="source-choice-1">a</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mstyle displaystyle="true" scriptlevel="0"><mfrac><mtext>m</mtext><msup><mtext>s</mtext><mn>2</mn></msup></mfrac></mstyle></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-2">b</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mstyle displaystyle="true" scriptlevel="0"><mfrac><mtext>m</mtext><mrow><msup><mtext>s</mtext><mn>2</mn></msup><mstyle scriptlevel="0"><mspace width="0.167em"></mspace></mstyle><msup><mtext>km</mtext><mn>3</mn></msup></mrow></mfrac></mstyle></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-3">c</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mstyle displaystyle="true" scriptlevel="0"><mfrac><mtext>m</mtext><mrow><mtext>km</mtext><mstyle scriptlevel="0"><mspace width="0.167em"></mspace></mstyle><msup><mtext>s</mtext><mn>2</mn></msup></mrow></mfrac></mstyle></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-4">d</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mstyle displaystyle="true" scriptlevel="0"><mfrac><mtext>m</mtext><mtext>s</mtext></mfrac></mstyle></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-5">e</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mstyle displaystyle="true" scriptlevel="0"><mfrac><msup><mtext>s</mtext><mn>2</mn></msup><mtext>m</mtext></mfrac></mstyle></math></td></tr></tbody></table></div>
