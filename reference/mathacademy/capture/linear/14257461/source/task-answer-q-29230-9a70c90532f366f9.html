<div id="source-question"><div class="questionText"><p>Which of the following statements are true regarding the function <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>y</mi><mo>=</mo><mi>ln</mi><mo data-mjx-texclass="NONE">⁡</mo><mrow data-mjx-texclass="ORD"><mi>x</mi></mrow><mo>?</mo></math> </p>
<ol class="questionStatements"><li>  It's an increasing function </li><li>  <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>y</mi><mo stretchy="false">→</mo><mi mathvariant="normal">∞</mi></math> as <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>x</mi><mo stretchy="false">→</mo><mi mathvariant="normal">∞</mi></math> </li><li>  <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>y</mi><mo stretchy="false">→</mo><mi mathvariant="normal">∞</mi></math> as <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>x</mi><mo stretchy="false">→</mo><mo>−</mo><mi mathvariant="normal">∞</mi></math> </li></ol></div><table class="questionWidget-choicesTable"><tbody><tr><td><span class="choiceLetterCircle" id="source-choice-1">a</span></td><td class="choiceText">I and II only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-2">b</span></td><td class="choiceText">I and III only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-3">c</span></td><td class="choiceText">II only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-4">d</span></td><td class="choiceText">I only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-5">e</span></td><td class="choiceText">All the statements</td></tr></tbody></table></div>
