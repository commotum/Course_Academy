<div id="source-question"><div class="questionText"><p>Which of the following statements are true regarding the function <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>y</mi><mo>=</mo><msub><mi>log</mi><mrow data-mjx-texclass="ORD"><mn>3</mn></mrow></msub><mo data-mjx-texclass="NONE">⁡</mo><mi>x</mi><mo>?</mo></math></p>
