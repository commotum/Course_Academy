<div id="source-question"><div class="questionText"><p>Which of the following statements are true in relation to the function <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>f</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo>=</mo><mn>8</mn><mrow data-mjx-texclass="INNER"><mo data-mjx-texclass="OPEN">(</mo><msup><mn>10</mn><mrow data-mjx-texclass="ORD"><mi>x</mi></mrow></msup><mo data-mjx-texclass="CLOSE">)</mo></mrow><mo>?</mo></math></p>
<ol class="questionStatements"><li>  Its domain is <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mrow data-mjx-texclass="INNER"><mo data-mjx-texclass="OPEN">(</mo><mo>−</mo><mi mathvariant="normal">∞</mi><mo>,</mo><mi mathvariant="normal">∞</mi><mo data-mjx-texclass="CLOSE">)</mo></mrow></math> </li><li>  <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>f</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo stretchy="false">→</mo><mn>0</mn></math> as <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>x</mi><mo stretchy="false">→</mo><mo>+</mo><mstyle scriptlevel="0"><mspace width="0.167em"></mspace></mstyle><mi mathvariant="normal">∞</mi></math> </li><li>  It passes through the point <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mrow data-mjx-texclass="INNER"><mo data-mjx-texclass="OPEN">(</mo><mn>1</mn><mo>,</mo><mn>80</mn><mo data-mjx-texclass="CLOSE">)</mo></mrow></math> </li></ol></div><table class="questionWidget-choicesTable"><tbody><tr><td><span class="choiceLetterCircle" id="source-choice-1">a</span></td><td class="choiceText">I and III only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-2">b</span></td><td class="choiceText">II and III only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-3">c</span></td><td class="choiceText">I and II only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-4">d</span></td><td class="choiceText">II only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-5">e</span></td><td class="choiceText">I only</td></tr></tbody></table></div>
