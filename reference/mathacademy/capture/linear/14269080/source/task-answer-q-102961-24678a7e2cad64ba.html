<div id="source-question"><div class="questionText"><p>Which of the following statements are true regarding the function <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>f</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo>=</mo><mroot><mi>x</mi><mn>3</mn></mroot><mo>?</mo></math></p>
<ol class="questionStatements"><li>  The domain of <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>f</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></math> is <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>x</mi><mo>∈</mo><mo stretchy="false">(</mo><mo>−</mo><mi mathvariant="normal">∞</mi><mo>,</mo><mi mathvariant="normal">∞</mi><mo stretchy="false">)</mo></math> </li><li>  <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>f</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo stretchy="false">→</mo><mo>−</mo><mi mathvariant="normal">∞</mi></math> as <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>x</mi><mo stretchy="false">→</mo><mi mathvariant="normal">∞</mi></math> </li><li>  The point <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mo stretchy="false">(</mo><mo>−</mo><mn>1</mn><mo>,</mo><mn>1</mn><mo stretchy="false">)</mo></math> lies on the graph of <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>y</mi><mo>=</mo><mi>f</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></math> </li></ol></div><table class="questionWidget-choicesTable"><tbody><tr><td><span class="choiceLetterCircle" id="source-choice-1">a</span></td><td class="choiceText">I only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-2">b</span></td><td class="choiceText">II only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-3">c</span></td><td class="choiceText">III only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-4">d</span></td><td class="choiceText">I and II only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-5">e</span></td><td class="choiceText">I and III only</td></tr></tbody></table></div>
