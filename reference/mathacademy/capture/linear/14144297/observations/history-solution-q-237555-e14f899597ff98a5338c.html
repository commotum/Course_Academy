<div id="questionExplanation-237555" class="questionExplanation" style="display: block;"><p>We proceed as follows:</p>
<ul>
<li>First, we split each whole into sixths.</li>
</ul>

<ul>
<li>Then, we count the groups.</li>
</ul>
<div id="graphic-9dd97a6180d702d4068aa108aa6f2090" class="graphic"><img src="/graphics/9dd97a6180d702d4068aa108aa6f2090"></div>

"><mjx-c class="mjx-c36"></mjx-c></mjx-mn></mjx-texatom></mjx-mstyle></mjx-texatom></mjx-math><mjx-assistive-mml unselectable="on" display="inline"><math xmlns="http://www.w3.org/1998/Math/MathML"><mrow data-mjx-texclass="ORD"><mstyle mathcolor="purple"><mrow data-mjx-texclass="ORD"><mn>6</mn></mrow></mstyle></mrow></math></mjx-assistive-mml></mjx-container> groups in total.</p>
