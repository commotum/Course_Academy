<p><math xmlns="http://www.w3.org/1998/Math/MathML" display="true"><mi>d</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>=</mo><mn>320</mn><mo>⋅</mo><msup><mrow data-mjx-texclass="INNER"><mo data-mjx-texclass="OPEN">(</mo><mtext>___</mtext><mo data-mjx-texclass="CLOSE">)</mo></mrow><mrow data-mjx-texclass="ORD"><mi>t</mi></mrow></msup><mo>.</mo></math></p>
