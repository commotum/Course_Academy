<div id="source-question"><div class="questionText"><p>An adult drinks a cup of coffee that contains <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>110</mn></math> mg of caffeine, and each hour the amount of caffeine in their body decreases by <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>15</mn><mi mathvariant="normal">%</mi><mo>.</mo></math> To the nearest integer, how much caffeine will be left in their system after <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>11</mn></math> hours? </p>
</div><table class="questionWidget-choicesTable"><tbody><tr><td><span class="choiceLetterCircle" id="source-choice-1">a</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>18</mn></math> mg</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-2">b</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>14</mn></math> mg</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-3">c</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>13</mn></math> mg</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-4">d</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>7</mn></math> mg</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-5">e</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>9</mn></math> mg</td></tr></tbody></table></div>
