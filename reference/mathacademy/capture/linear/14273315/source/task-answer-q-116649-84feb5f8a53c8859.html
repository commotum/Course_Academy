<div id="source-question"><div class="questionText"><p>A graphic designer is animating a circle in such a way that the area of the circle is decreasing at a rate of <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>12</mn><mi>π</mi><mstyle scriptlevel="0"><mspace width="0.167em"></mspace></mstyle><msup><mtext>cm</mtext><mn>2</mn></msup><mtext>/s</mtext><mo>.</mo></math> Calculate the rate at which the circumference of the circle is decreasing at the moment when the radius is  <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>3</mn><mstyle scriptlevel="0"><mspace width="0.167em"></mspace></mstyle><mtext>cm</mtext><mo>.</mo></math></p>
</div><table class="questionWidget-choicesTable"><tbody><tr><td><span class="choiceLetterCircle" id="source-choice-1">a</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>4</mn><mi>π</mi><mtext>&nbsp;cm/s</mtext></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-2">b</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>3</mn><mi>π</mi><mtext>&nbsp;cm/s</mtext></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-3">c</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>2</mn><mi>π</mi><mtext>&nbsp;cm/s</mtext></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-4">d</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>5</mn><mi>π</mi><mtext>&nbsp;cm/s</mtext></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-5">e</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>6</mn><mi>π</mi><mtext>&nbsp;cm/s</mtext></math></td></tr></tbody></table></div>
