<p><span class="mjpage mjpage__block"><svg xmlns:xlink="http://www.w3.org/1999/xlink" width="58.732ex" height="24.176ex" style="vertical-align: -11.505ex;" viewBox="0 -5455.7 25287.2 10409.1" role="img" focusable="false" xmlns="http://www.w3.org/2000/svg" aria-labelledby="MathJax-SVG-1-Title">
<title id="MathJax-SVG-1-Title">
\eqalign{
\lim_\limits{x\rightarrow 3}\left[(2x-1)^3(x-2)^9\right]   &amp;= \lim_\limits{x\rightarrow 3}(2x-1)^3\cdot  \lim_\limits{x\rightarrow 3}(x-2)^9<span>\</span>[3pt]
                                                                                    &amp;= \left(\lim_\limits{x\rightarrow 3}(2x-1)\right)^3\cdot  \left(\lim_\limits{x\rightarrow 3}(x-2)\right)^9<span>\</span>[3pt]
                                                                                    &amp;= (2\cdot 3 -1)^3\cdot (3-2)^9<span>\</span>[3pt]
                                                                                    &amp;= 5^3 \cdot 1^9<span>\</span>[3pt]
                                                                                    &amp; = 125.
}
</title>
