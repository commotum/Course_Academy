<div id="source-question"><div class="questionText"><p>Consider the following trigonometric equation:
<math xmlns="http://www.w3.org/1998/Math/MathML" display="true"><mi>sec</mi><mo data-mjx-texclass="NONE">⁡</mo><mrow data-mjx-texclass="INNER"><mo data-mjx-texclass="OPEN">(</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mi>x</mi><mn>2</mn></mfrac></mstyle><mo>+</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mi>π</mi><mn>6</mn></mfrac></mstyle><mo data-mjx-texclass="CLOSE">)</mo></mrow><mo>=</mo><mo>−</mo><msqrt><mn>2</mn></msqrt></math>
The general solution of this equation is
<math xmlns="http://www.w3.org/1998/Math/MathML" display="true"><mi>x</mi><mo>=</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><mn>7</mn><mi>π</mi></mrow><mn>6</mn></mfrac></mstyle><mo>+</mo><mn>4</mn><mi>π</mi><mi>n</mi><mo>,</mo><mstyle scriptlevel="0"><mspace width="1em"></mspace></mstyle><mi>x</mi><mo>=</mo><mi>a</mi><mo>+</mo><mn>4</mn><mi>π</mi><mi>n</mi><mo>,</mo></math>
where <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>n</mi></math> is any integer. Which of the following could be the value of <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>a</mi><mo>?</mo></math></p>
</div><table class="questionWidget-choicesTable"><tbody><tr><td><span class="choiceLetterCircle" id="source-choice-1">a</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><mn>13</mn><mi>π</mi></mrow><mn>6</mn></mfrac></mstyle></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-2">b</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><mn>11</mn><mi>π</mi></mrow><mn>6</mn></mfrac></mstyle></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-3">c</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><mn>7</mn><mi>π</mi></mrow><mn>3</mn></mfrac></mstyle></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-4">d</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><mn>5</mn><mi>π</mi></mrow><mn>2</mn></mfrac></mstyle></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-5">e</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><mn>11</mn><mi>π</mi></mrow><mn>3</mn></mfrac></mstyle></math></td></tr></tbody></table></div>
