<div id="source-question"><div class="questionText"><p>Consider the following trigonometric equation: </p>
<p><math xmlns="http://www.w3.org/1998/Math/MathML" display="true"><mi>cos</mi><mo data-mjx-texclass="NONE">⁡</mo><mrow data-mjx-texclass="INNER"><mo data-mjx-texclass="OPEN">(</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><mn>3</mn><mi>x</mi></mrow><mn>2</mn></mfrac></mstyle><mo data-mjx-texclass="CLOSE">)</mo></mrow><mo>=</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><msqrt><mn>2</mn></msqrt><mn>2</mn></mfrac></mstyle></math></p>
<p>The general solution of this equation can be expressed as 
<math xmlns="http://www.w3.org/1998/Math/MathML" display="true"><mi>x</mi><mo>=</mo><msup><mi>a</mi><mo>∘</mo></msup><mo>+</mo><mi>n</mi><mo>⋅</mo><msup><mn>240</mn><mo>∘</mo></msup><mo>,</mo><mstyle scriptlevel="0"><mspace width="2em"></mspace></mstyle><mi>x</mi><mo>=</mo><msup><mn>210</mn><mo>∘</mo></msup><mo>+</mo><mi>n</mi><mo>⋅</mo><msup><mn>240</mn><mo>∘</mo></msup><mo>,</mo></math>
where <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>n</mi></math> is any integer. Which of the following could be the value of <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>a</mi><mo>?</mo></math></p>
