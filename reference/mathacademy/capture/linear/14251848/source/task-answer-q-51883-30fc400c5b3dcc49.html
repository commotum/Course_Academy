<div id="source-question"><div class="questionText"><p>The graph above shows that the volume of gas <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>L</mi></math> in a truck's tank is directly proportional to the time <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>t</mi></math> since the driver started filling it. Find a direct variation equation that describes the relationship between <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>L</mi></math> and <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>t</mi><mo>.</mo></math></p>
</div><table class="questionWidget-choicesTable"><tbody><tr><td><span class="choiceLetterCircle" id="source-choice-1">a</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>L</mi><mo>=</mo><mn>15</mn><mi>t</mi></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-2">b</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>L</mi><mo>=</mo><mn>30</mn><mi>t</mi></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-3">c</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>L</mi><mo>=</mo><mn>60</mn><mi>t</mi></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-4">d</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>L</mi><mo>=</mo><mn>90</mn><mi>t</mi></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-5">e</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>L</mi><mo>=</mo><mn>50</mn><mi>t</mi></math></td></tr></tbody></table></div>
