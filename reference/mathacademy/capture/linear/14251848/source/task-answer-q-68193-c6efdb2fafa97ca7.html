<div id="source-question"><div class="questionText"><p>The graph above shows a proportional relationship between the weight <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>x</mi></math> (in pounds) of ice cream sold by a store and the profit <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>y</mi></math> (in dollars).  What is the constant of proportionality?</p>
