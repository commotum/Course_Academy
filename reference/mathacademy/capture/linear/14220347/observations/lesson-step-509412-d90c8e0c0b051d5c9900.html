<span style="color:rgb(69,155,118)"><strong>one</strong></span>, or <span style="color:rgb(192,126,164)"><strong>no</strong></span> points of intersection.</p>
<p>This is similar to how a quadratic equation may have  <span style="color:rgb(230,159,0)"><strong>two</strong></span>, 
<span style="color:rgb(69,155,118)"><strong>one</strong></span>, or <span style="color:rgb(192,126,164)"><strong>no</strong></span> solutions.</p>
<p>With that in mind, let's look at another example.</p>
