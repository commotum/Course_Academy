<div id="source-question"><div class="questionText"><p>The pressure <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>P</mi></math> of a gas kept at a fixed temperature varies inversely with the volume <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>V</mi></math> it occupies. When <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>V</mi><mo>=</mo><mn>2</mn><mstyle scriptlevel="0"><mspace width="0.167em"></mspace></mstyle><msup><mtext>m</mtext><mn>3</mn></msup></math>, the pressure is <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>P</mi><mo>=</mo><mn>1</mn></math> megapascal (<math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mtext>MPa</mtext></math>). Find the pressure when <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>V</mi><mo>=</mo><mn>0.5</mn><mstyle scriptlevel="0"><mspace width="0.167em"></mspace></mstyle><msup><mtext>m</mtext><mn>3</mn></msup><mo>.</mo></math></p>
</div><table class="questionWidget-choicesTable"><tbody><tr><td><span class="choiceLetterCircle" id="source-choice-1">a</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>4</mn><mstyle scriptlevel="0"><mspace width="0.167em"></mspace></mstyle><mtext>MPa</mtext></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-2">b</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>3</mn><mstyle scriptlevel="0"><mspace width="0.167em"></mspace></mstyle><mtext>MPa</mtext></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-3">c</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>2.5</mn><mstyle scriptlevel="0"><mspace width="0.167em"></mspace></mstyle><mtext>MPa</mtext></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-4">d</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>1.8</mn><mstyle scriptlevel="0"><mspace width="0.167em"></mspace></mstyle><mtext>MPa</mtext></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-5">e</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>4.6</mn><mstyle scriptlevel="0"><mspace width="0.167em"></mspace></mstyle><mtext>MPa</mtext></math></td></tr></tbody></table></div>
