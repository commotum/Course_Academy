<div id="source-question"><div class="questionText"><p>A triangle has sides <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>j</mi></math>, <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>k</mi></math>, and <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>l</mi><mo>.</mo></math> The sides <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>j</mi></math> and <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>l</mi></math> have lengths <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>4</mn></math> and <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>7</mn></math>, respectively. If the angle <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>K</mi></math> between <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>j</mi></math> and <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>l</mi></math> has a measure of <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><msup><mn>121</mn><mo>∘</mo></msup></math>, what is the length of side <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>k</mi><mo>?</mo></math> Round your answer to two decimal places.</p>
</div><table class="questionWidget-choicesTable"><tbody><tr><td><span class="choiceLetterCircle" id="source-choice-1">a</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>9.69</mn></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-2">b</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>12.43</mn></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-3">c</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>8.91</mn></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-4">d</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>10.01</mn></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-5">e</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>8.72</mn></math></td></tr></tbody></table></div>
