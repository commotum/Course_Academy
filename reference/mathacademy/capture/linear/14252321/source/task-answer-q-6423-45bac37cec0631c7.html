<div id="source-question"><div class="questionText"><p>A triangle has sides <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>m</mi></math>, <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>n</mi></math>, and <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>o</mi><mo>.</mo></math> The sides <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>m</mi></math>, <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>n</mi></math>, and <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>o</mi></math> are of lengths  <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>2</mn></math>, <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>5</mn></math>, and <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>6</mn></math>, respectively. What is the measure of the angle between the sides <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>n</mi></math> and <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>o</mi><mo>?</mo></math> Round your answer to two decimal places.</p>
