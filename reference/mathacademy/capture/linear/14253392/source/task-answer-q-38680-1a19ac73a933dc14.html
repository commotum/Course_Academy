<div id="source-question"><div class="questionText"><p>The graph of a polynomial <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>p</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></math> is shown above. Which of the following statements are correct?</p>
<ol class="questionStatements"><li>  <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>p</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo accent="false" stretchy="false">→</mo><mo>−</mo><mi mathvariant="normal">∞</mi></math> as <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>x</mi><mo accent="false" stretchy="false">→</mo><mi mathvariant="normal">∞</mi><mo>.</mo></math> </li><li>  <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>x</mi><mo>=</mo><mo>−</mo><mn>1</mn></math> is a simple root. </li><li>  <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>x</mi><mo>=</mo><mn>2</mn></math> is a root of even multiplicity. </li></ol></div><table class="questionWidget-choicesTable"><tbody><tr><td><span class="choiceLetterCircle" id="source-choice-1">a</span></td><td class="choiceText">I only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-2">b</span></td><td class="choiceText">II only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-3">c</span></td><td class="choiceText">II and III only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-4">d</span></td><td class="choiceText">III only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-5">e</span></td><td class="choiceText">I and II only</td></tr></tbody></table></div>
