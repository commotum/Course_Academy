<div id="source-question"><div class="questionText"><p>Given that <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>P</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></math> is a polynomial of degree <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>5</mn><mo>,</mo></math> which of the following statements are always true?</p>
<ol class="questionStatements"><li>  <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>P</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo>−</mo><mn>4</mn><msup><mi>x</mi><mn>6</mn></msup></math> is a polynomial </li><li>  <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>4</mn><msup><mi>x</mi><mn>6</mn></msup><mo>⋅</mo><mi>P</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></math> is a polynomial </li><li>  <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><mn>4</mn><msup><mi>x</mi><mn>6</mn></msup></mrow><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></mrow></mfrac></mstyle></math> is a polynomial </li></ol></div><table class="questionWidget-choicesTable"><tbody><tr><td><span class="choiceLetterCircle" id="source-choice-1">a</span></td><td class="choiceText">I and II only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-2">b</span></td><td class="choiceText">I and III only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-3">c</span></td><td class="choiceText">II and III only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-4">d</span></td><td class="choiceText">I only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-5">e</span></td><td class="choiceText">II only</td></tr></tbody></table></div>
