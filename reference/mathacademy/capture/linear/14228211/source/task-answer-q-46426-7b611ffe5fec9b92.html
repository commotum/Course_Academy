<div id="source-question"><div class="questionText"><p>If <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>P</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></math> and <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>Q</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></math> are polynomials of degree <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>3</mn></math> and <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>5</mn></math>, respectively, which of the following statements are true?</p>
<ol class="questionStatements"><li>  <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>P</mi><mo>+</mo><mi>Q</mi></math> is always a polynomial </li><li>  <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>P</mi><mo>⋅</mo><mi>Q</mi></math> is always a polynomial </li><li>  <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mstyle displaystyle="true" scriptlevel="0"><mfrac><mi>P</mi><mi>Q</mi></mfrac></mstyle></math> is always a polynomial </li></ol></div><table class="questionWidget-choicesTable"><tbody><tr><td><span class="choiceLetterCircle" id="source-choice-1">a</span></td><td class="choiceText">I and II only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-2">b</span></td><td class="choiceText">I, II, and III</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-3">c</span></td><td class="choiceText">II and III only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-4">d</span></td><td class="choiceText">III only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-5">e</span></td><td class="choiceText">None</td></tr></tbody></table></div>
