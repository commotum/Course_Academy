<div id="questionExplanation-12624" class="questionExplanation" style="display: block;"><p>Remember that slope is the amount the line rises vertically per unit that it runs horizontally.</p>
<p>Since the graph decreases (<mjx-container class="MathJax CtxtMenu_Attached_0" jax="CHTML" tabindex="0" ctxtmenu_counter="43" style="font-size: 113.1%; position: relative;"><mjx-math class="MJX-TEX" aria-hidden="true"><mjx-mo class="mjx-n"><mjx-c class="mjx-c2198"></mjx-c></mjx-mo></mjx-math><mjx-assistive-mml unselectable="on" display="inline"><math xmlns="http://www.w3.org/1998/Math/MathML"><mo stretchy="false">↘</mo></math></mjx-assistive-mml></mjx-container>) as we go from left to right, the line rises by a negative amount.</p>
<p>Therefore, the slope of the line is negative.</p>
