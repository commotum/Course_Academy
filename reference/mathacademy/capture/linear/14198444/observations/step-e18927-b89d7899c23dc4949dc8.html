                            }</style><p>First, note that the denominator's conjugate is <span class="mjpage"><svg xmlns:xlink="http://www.w3.org/1999/xlink" width="7.748ex" height="3.009ex" style="vertical-align: -0.671ex;" viewBox="0 -1006.6 3335.9 1295.7" role="img" focusable="false" xmlns="http://www.w3.org/2000/svg" aria-labelledby="MathJax-SVG-1-Title">
