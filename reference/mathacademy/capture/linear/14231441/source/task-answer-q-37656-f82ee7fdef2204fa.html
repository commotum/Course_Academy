<div id="source-question"><div class="questionText"><p>Which of the following is a root of the polynomial <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><msup><mi>x</mi><mn>3</mn></msup><mo>−</mo><mn>6</mn><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>9</mn><mi>x</mi><mo>+</mo><mn>1</mn><mo>?</mo></math></p>
