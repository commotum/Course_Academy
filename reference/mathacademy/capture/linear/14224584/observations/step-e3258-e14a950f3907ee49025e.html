                            }</style><p>We compute the three reciprocal trigonometric ratios as follows:</p>
<p><span class="mjpage mjpage__block"><svg xmlns:xlink="http://www.w3.org/1999/xlink" width="34.976ex" height="21.176ex" style="vertical-align: -10.005ex;" viewBox="0 -4809.9 15059 9117.4" role="img" focusable="false" xmlns="http://www.w3.org/2000/svg" aria-labelledby="MathJax-SVG-1-Title">
<title id="MathJax-SVG-1-Title">
	\eqalign{
		\csc\theta &amp;= \dfrac{1}{\sin\theta} = \dfrac {\text{hypotenuse}} {\text{opposite}} = \dfrac 5 3, <span>\</span>[5pt]
		\sec\theta &amp;= \dfrac{1}{\cos\theta} =  \dfrac {\text{hypotenuse}} {\text{adjacent}} = \dfrac 5 4, <span>\</span>[5pt]
		\cot\theta &amp;= \dfrac{1}{\tan\theta} = \dfrac {\text{adjacent}} {\text{opposite}} = \dfrac 4 3.
	}
</title>
