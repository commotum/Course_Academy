<div id="source-question"><div class="questionText"><p>The growth of a mice colony is given by the formula <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>M</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>=</mo><mn>6</mn><mo>⋅</mo><msup><mn>2</mn><mrow data-mjx-texclass="ORD"><mi>t</mi></mrow></msup><mo>,</mo></math> where <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>t</mi></math> is the time, in months, since the beginning of the observation. How many mice will the colony have after <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>5</mn></math> months?</p>
