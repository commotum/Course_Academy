<div id="source-question"><div class="questionText"><p>The time, in hours, it takes to empty a pool varies inversely with the rate of pumping, in gallons per hour (<math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mtext>gph</mtext></math>). If it takes <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>5</mn></math> hours to empty the pool at a rate of <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>200</mn><mstyle scriptlevel="0"><mspace width="0.167em"></mspace></mstyle><mtext>gph</mtext><mo>,</mo></math> what is the constant of variation?</p>
</div><table class="questionWidget-choicesTable"><tbody><tr><td><span class="choiceLetterCircle" id="source-choice-1">a</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>1</mn><mstyle scriptlevel="0"><mspace width="0.167em"></mspace></mstyle><mn>000</mn></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-2">b</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>10</mn><mstyle scriptlevel="0"><mspace width="0.167em"></mspace></mstyle><mn>000</mn></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-3">c</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>40</mn></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-4">d</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>0.025</mn></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-5">e</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>4</mn></math></td></tr></tbody></table></div>
