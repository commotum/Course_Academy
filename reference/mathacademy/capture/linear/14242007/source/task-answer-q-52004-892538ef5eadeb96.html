<div id="source-question"><div class="questionText"><p>For a fixed temperature, the pressure <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>P</mi></math> of a gas varies inversely with the volume <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>V</mi></math> that it occupies. When <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>V</mi><mo>=</mo><mn>3</mn><mstyle scriptlevel="0"><mspace width="0.167em"></mspace></mstyle><msup><mtext>m</mtext><mn>3</mn></msup><mo>,</mo></math> the pressure is <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>P</mi><mo>=</mo><mn>2</mn></math> megapascal (<math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mtext>MPa</mtext></math>). What will be the pressure if the gas is compressed to a container with volume <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>V</mi><mo>=</mo><mn>2</mn><mstyle scriptlevel="0"><mspace width="0.167em"></mspace></mstyle><msup><mtext>m</mtext><mn>3</mn></msup><mo>?</mo></math></p>
