<div id="source-question"><div class="questionText"><p>The time <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>t</mi></math>, in minutes (<math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mrow data-mjx-texclass="ORD"><mi data-mjx-auto-op="false">min</mi></mrow></math>), it takes for an ice cream to melt is inversely proportional to the environment's temperature <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>T</mi><mo>,</mo></math> in degrees Celsius (<math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><msup><mi></mi><mo>∘</mo></msup><mi>C</mi></math>). If it takes <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>10</mn><mstyle scriptlevel="0"><mspace width="0.167em"></mspace></mstyle><mrow data-mjx-texclass="ORD"><mi data-mjx-auto-op="false">min</mi></mrow></math> for an ice cream to melt at  <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><msup><mn>30</mn><mo>∘</mo></msup><mi>C</mi><mo>,</mo></math> how much time it takes for the ice cream to melt at <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><msup><mn>20</mn><mo>∘</mo></msup><mi>C</mi><mo>?</mo></math></p>
