<div id="source-question"><div class="questionText"><p>The surface <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>S</mi><mo>,</mo></math> in square centimeters, of a cylinder whose height equals the radius of its base varies directly with the <strong>square</strong> of its radius <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>r</mi><mo>,</mo></math> measured in centimeters. If the surface is <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>16</mn><mi>π</mi><mstyle scriptlevel="0"><mspace width="0.167em"></mspace></mstyle><msup><mtext>cm</mtext><mn>2</mn></msup></math> when the radius is <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>2</mn><mstyle scriptlevel="0"><mspace width="0.167em"></mspace></mstyle><mtext>cm</mtext><mo>,</mo></math> then what is the constant of variation?</p>
