<div id="source-question"><div class="questionText"><p>Which of the following values of <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>x</mi></math> satisfy the inequality <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mstyle displaystyle="true" scriptlevel="0"><mfrac><mi>x</mi><mn>5</mn></mfrac></mstyle><mo>&gt;</mo><mn>2</mn><mstyle scriptlevel="0"><mspace width="0.167em"></mspace></mstyle><mo>?</mo></math></p>
