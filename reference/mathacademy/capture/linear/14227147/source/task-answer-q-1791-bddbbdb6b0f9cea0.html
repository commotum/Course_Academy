<div id="source-question"><div class="questionText"><p>John couldn't recall the serial number on his new bike, but he remembered that it was <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>4</mn></math> digits long, each digit ranged from <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>0</mn></math> to <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>9</mn></math> and that none of the digits were used more than once. How many of these serial numbers are possible?</p>
</div><table class="questionWidget-choicesTable"><tbody><tr><td><span class="choiceLetterCircle" id="source-choice-1">a</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>5</mn><mstyle scriptlevel="0"><mspace width="0.167em"></mspace></mstyle><mn>040</mn></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-2">b</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>960</mn></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-3">c</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>7</mn><mstyle scriptlevel="0"><mspace width="0.167em"></mspace></mstyle><mn>840</mn></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-4">d</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>210</mn></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-5">e</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>1</mn><mstyle scriptlevel="0"><mspace width="0.167em"></mspace></mstyle><mn>810</mn></math></td></tr></tbody></table></div>
