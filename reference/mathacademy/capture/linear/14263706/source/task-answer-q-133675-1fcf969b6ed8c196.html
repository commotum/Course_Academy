<div id="source-question"><div class="questionText"><p>Given that <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>a</mi></math> and <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>b</mi></math> are both <strong>irrational</strong> numbers, which of the following statements are true?</p>
<ol class="questionStatements"><li>  <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>a</mi><mo>+</mo><mi>b</mi></math> is always rational </li><li>  <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>a</mi><mo>−</mo><mi>b</mi></math> is always irrational </li><li>  <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>a</mi><mo>−</mo><mi>b</mi></math> is sometimes rational and sometimes irrational </li></ol></div><table class="questionWidget-choicesTable"><tbody><tr><td><span class="choiceLetterCircle" id="source-choice-1">a</span></td><td class="choiceText">III only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-2">b</span></td><td class="choiceText">I only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-3">c</span></td><td class="choiceText">II only</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-4">d</span></td><td class="choiceText">I, II, and III</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-5">e</span></td><td class="choiceText">None of the statements are true</td></tr></tbody></table></div>
