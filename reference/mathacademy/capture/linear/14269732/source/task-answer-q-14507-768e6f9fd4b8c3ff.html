<div id="source-question"><div class="questionText"><p>A triangle has sides <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>x</mi></math>, <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>y</mi></math>, and <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>z</mi><mo>.</mo></math> The sides <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>x</mi></math> and <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>z</mi></math> have lengths <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>3</mn></math> and <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>4</mn></math>, respectively. If the angle <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>Y</mi></math> between <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>x</mi></math> and <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>z</mi></math> has a measure of <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><msup><mn>139</mn><mo>∘</mo></msup></math>, what is the length of side <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>y</mi><mo>?</mo></math> Round your answer to two decimal places.</p>
</div><table class="questionWidget-choicesTable"><tbody><tr><td><span class="choiceLetterCircle" id="source-choice-1">a</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>6.57</mn></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-2">b</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>9.36</mn></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-3">c</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>7.28</mn></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-4">d</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>8.63</mn></math></td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-5">e</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>7.92</mn></math></td></tr></tbody></table></div>
