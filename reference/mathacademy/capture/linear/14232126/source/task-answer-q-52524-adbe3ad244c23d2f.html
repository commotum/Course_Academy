<div id="source-question"><div class="questionText"><p>Consider the following sequence: 
<math xmlns="http://www.w3.org/1998/Math/MathML" display="true"><mo>−</mo><mn>1</mn><mo>,</mo><mstyle scriptlevel="0"><mspace width="1em"></mspace></mstyle><mstyle displaystyle="true" scriptlevel="0"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><mo>,</mo><mstyle scriptlevel="0"><mspace width="1em"></mspace></mstyle><mo>−</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mn>1</mn><mn>4</mn></mfrac></mstyle><mo>,</mo><mstyle scriptlevel="0"><mspace width="1em"></mspace></mstyle><mstyle displaystyle="true" scriptlevel="0"><mfrac><mn>1</mn><mn>8</mn></mfrac></mstyle><mo>,</mo><mstyle scriptlevel="0"><mspace width="1em"></mspace></mstyle><mo>−</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mn>1</mn><mn>16</mn></mfrac></mstyle><mo>,</mo><mstyle scriptlevel="0"><mspace width="1em"></mspace></mstyle><mo>…</mo></math>
The recursive formula for this sequence is given by 
<math xmlns="http://www.w3.org/1998/Math/MathML" display="true"><msub><mi>a</mi><mrow data-mjx-texclass="ORD"><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub><mo>=</mo><mstyle style="border: 1pt solid black"><mpadded height="+3pt" depth="+3pt" lspace="3pt" width="+6pt"><mrow data-mjx-texclass="ORD"><mphantom><mi>A</mi></mphantom></mrow></mpadded></mstyle><mo>⋅</mo><msub><mi>a</mi><mi>n</mi></msub><mo>,</mo><mstyle scriptlevel="0"><mspace width="2em"></mspace></mstyle><msub><mi>a</mi><mn>1</mn></msub><mo>=</mo><mstyle style="border: 1pt solid black"><mpadded height="+3pt" depth="+3pt" lspace="3pt" width="+6pt"><mrow data-mjx-texclass="ORD"><mphantom><mi>A</mi></mphantom></mrow></mpadded></mstyle><mstyle scriptlevel="0"><mspace width="0.167em"></mspace></mstyle><mo>.</mo></math>
From left to right, what are the missing values?</p>
