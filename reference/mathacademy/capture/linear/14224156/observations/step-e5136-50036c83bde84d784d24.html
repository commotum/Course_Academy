<p><span class="mjpage mjpage__block"><svg xmlns:xlink="http://www.w3.org/1999/xlink" width="24.368ex" height="31.843ex" style="vertical-align: -15.038ex; margin-bottom: -0.3ex;" viewBox="0 -7106.1 10491.6 13710" role="img" focusable="false" xmlns="http://www.w3.org/2000/svg" aria-labelledby="MathJax-SVG-3-Title">
<title id="MathJax-SVG-3-Title">
	\require{cancel}
	\eqalign{
		\dfrac {2a^2(1+b)} {3b}  \div  \dfrac{1+b}{5b^2}&amp;=<span>\</span>[5pt]
		\dfrac {2a^2(1+b)} {3b}  \cdot  \dfrac {5b^2} {1+b}&amp;=<span>\</span>[5pt]
		\dfrac {2a^2\cancel{(1+b)}} {3\cancel{b}}  \cdot  \dfrac {5b^{\cancel{2}}} {\cancel{1+b}}&amp;=<span>\</span>[5pt]
		\dfrac {10a^2b} {3}  
	}
</title>
