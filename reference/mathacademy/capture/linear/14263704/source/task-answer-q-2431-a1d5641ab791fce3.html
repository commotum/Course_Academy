<div id="source-question"><div class="questionText"><p>A leaky pool is losing water. The amount of water lost after <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>t</mi></math> hours is given by the expression <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><msup><mi>t</mi><mn>2</mn></msup><mo>−</mo><mi>t</mi><mo>+</mo><mn>3</mn></math> gallons, where <math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mi>t</mi><mo>≥</mo><mn>0.</mn></math> What is the average rate of water loss over the first twelve hours?</p>
</div><table class="questionWidget-choicesTable"><tbody><tr><td><span class="choiceLetterCircle" id="source-choice-1">a</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>11</mn></math> gallons per hour</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-2">b</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>14</mn></math> gallons per hour</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-3">c</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>16</mn></math> gallons per hour</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-4">d</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>18</mn></math> gallons per hour</td></tr><tr><td><span class="choiceLetterCircle" id="source-choice-5">e</span></td><td class="choiceText"><math xmlns="http://www.w3.org/1998/Math/MathML" display="false"><mn>12</mn></math> gallons per hour</td></tr></tbody></table></div>
