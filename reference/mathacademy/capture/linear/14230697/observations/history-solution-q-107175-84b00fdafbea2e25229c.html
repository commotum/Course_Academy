<div id="questionExplanation-107175" class="questionExplanation" style="display: block;"><p>The solid is an <strong>oblique cylinder</strong>. </p>
<p>Notice the following:</p>
<ul>
<li><p>The solid has two parallel circular bases. So, it's a cylinder. </p>
</li>
<li><p>The axis that passes through the centers of the circles is not perpendicular to the bases. So, it's oblique, not right.</p>
</li>
</ul>
</div>
