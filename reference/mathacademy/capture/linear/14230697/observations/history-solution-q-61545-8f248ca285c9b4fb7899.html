<div id="questionExplanation-61545" class="questionExplanation" style="display: block;"><p>The solid is a <strong>rectangular prism</strong> since all its faces are rectangles.</p>
<p>Also, notice that:</p>
<ul>
<li><p>The solid is not a triangular (pentagonal or hexagonal) prism since it does not have a triangular (pentagonal or hexagonal) base.</p>
</li>
<li><p>The solid is not a cube since its faces are not squares.</p>
</li>
</ul>
</div>
