            <div class="exampleQuestion">
                <p>Which of the following is <strong>not</strong> a polyhedron?</p>
<p><br></p>
<div id="graphic-4efe20841a64bdb15fd00b399be9b633" class="graphic"><img src="/graphics/4efe20841a64bdb15fd00b399be9b633"></div>
            </div>     

            <div class="explanationHeader">EXPLANATION</div>

            <div class="exampleExplanation">
                <p>Each face in a polyhedron must be a polygon. Therefore, the only option that is <strong>not</strong> a polyhedron is:</p>
<p><br></p>
<div id="graphic-e7c018cff615575f30d66457c542d427" class="graphic"><img src="/graphics/e7c018cff615575f30d66457c542d427"></div>

<p><br></p>
<p>Notice that one of its faces is not a polygon (it has <font style="color:red">curved</font> sides).</p>

            </div>
