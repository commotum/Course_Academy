<div id="questionExplanation-117677" class="questionExplanation" style="display: block;"><p>The solid is an <strong>oblique cone</strong>. </p>
<p>Notice the following:</p>
<ul>
<li><p>The solid has one circular base and one vertex. So, it's a cone. </p>
</li>
<li><p>The axis that passes through the center of the circle and the vertex is not perpendicular to the base. So, it's oblique, not right.</p>
</li>
</ul>
</div>
