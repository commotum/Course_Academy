<!--
>> Recall that the principal [math]n[/math]th root of [math]1[/math] is [math]z=e^{2\pi\text{i}/n}\neq1,[/math] and that any [math]n[/math]th root of unity is of the form [math]z^k[/math] for [math]n=0,1,...,n-1.[/math] So, the product of all [math]n[/math] roots is
\begin{align*}
1\cdot z\cdot z^2 \cdot \cdots \cdot z^{n-1} 
&= z^{1+2+3+\cdots+(n-1)} \\[5pt]
&= z^{n(n-1)/2} \\[5pt]
&= z^{n(n-1)/2} \\[5pt]

&= \left(e^{\pi\text{i}}\right)^{n-1}.
\end{align*}  

>> If [math]n=2t-1[/math] is odd, then
\begin{align*}
\left(e^{\pi\text{i}}\right)^{n-1} 
&= \left(e^{\pi\text{i}}\right)^{2t} \\[5pt]
&= \left(e^{2\pi\text{i}}\right)^{t} \\[5pt]
&= 1^k \\[5pt]
&= 1.
\end{align*}  

>> If [math]n=2t[/math] is even, then
\begin{align*}
\left(e^{\pi\text{i}}\right)^{m-1} 
&= \left(e^{\pi\text{i}}\right)^{2t-1} \\[5pt]
&= \left(e^{\pi\text{i}}\right)^{2t}\cdot \left(e^{\pi\text{i}}\right)^{-1} \\[5pt]
&= \left(e^{2\pi\text{i}}\right)^{t}\cdot e^{-\pi\text{i}} \\[5pt]
&= 1^t \cdot (-1) \\[5pt]
&= -1.
\end{align*}
