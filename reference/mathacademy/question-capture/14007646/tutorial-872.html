<p>So, we evaluate our integral as follows: </p>
<p><span class="mjpage mjpage__block"><svg xmlns:xlink="http://www.w3.org/1999/xlink" width="52.316ex" height="23.509ex" style="vertical-align: -11.171ex;" viewBox="0 -5312.2 22525 10122" role="img" focusable="false" xmlns="http://www.w3.org/2000/svg" aria-labelledby="MathJax-SVG-3-Title">
<title id="MathJax-SVG-3-Title">
\eqalign{
		\int \left(3\sin^2 x+  3\cos^2 x\right ) \, \textrm{d}x  &amp;=  \int 3(\underbrace{\sin^2 x +\cos^2 x }_1 )\, \textrm{d}x<span>\</span>
				                                                                &amp;=\int 3(1) \, \textrm{d}x<span>\</span>
				                                                                &amp;=\int 3  \, \textrm{d}x<span>\</span>
				                                                                &amp;=3x+C
}
</title>
