 5}=\\text{undefined}\n$$\n\nOn the other hand, there are $4$ columns in $P$ and $2$ rows in $R.$ Since the number of columns in $P$ does **not** equal the number of rows in $R,$ the matrices $P$ and $R$ are **not** conformable for multiplication:\n\n$$\n{P}_{1\\times 4}{\\times }_{\\ne }{R}_{2\\times 1}=\\text{undefined}\n$$\n\nFinally, there is $1$ column in $R$ and $1$ row in $P.$ Since the number of columns in $R$ equals the number of rows in $P,$ the matrices $R$ and $P$ are conformable for multiplication:\n\n$$\n{R}_{2\\times \\boxed{\\text{1}}}{\\times }_{✓}{P}_{\\boxed{\\text{1}}\\times 4}=\\text{well defined}\n$$\n\nThe product $RP$ is well defined. The products $RO$ and $PR$ are undefined.", ":question/id": "795f6284-9977-53c9-b26a-515ee6438422", ":question/difficulty": ":question.difficulty/hard", ":question/answer-fields": [{":db/id": 17592186562860, ":answer-field/key": "The product $RP$ is well defined.", ":answer-field/id": "3045f8ab-525f-5485-b581-68eae6f98ef3", ":answer-field/type": ":answer-field.type/checkbox", ":answer-field/choices": [{":db/id": 17592186562862, ":answer/id": "34dafa4d-3944-582e-bbf7-64a2dcc62647", ":answer/type": ":answer.type/text", ":answer/value": "false"}, {":db/id": 17592186562909, ":answer/id": "d55b794e-24e2-5354-bfec-ef76085b2a8c", ":answer/type": ":answer.type/text", ":answer/value": "true"}], ":answer-field/correct": [":answer/id", "d55b794e-24e2-5354-bfec-ef76085b2a8c"]}, {":db/id": 17592186562865, ":answer-field/key": "The product $PR$ is well defined.", ":answer-field/id": "45d02062-6090-52e6-a662-c6361863dc12", ":answer-field/type": ":answer-field.type/checkbox", ":answer-field/choices": [{":db/id": 17592186562863, ":answer/id": "34e4c5ce-7e9c-5530-8b6b-ec090d2ebab0", ":answer/type": ":answer.type/text", ":answer/value": "false"}, {":db/id": 17592186562896, ":answer/id": "a87f780f-4b8f-5015-b434-03be4bcc01d7", ":answer/type": ":answer.type/text", ":answer/value": "true"}], ":answer-field/correct": [":answer/id", "3
