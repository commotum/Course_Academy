mns in $P$ and $1$ row in $S.$ Since the number of columns in $P$ does **not** equal the number of rows in $S,$ the matrices $P$ and $S$ are **not** conformable for multiplication:\n\n$$\n{P}_{3\\times 2}{\\times }_{\\ne }{S}_{1\\times 5}=\\text{undefined}\n$$\n\nFinally, there are $2$ columns in $R$ and $1$ row in $S.$ Since the number of columns in $R$ does **not** equal the number of rows in $S,$ the matrices $R$ and $S$ are **not** conformable for multiplication:\n\n$$\n{R}_{1\\times 2}{\\times }_{\\ne }{S}_{1\\times 5}=\\text{undefined}\n$$\n\nThe products $SP$, $PS$, and $RS$ are undefined. Select “None of these products is well defined.”", ":question/id": "e01af3ae-fb4a-5e38-8b42-8320c8e0b105", ":question/difficulty": ":question.difficulty/moderate", ":question/answer-fields": [{":db/id": 17592186562852, ":answer-field/key": "The product $PS$ is well defined.", ":answer-field/id": "002a391d-196d-5e6e-a5ad-c8c4da7a9101", ":answer-field/type": ":answer-field.type/checkbox", ":answer-field/choices": [{":db/id": 17592186562876, ":answer/id": "634eda15-ac4c-58ee-8987-5a03c7951b6f", ":answer/type": ":answer.type/text", ":answer/value": "true"}, {":db/id": 17592186562919, ":answer/id": "fab3f125-4732-5852-8a3b-74a036577c22", ":answer/type": ":answer.type/text", ":answer/value": "false"}], ":answer-field/correct": [":answer/id", "fab3f125-4732-5852-8a3b-74a036577c22"]}, {":db/id": 17592186562904, ":answer-field/key": "The product $RS$ is well defined.", ":answer-field/id": "c81cfd27-3d9f-55aa-bdd4-33c537434f5d", ":answer-field/type": ":answer-field.type/checkbox", ":answer-field/choices": [{":db/id": 17592186562855, ":answer/id": "07fe8f3f-cc9a-59da-b696-08b8234d657b", ":answer/type": ":answer.type/text", ":answer/value": "true"}, {":db/id": 17592186562900, ":answer/id": "bd7178d2-bc56-574e-b59d-1437513c672c", ":answer/type": ":answer.type/text", ":answer/value": "false"}], ":answer-field/correct": [":answer/id", "bd7178d2-bc56-574e-b59d-1437513c672c"]}, {":db/id": 1
