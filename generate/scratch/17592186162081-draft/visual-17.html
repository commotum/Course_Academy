ca-520f-af86-e734a47d8a46", ":answer/type": ":answer.type/math", ":answer/value": "25 \\pi"}, {":answer/id": "7a84551d-f769-5241-af5e-047be6bcc2d7", ":answer/type": ":answer.type/math", ":answer/value": "10"}], ":answer-field/correct": [":answer/id", "5c388fa7-70a8-5d5a-829c-46b08ab19b34"]}], ":question/difficulty": ":question.difficulty/easy", ":question/worked-solution": "The line integral of unity with respect to arc length over $C$ is equal to the arc length $L$ of $C,$ i.e.,\n\n$$\n\\int_C \\,\\textrm d s = L.\n$$\n\nIn this case, $C$ is a semicircle of radius $r = 5.$ Its arc length is given by\n\n$$\n\\begin{aligned}L &=\\pi r=5 \\pi .\\end{aligned}\n$$\n\nTherefore,\n\n$$\n\\int_C \\,\\textrm d s = 5 \\pi.\n$$"}, "generation": {"version": "unity-geometric-1", "seed": 0, "level": "easy", "template": "semicircle", "profile": "geometric", "parameters": {"r": "5"}, "source_id": null, "source": {"database": "math", "basis": 2275, "lineage": "01a12a15-3e0a-75a1-9dac-f8b8c5d5c3f1"}, "recipes": ["arc length", "full circumference", "quarter circumference", "diameter", "disk area"], "evidence_only": false, "eligible_for_learning": true, "mathematical_fingerprint": "b262483f3551ee841c76587437630878796d3f81e5eebe2e6330c4fe0cc05594", "geometry": {"kind": "semicircle", "radius": "5", "center": [0, 0], "theta": [0, 3.141592653589793], "direction": "counterclockwise", "bounds": [-6.0, 6.0, -1, 6.0], "helper": false}, "length": "5*pi", "values": ["5*pi", "10*pi", "5*pi/2", "10", "25*pi"], "runtime": {"python": "3.13.5", "sympy": "1.14.0", "matplotlib": "3.11.2"}, "math_format": "course-academy-tex-v1"}}}]</script><script type="module" src="browser-player.js"></script></body></html>
