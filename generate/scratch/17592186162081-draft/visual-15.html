<!doctype html><html><head><meta charset="utf-8"><title>Rendering</title><link rel="stylesheet" href="reference/ui/learning.css"><style>body{margin:20px;font:16px system-ui;color:#182537;background:white}article{max-width:820px;padding:18px;border:1px solid #ddd;margin:20px auto}h2{font-size:16px}img{max-width:100%;height:auto}#summary{display:none}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.choice{display:flex;align-items:center;border:1px solid #ddd}.choice .prose{flex:1}</style><script src="reference/ui/vendor/dompurify/purify.min.js"></script><script src="reference/ui/mathjax-config.js"></script><script defer src="reference/ui/vendor/mathjax/tex-svg.js"></script></head><body><pre id="summary">pending</pre><main></main><script type="application/json" id="data">[{"label": "Fresh private hard geometry 0", "record": {"knowledge_point": {"db_id": 17592186162081, "id": "b4ac9e7d-ea92-5cd3-af26-4c902196e80b", "title": "Calculating Line Integrals of Unity"}, "question": {":question/id": "1b624bbc-3f41-53a1-a315-5fb2824543a5", ":question/problem": "![](/home/jake/Developer/Course_Academy/generate/scratch/17592186162081-draft/assets/5509430e97fcf53fc806d7c0a04d90c2a026810bd2649e4124b19916b43df149.png)\n\nCalculate ${\\int }_{C}\\,\\text{d}s,$ where $C$ is the line segment shown above.", ":question/answer-fields": [{":answer-field/id": "47ec6708-9eab-5418-8710-4c52ab4cfcfd", ":answer-field/key": "selection", ":answer-field/type": ":answer-field.type/radio", ":answer-field/choices": [{":answer/id": "92987872-211e-551f-850a-fd74169d0ec5", ":answer/type": ":answer.type/math", ":answer/value": "\\frac{5}{4}"}, {":answer/id": "3cc23571-f93a-5b12-b52f-700d4aa05c84", ":answer/type": ":answer.type/math", ":answer/value": "\\frac{4}{3}"}, {":answer/id": "c370b646-7a90-568a-9f21-15cee0d9c98d", ":answer/type": ":answer.type/math", ":answer/value": "\\frac{\\sqrt{481}}{12}"}, {":answer/id": "0e95f83b-2b51-5457-994e-4ddad8065c78", ":answer/type": ":answer.type/math", ":answer/value": "\\frac{481}{144}"}, {":answer/id": "6f681544-96b2-5457-9831-a3698c722a38", ":answer/type": ":answer.type/math", ":answer/value": "\\frac{31}{12}"}], ":answer-field/correct": [":answer/id", "c370b646-7a90-568a-9f21-15cee0d9c98d"]}], ":question/difficulty": ":question.difficulty/hard", ":question/worked-solution": "The line integral of unity with respect to arc length over $C$ is equal to the arc length $L$ of $C,$ i.e.,\n\n$$\n{\\int }_{C}\\,\\text{d}s=L.\n$$\n\nIn this case, the path $C$ is the hypotenuse of a right triangle whose legs have lengths $\\frac{5}{4}$ and $\\frac{4}{3}:$ \n\n![](/home/jake/Developer/Course_Academy/generate/scratch/17592186162081-draft/assets/9e21f4e0a33eae6f3c13d3d719bed5fff2632fe1a53cffd073c809aee0c8a3ba.png)\n\nTherefore, we have\n\n$$\n\\begin{aligned}L & =\\sqrt{{\\frac{5}{4}}^{2}+{\\frac{4}{3}}^{2}} \\\\  & =\\sqrt{\\frac{25}{16}+\\frac{16}{9}} \\\\  & =\\sqrt{\\frac{481}{144}} \\\\  & =\\frac{\\sqrt{481}}{12}.\\end{aligned}\n$$\n\nTherefore,\n\n$$\n{\\int }_{C}\\,\\text{d}s=\\frac{\\sqrt{481}}{12}.\n$$"}, "generation": {"version": "unity-geometric-1", "seed": 0, "level": "hard", "template": "diagonal_helper", "profile": "geometric", "parameters": {"x1": "-7/13", "y1": "-5/13", "x2": "31/39", "y2": "45/52"}, "source_id": null, "source": {"database": "math", "basis": 2275, "lineage": "01a12a15-3e0a-75a1-9dac-f8b8c5d5c3f1"}, "recipes": ["Pythagorean length", "horizontal leg", "vertical leg", "sum of legs", "squared length"], "evidence_only": false, "eligible_for_learning": true, "mathematical_fingerprint": "f8b00459c427c328e79efcc358e1e0e474411d5eb8c7fd3319f48a0970ecfa9d", "geometry": {"kind": "diagonal_helper", "endpoints": [["-7/13", "-5/13"], ["31/39", "45/52"]], "direction": "first to second", "helper": false, "helper_corner": ["31/39", "-5/13"], "bounds": [-1.5384615384615383, 1.7948717948717947, -1.3846153846153846, 1.8653846153846154]}, "length": "sqrt(481)/12", "values": ["sqrt(481)/12", "4/3", "5/4", "31/12", "481/144"], "runtime": {"python": "3.13.5", "sympy": "1.14.0", "matplotlib": "3.11.2"}, "math_format": "course-academy-tex-v1"}}}]</script><script type="module" src="browser-player.js"></script></body></html>
