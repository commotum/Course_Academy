<!doctype html><html><head><meta charset="utf-8"><title>Rendering</title><link rel="stylesheet" href="reference/ui/navigation.css"><link rel="stylesheet" href="reference/ui/learning.css"><style>body{margin:20px;font:16px system-ui;color:#182537;background:white}article{max-width:820px;padding:18px;border:1px solid #ddd;margin:20px auto}h2{font-size:16px}math-field.answer-math{background:#f7f9fc;color:#182537;border:1px solid #b7c3d1;color-scheme:light}img{max-width:100%;height:auto}#summary{display:none}</style><script src="reference/ui/vendor/dompurify/purify.min.js"></script><script src="reference/ui/mathjax-config.js"></script><script defer src="reference/ui/vendor/mathjax/tex-svg.js"></script></head><body><pre id="summary">pending</pre><main></main><script type="application/json" id="data">[{"label": "Source replay q-166761", "record": {"knowledge_point": {"db_id": 17592186073752, "id": "5e79a91b-c479-53da-9f06-59c082fa4187", "title": "Solving a System of Linear Equations Using Substitution"}, "question": {":question/id": "f8245f78-7777-57aa-8223-e621ee26a40c", ":question/difficulty": ":question.difficulty/easy", ":question/problem": "Mary wonders where and when they'd meet if Sam left home $3.8$ minutes earlier and walked with a speed of $50$ meters per minute. She finds that the distance $d$ from home they'd meet can be modeled using the following system of equations.\n\n$$\n\\left\\{\\begin{aligned}d+60t &=960 \\\\ d-50t &=190.\\end{aligned}\\right.\n$$\n\nwhere $t$ is the time (in minutes) since Mary left the community park.\n\nMary and Sam would meet$\\,$\n{{field-1}}$\\,$minutes after Mary left the community park.\n\nMary and Sam would meet at a distance of $\\,$\n{{field-2}}$\\,$meters from home.", ":question/worked-solution": "To solve the given system of linear equations, we will isolate a variable in one of the equations and then substitute it into the other equation. It doesn't matter which equation we pick first, so we choose the easiest one. In this case, the second equation looks like the easiest.\n\nUsing the second equation, we can isolate $d$ adding to both sides of the equation $50t:$\n\n$$\n\\begin{aligned}d-50t & =190 \\\\ d & =190+50t\\end{aligned}\n$$\n\nSo, we replace $d$ with $190+50t$ in the first equation and solve for $t:$\n\n$$\n\\begin{aligned}d+60t & =960 \\\\ (190+50t)+60t & =960 \\\\ 190+110t & =960 \\\\ 110t & =960-190 \\\\ 110t & =770 \\\\ t & =\\frac{770}{110} \\\\ t & =7.\\end{aligned}\n$$\n\nTherefore, they would have met after $t=7$ minutes.\n\nIf we substitute $t=7$ into $d=190+50t$, we can find the value of $d:$\n\n$$\n\\begin{aligned}d & =190+50t \\\\  & =190+50(7) \\\\  & =540\\end{aligned}\n$$\n\nTherefore, they meet at a distance of $540$ meters from home.", ":question/answer-fields": [{":answer-field/id": "72c55d14-fd00-5c9c-b8e9-15ba81eb8c16", ":answer-field/key": "field-1", ":answer-field/type": ":answer-field.type/blank", ":answer-field/choices": [{":answer/id": "8c2e6daa-8b6b-51df-90d5-7da0ce0ba637", ":answer/type": ":answer.type/math", ":answer/value": "7"}], ":answer-field/correct": [":answer/id", "8c2e6daa-8b6b-51df-90d5-7da0ce0ba637"]}, {":answer-field/id": "7ea3b7b9-8ed4-59ff-923e-67b82330e4d4", ":answer-field/key": "field-2", ":answer-field/type": ":answer-field.type/blank", ":answer-field/choices": [{":answer/id": "2f6a97a1-7982-5b09-9345-72306a915a34", ":answer/type": ":answer.type/math", ":answer/value": "540"}], ":answer-field/correct": [":answer/id", "2f6a97a1-7982-5b09-9345-72306a915a34"]}]}, "generation": {"version": "substitution-2275-draft-v2", "database": "math", "basis": 2275, "lineage": "01a12a15-3e0a-75a1-9dac-f8b8c5d5c3f1", "template": "meeting_context", "target": "forward", "seed": 23, "parameters": {"M": "60", "s": "50", "L": "960", "H": "190"}, "bank_profile": "source_166761", "origin": "source-parameter replay; missing captured fields independently completed", "serving_eligible": true, "mathematical_fingerprint": "93a61017b28e67965b8307a21b592dc418b04
