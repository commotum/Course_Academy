 the value of $b:$\n\n$$\n\\begin{aligned}b & =180-15(-9) \\\\ b & =315\\end{aligned}\n$$\n\nTherefore, the solution to the system of equations is $a=-9,\\,b=315.$", ":question/answer-fields": [{":answer-field/id": "9aff6bb2-2f15-500b-99a0-5aa6b4dba2c4", ":answer-field/key": "field-1", ":answer-field/type": ":answer-field.type/blank", ":answer-field/choices": [{":answer/id": "1405bcf5-10f0-5223-9618-85c6033f8124", ":answer/type": ":answer.type/math", ":answer/value": "-9"}], ":answer-field/correct": [":answer/id", "1405bcf5-10f0-5223-9618-85c6033f8124"]}, {":answer-field/id": "8a06d32f-3b2e-5667-9ac7-16d21a09cf86", ":answer-field/key": "field-2", ":answer-field/type": ":answer-field.type/blank", ":answer-field/choices": [{":answer/id": "a61f46b2-01d4-5592-a583-99b4df0e68f0", ":answer/type": ":answer.type/math", ":answer/value": "315"}], ":answer-field/correct": [":answer/id", "a61f46b2-01d4-5592-a583-99b4df0e68f0"]}]}, "generation": {"version": "substitution-2275-draft-v2", "database": "math", "basis": 2275, "lineage": "01a12a15-3e0a-75a1-9dac-f8b8c5d5c3f1", "template": "coefficient_a_first", "target": "forward", "seed": 0, "parameters": {"C": "180", "k": "15", "m": "3", "n": "95", "R": "90"}, "bank_profile": null, "origin": "authored bank/level or parameter extension", "serving_eligible": true, "mathematical_fingerprint": "a6057d9671e02469f8564c9adc133a6fa295bdae3135de89b2c7cd59da735203", "content_fingerprint": "7c6d70da82bccbcaff1be4e8d73e35b081e263c4d50e5d52e5d3ac56cdd8fef1", "domain": "Unique real solution of supplied two-variable linear system; integer equation coefficients; exact rational answers; preisolated, unit-isolation, known-variable, or supplied-context substitution workload", "plot_rating": "none", "math_format": "course-academy-tex-v1"}}}]</script><script type="module" src="browser-player.js"></script></body></html>
