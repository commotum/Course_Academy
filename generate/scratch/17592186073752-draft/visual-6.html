\\frac{3}{2}\\end{aligned}\n$$\n\nTherefore, the solution to the system of equations is $u=-\\frac{3}{2},\\,v=-\\frac{1}{2},$ which can be expressed as $(-\\frac{3}{2},-\\frac{1}{2}).$", ":question/answer-fields": [{":answer-field/id": "24371384-a3f6-5d45-9c76-5d62d71a2ffc", ":answer-field/key": "field-1", ":answer-field/type": ":answer-field.type/blank", ":answer-field/choices": [{":answer/id": "d945dffb-c13b-5701-a4a8-ad7c4b3ff241", ":answer/type": ":answer.type/math", ":answer/value": "-\\frac{3}{2}"}], ":answer-field/correct": [":answer/id", "d945dffb-c13b-5701-a4a8-ad7c4b3ff241"]}, {":answer-field/id": "a5661be3-3e1c-5a21-84f4-0da51e30c4db", ":answer-field/key": "field-2", ":answer-field/type": ":answer-field.type/blank", ":answer-field/choices": [{":answer/id": "29460352-350a-504d-9dc4-c8f6d68d7a4a", ":answer/type": ":answer.type/math", ":answer/value": "-\\frac{1}{2}"}], ":answer-field/correct": [":answer/id", "29460352-350a-504d-9dc4-c8f6d68d7a4a"]}]}, "generation": {"version": "substitution-2275-draft-v2", "database": "math", "basis": 2275, "lineage": "01a12a15-3e0a-75a1-9dac-f8b8c5d5c3f1", "template": "preisolated_uv", "target": "forward", "seed": 23, "parameters": {"A": "4", "B": "-6", "C": "-3", "S": "-1", "T": "-2"}, "bank_profile": "source_181149", "origin": "source-parameter replay; missing captured fields independently completed", "serving_eligible": true, "mathematical_fingerprint": "cfaa964525719f5d352d468f892a227b7505c25164eacd9c0f600cb257334055", "content_fingerprint": "21999695a0c30611e01caa0a9be7465c3a44f8a399401cfbcb37ccfe43b65e06", "domain": "Unique real solution of supplied two-variable linear system; integer equation coefficients; exact rational answers; preisolated, unit-isolation, known-variable, or supplied-context substitution workload", "plot_rating": "none", "math_format": "course-academy-tex-v1"}}}]</script><script type="module" src="browser-player.js"></script></body></html>
