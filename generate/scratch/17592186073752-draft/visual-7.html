<!doctype html><html><head><meta charset="utf-8"><title>Rendering</title><link rel="stylesheet" href="reference/ui/navigation.css"><link rel="stylesheet" href="reference/ui/learning.css"><style>body{margin:20px;font:16px system-ui;color:#182537;background:white}article{max-width:820px;padding:18px;border:1px solid #ddd;margin:20px auto}h2{font-size:16px}math-field.answer-math{background:#f7f9fc;color:#182537;border:1px solid #b7c3d1;color-scheme:light}img{max-width:100%;height:auto}#summary{display:none}</style><script src="reference/ui/vendor/dompurify/purify.min.js"></script><script src="reference/ui/mathjax-config.js"></script><script defer src="reference/ui/vendor/mathjax/tex-svg.js"></script></head><body><pre id="summary">pending</pre><main></main><script type="application/json" id="data">[{"label": "Source replay q-181175", "record": {"knowledge_point": {"db_id": 17592186073752, "id": "5e79a91b-c479-53da-9f06-59c082fa4187", "title": "Solving a System of Linear Equations Using Substitution"}, "question": {":question/id": "4d53cfab-2bb2-54b3-8921-dea42cdc0b68", ":question/difficulty": ":question.difficulty/hard", ":question/problem": "Consider the following system of equations:\n\n$$\n\\left\\{\\begin{aligned}-2x+y &=-4 \\\\ x-3y &=-8\\end{aligned}\\right.\n$$\n\nFind the solution $(x,y)$ to this system using the method of substitution.\n\n$(x,y)=($\n{{field-1}}\n$,$\n{{field-2}}\n$)$", ":question/worked-solution": "We will isolate a variable in one of the equations and then substitute it into the other equation. It doesn't matter which equation we pick first, so we choose the easiest one. In this case, the second equation looks like the easiest.\n\nUsing the second equation, we can isolate $x$ by adding $3y$ from both sides of the equation:\n\n$$\nx=3y-8\n$$\n\nSo, we replace $x$ with $3y-8$ in the first equation and solve for $y:$\n\n$$\n\\begin{aligned}-2x+y & =-4 \\\\ -2(3y-8)+y & =-4 \\\\ -6y+16+y & =-4 \\\\ -5y & =-20 \\\\ y & =4\\end{aligned}\n$$\n\nIf we now substitute $y=4$ into $x=3y-8,$ then we can find the value of $x:$\n\n$$\n\\begin{aligned}x & =3y-8 \\\\ x & =3(4)-8 \\\\ x & =12-8 \\\\ x & =4\\end{aligned}\n$$\n\nTherefore, the solution to the system of equations is $x=4,\\,y=4,$ which can be expressed as $(4,4).$", ":question/answer-fields": [{":answer-field/id": "b19e1ebc-9737-55e3-bf4a-6e84a056104e", ":answer-field/key": "field-1", ":answer-field/type": ":answer-field.type/blank", ":answer-field/choices": [{":answer/id": "8e4e25a5-4054-5ba2-892e-b0367ff037ac", ":answer/type": ":answer.type/math", ":answer/value": "4"}], ":answer-field/correct": [":answer/id", "8e4e25a5-4054-5ba2-892e-b0367ff037ac"]}, {":answer-field/id": "898d6ca6-1643-5b6a-9816-790defcc3824", ":answer-field/key": "field-2", ":answer-field/type": ":answer-field.type/blank", ":answer-field/choices": [{":answer/id": "7eb36f4f-0ccf-59fc-9f92-c0983280688c", ":answer/type": ":answer.type/math", ":answer/value": "4"}], ":answer-field/correct": [":answer/id", "7eb36f4f-0ccf-59fc-9f92-c0983280688c"]}]}, "generation": {"version": "substitution-2275-draft-v2", "database": "math", "basis": 2275, "lineage": "01a12a15-3e0a-75a1-9dac-f8b8c5d5c3f1", "template": "isolate_xy", "target": "forward", "seed": 23, "parameters": {"A": "-2", "B": "1", "C": "-4", "S": "-3", "T": "-8"}, "bank_profile": "source_181175", "origin": "source-parameter replay; missing captured fields independently completed", "serving_eligible": true, "mathematical_fingerprint": "f0bf1d1211126b091a4f225739762d4f55daae3afeffaf6c064950e48d093b53", "content_fingerprint": "31358c87692fee929d2b4e8eb2dc86c7e52af72012daa1ed4997effa302220c0", "domain": "Unique real solution of supplied two-variable linear system; integer equation coefficients; exact rational answers; preisolated, unit-isolation, known-variable, or supplied-context substitution workload", "plot_rating": "none", "math_format": "course-academy-tex-v1"}}}]</script><script type="module" src="browser-player.js"></script></body></html
