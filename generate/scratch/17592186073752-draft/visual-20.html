 & =-\\frac{16}{7}\\end{aligned}\n$$\n\nTherefore, the solution to the system of equations is $x=-\\frac{3}{7},\\,y=-\\frac{16}{7}.$", ":question/answer-fields": [{":answer-field/id": "f7783438-9acf-5af8-a159-e318163d97fa", ":answer-field/key": "field-1", ":answer-field/type": ":answer-field.type/blank", ":answer-field/choices": [{":answer/id": "a082636b-7946-55ff-8426-3f38fb362cb0", ":answer/type": ":answer.type/math", ":answer/value": "-\\frac{3}{7}"}], ":answer-field/correct": [":answer/id", "a082636b-7946-55ff-8426-3f38fb362cb0"]}, {":answer-field/id": "f92baf97-530f-5ef7-8718-557cbf1f2bfa", ":answer-field/key": "field-2", ":answer-field/type": ":answer-field.type/blank", ":answer-field/choices": [{":answer/id": "6c46e4e7-acc5-57d4-a4fc-a6d856063d9e", ":answer/type": ":answer.type/math", ":answer/value": "-\\frac{16}{7}"}], ":answer-field/correct": [":answer/id", "6c46e4e7-acc5-57d4-a4fc-a6d856063d9e"]}]}, "generation": {"version": "substitution-2275-draft-v2", "database": "math", "basis": 2275, "lineage": "01a12a15-3e0a-75a1-9dac-f8b8c5d5c3f1", "template": "unit_pair", "target": "forward", "seed": 0, "parameters": {"A": "-2", "B": "3", "C": "-6", "S": "4", "T": "-4"}, "bank_profile": null, "origin": "authored bank/level or parameter extension", "serving_eligible": true, "mathematical_fingerprint": "40106bc01d67b5337cebdcbacd04d60814498fca98986e822d18bffa2a493930", "content_fingerprint": "70212eff4c89bdc6890a68986342d79041e4e3169c9b196b727af0eef21c1ddb", "domain": "Unique real solution of supplied two-variable linear system; integer equation coefficients; exact rational answers; preisolated, unit-isolation, known-variable, or supplied-context substitution workload", "plot_rating": "none", "math_format": "course-academy-tex-v1"}}}]</script><script type="module" src="browser-player.js"></script></body></html>
