<!doctype html><html><head><meta charset="utf-8"><title>Rendering</title><link rel="stylesheet" href="reference/ui/navigation.css"><link rel="stylesheet" href="reference/ui/learning.css"><style>body{margin:20px;font:16px system-ui;color:#182537;background:white}article{max-width:820px;padding:18px;border:1px solid #ddd;margin:20px auto}h2{font-size:16px}math-field.answer-math{background:#f7f9fc;color:#182537;border:1px solid #b7c3d1;color-scheme:light}img{max-width:100%;height:auto}#summary{display:none}</style><script src="reference/ui/vendor/dompurify/purify.min.js"></script><script src="reference/ui/mathjax-config.js"></script><script defer src="reference/ui/vendor/mathjax/tex-svg.js"></script></head><body><pre id="summary">pending</pre><main></main><script type="application/json" id="data">[{"label": "Variant cake_context 0", "record": {"knowledge_point": {"db_id": 17592186073752, "id": "5e79a91b-c479-53da-9f06-59c082fa4187", "title": "Solving a System of Linear Equations Using Substitution"}, "question": {":question/id": "24ec0316-efd3-52f2-a922-073093a7ba20", ":question/difficulty": ":question.difficulty/easy", ":question/problem": "The pastry shop's total cost and revenue per month (in dollars) from selling cakes can be modeled by the equations $y=386+8n$ and $y=56+19n,$ respectively, where $n$ is the number of cakes sold. \n\nSolve the system below using the substitution method to find the exact number of cakes needed to break even and the revenue made.\n\n$$\n\\left\\{\\begin{aligned}y &=386+8n \\\\ y &=56+19n\\end{aligned}\\right.\n$$\n\nThe pastry shop breaks even when$\\,$\n{{field-1}}\n$\\,$cakes are produced. \n\nThe revenue made when selling this number of cakes is$\\,$\n{{field-2}}\n$\\,$dollars.", ":question/worked-solution": "We will isolate a variable in one of the equations and then substitute it into the other equation. \n\nNotice that $y$ is isolated in the first equation. Therefore, we can replace $y$ with $386+8n$ in the second equation and solve for $n:$\n\n$$\n\\begin{aligned}y & =56+19n \\\\ 386+8n & =56+19n \\\\ 386+8n-56 & =56+19n-56 \\\\ 330+8n & =19n \\\\ 330+8n-8n & =19n-8n \\\\ 330 & =11n \\\\ \\frac{330}{11} & =\\frac{11n}{11} \\\\ 30 & =n \\\\ n & =30\\end{aligned}\n$$\n\nIf we now substitute $n=30$ into $y=56+19n$, then we can find the value of $y:$\n\n$$\n\\begin{aligned}y &=56+19(30)=626\\end{aligned}\n$$\n\nHence, the solution to the system of equations is $n=30$ and $y=626.$\nTherefore, the pastry shop breaks even when $30$ units are produced, and the revenue made when selling this number of units is $626.$", ":question/answer-fields": [{":answer-field/id": "216b0bab-1b93-5599-b0a2-0c18490e8bc8", ":answer-field/key": "field-1", ":answer-field/type": ":answer-field.type/blank", ":answer-field/choices": [{":answer/id": "01b0c92e-2cfe-572e-be03-e2caccedb712", ":answer/type": ":answer.type/math", ":answer/value": "30"}], ":answer-field/correct": [":answer/id", "01b0c92e-2cfe-572e-be03-e2caccedb712"]}, {":answer-field/id": "ff1c5856-32c2-5d80-a1dd-d63e2504677d", ":answer-field/key": "field-2", ":answer-field/type": ":answer-field.type/blank", ":answer-field/choices": [{":answer/id": "16db46ad-f7d7-5c23-8db9-193145f1c6f0", ":answer/type": ":answer.type/math", ":answer/value": "626"}], ":answer-field/correct": [":answer/id", "16db46ad-f7d7-5c23-8db9-193145f1c6f0"]}]}, "generation": {"version": "substitution-2275-draft-v2", "database": "math", "basis": 2275, "lineage": "01a12a15-3e0a-75a1-9dac-f8b8c5d5c3f1", "template": "cake_context", "target": "forward", "seed": 0, "parameters": {"F": "386", "c": "8", "I": "56", "r": "19"}, "bank_profile": null, "origin": "authored bank/level or parameter extension", "serving_eligible": true, "mathematical_fingerprint": "138d9e6f03627ff733f5cb998b0870f24b9183b1fcc4ae3e3e8f6500db3cccae", "content_fingerprint": "41882c71428cbb21ba77ca45087dbb822b155cdb25a5e4bf89579256ce31b84f", "domain": "Unique real solution of supplied two-variable linear system; integer equat
