<!doctype html><html><head><meta charset="utf-8"><title>Rendering</title><link rel="stylesheet" href="reference/ui/navigation.css"><link rel="stylesheet" href="reference/ui/learning.css"><style>body{margin:20px;font:16px system-ui;color:#182537;background:white}article{max-width:820px;padding:18px;border:1px solid #ddd;margin:20px auto}h2{font-size:16px}math-field.answer-math{background:#f7f9fc;color:#182537;border:1px solid #b7c3d1;color-scheme:light}img{max-width:100%;height:auto}#summary{display:none}</style><script src="reference/ui/vendor/dompurify/purify.min.js"></script><script src="reference/ui/mathjax-config.js"></script><script defer src="reference/ui/vendor/mathjax/tex-svg.js"></script></head><body><pre id="summary">pending</pre><main></main><script type="application/json" id="data">[{"label": "Source replay q-166843", "record": {"knowledge_point": {"db_id": 17592186073752, "id": "5e79a91b-c479-53da-9f06-59c082fa4187", "title": "Solving a System of Linear Equations Using Substitution"}, "question": {":question/id": "ffd0f901-f082-559a-93fe-99181e93fb45", ":question/difficulty": ":question.difficulty/easy", ":question/problem": "The pastry shop's total cost and revenue per month (in dollars) from selling cakes can be modeled by the equations $y=1\\,600+5n$ and $y=64+17n,$ respectively, where $n$ is the number of cakes sold. \n\nSolve the system below using the substitution method to find the exact number of cakes needed to break even and the revenue made.\n\n$$\n\\left\\{\\begin{aligned}y &=1\\,600+5n \\\\ y &=64+17n\\end{aligned}\\right.\n$$\n\nThe pastry shop breaks even when$\\,$\n{{field-1}}\n$\\,$cakes are produced. \n\nThe revenue made when selling this number of cakes is$\\,$\n{{field-2}}\n$\\,$dollars.", ":question/worked-solution": "We will isolate a variable in one of the equations and then substitute it into the other equation. \n\nNotice that $y$ is isolated in the first equation. Therefore, we can replace $y$ with $1\\,600+5n$ in the second equation and solve for $n:$\n\n$$\n\\begin{aligned}y & =64+17n \\\\ 1\\,600+5n & =64+17n \\\\ 1\\,600+5n-64 & =64+17n-64 \\\\ 1\\,536+5n & =17n \\\\ 1\\,536+5n-5n & =17n-5n \\\\ 1\\,536 & =12n \\\\ \\frac{1\\,536}{12} & =\\frac{12n}{12} \\\\ 128 & =n \\\\ n & =128\\end{aligned}\n$$\n\nIf we now substitute $n=128$ into $y=64+17n$, then we can find the value of $y:$\n\n$$\n\\begin{aligned}y &=64+17(128)=2\\,240\\end{aligned}\n$$\n\nHence, the solution to the system of equations is $n=128$ and $y=2\\,240.$\nTherefore, the pastry shop breaks even when $128$ units are produced, and the revenue made when selling this number of units is $2\\,240.$", ":question/answer-fields": [{":answer-field/id": "b43b5109-d13d-56c6-9e20-ae4fdf864ab3", ":answer-field/key": "field-1", ":answer-field/type": ":answer-field.type/blank", ":answer-field/choices": [{":answer/id": "3d7274d9-440c-559f-a566-07b186cb907c", ":answer/type": ":answer.type/math", ":answer/value": "128"}], ":answer-field/correct": [":answer/id", "3d7274d9-440c-559f-a566-07b186cb907c"]}, {":answer-field/id": "5d06792c-7a43-5ac7-b604-e6be1d88c76c", ":answer-field/key": "field-2", ":answer-field/type": ":answer-field.type/blank", ":answer-field/choices": [{":answer/id": "98fb35e2-69ea-5fe0-b7dc-5efff36830c7", ":answer/type": ":answer.type/math", ":answer/value": "2240"}], ":answer-field/correct": [":answer/id", "98fb35e2-69ea-5fe0-b7dc-5efff36830c7"]}]}, "generation": {"version": "substitution-2275-draft-v2", "database": "math", "basis": 2275, "lineage": "01a12a15-3e0a-75a1-9dac-f8b8c5d5c3f1", "template": "cake_context", "target": "forward", "seed": 23, "parameters": {"F": "1600", "c": "5", "I": "64", "r": "17"}, "bank_profile": "source_166843", "origin": "source-parameter replay; missing captured fields independently completed", "serving_eligible": true, "mathematical_fingerprint": "90a6bcf9538224e4e4db6b7915764221331d28cb3dc4e6a90887a1e57fc490b4", "content_fingerprint": "c23118b3aaa95d713aabbef1aeba627b8359e9825471cbce023c6
