e system of equations is $x=-2,\\,y=3.$", ":question/answer-fields": [{":answer-field/id": "3b9915b6-680b-5f59-b75b-e92784e17367", ":answer-field/key": "field-1", ":answer-field/type": ":answer-field.type/blank", ":answer-field/choices": [{":answer/id": "2fa8f128-73bd-571b-9c92-794cefa7eea1", ":answer/type": ":answer.type/math", ":answer/value": "-2"}], ":answer-field/correct": [":answer/id", "2fa8f128-73bd-571b-9c92-794cefa7eea1"]}, {":answer-field/id": "cd0e893f-e996-5c7e-953b-ad11eb547735", ":answer-field/key": "field-2", ":answer-field/type": ":answer-field.type/blank", ":answer-field/choices": [{":answer/id": "f5ac8207-df44-50b3-b78a-dc38d44dac6d", ":answer/type": ":answer.type/math", ":answer/value": "3"}], ":answer-field/correct": [":answer/id", "f5ac8207-df44-50b3-b78a-dc38d44dac6d"]}]}, "generation": {"version": "substitution-2275-draft-v2", "database": "math", "basis": 2275, "lineage": "01a12a15-3e0a-75a1-9dac-f8b8c5d5c3f1", "template": "tuple_xy", "target": "forward", "seed": 23, "parameters": {"k": "5", "C": "13", "h": "5"}, "bank_profile": "source_tuple", "origin": "source-parameter replay; missing captured fields independently completed", "serving_eligible": true, "mathematical_fingerprint": "f29212d92b068eccfca65296817d08b769d03a4bbbc3020791cf6032c5cc5020", "content_fingerprint": "5a8bc0ac112fe685578e3b23471a866bbb19b7bc4ca5e3475e5ae862d63704d9", "domain": "Unique real solution of supplied two-variable linear system; integer equation coefficients; exact rational answers; preisolated, unit-isolation, known-variable, or supplied-context substitution workload", "plot_rating": "none", "math_format": "course-academy-tex-v1"}}}]</script><script type="module" src="browser-player.js"></script></body></html>
