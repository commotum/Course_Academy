 value of $b:$\n\n$$\n\\begin{aligned}b & =480-10(-12) \\\\ b & =600\\end{aligned}\n$$\n\nTherefore, the solution to the system of equations is $a=-12,\\,b=600.$", ":question/answer-fields": [{":answer-field/id": "88248dd5-dcc4-56bc-8293-c815433e9c38", ":answer-field/key": "field-1", ":answer-field/type": ":answer-field.type/blank", ":answer-field/choices": [{":answer/id": "5b750f7a-2efc-53e3-a0df-f5f561e3ee70", ":answer/type": ":answer.type/math", ":answer/value": "-12"}], ":answer-field/correct": [":answer/id", "5b750f7a-2efc-53e3-a0df-f5f561e3ee70"]}, {":answer-field/id": "afb96b7d-7975-54e2-b947-829e204fcfcb", ":answer-field/key": "field-2", ":answer-field/type": ":answer-field.type/blank", ":answer-field/choices": [{":answer/id": "6f094dd9-c2bb-5ac3-984a-bbb157f804f0", ":answer/type": ":answer.type/math", ":answer/value": "600"}], ":answer-field/correct": [":answer/id", "6f094dd9-c2bb-5ac3-984a-bbb157f804f0"]}]}, "generation": {"version": "substitution-2275-draft-v2", "database": "math", "basis": 2275, "lineage": "01a12a15-3e0a-75a1-9dac-f8b8c5d5c3f1", "template": "coefficient_b_first", "target": "forward", "seed": 23, "parameters": {"C": "480", "k": "10", "m": "20", "n": "400", "R": "7200"}, "bank_profile": "source_context_b", "origin": "source-parameter replay; missing captured fields independently completed", "serving_eligible": false, "mathematical_fingerprint": "1f65fb78fbb1e922c71ef5b618c94f31dc475ade1d7368a800f5d87c1fa1251d", "content_fingerprint": "768fdc9e56ef7ebaca57b4c29d20cf5eaddcca56870aaef132bf937842cde065", "domain": "Unique real solution of supplied two-variable linear system; integer equation coefficients; exact rational answers; preisolated, unit-isolation, known-variable, or supplied-context substitution workload", "plot_rating": "none", "math_format": "course-academy-tex-v1"}}}]</script><script type="module" src="browser-player.js"></script></body></html>
