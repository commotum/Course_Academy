 the value of $b:$\n\n$$\n\\begin{aligned}b & =180-15(-9) \\\\ b & =315\\end{aligned}\n$$\n\nTherefore, the solution to the system of equations is $a=-9,\\,b=315.$", ":question/answer-fields": [{":answer-field/id": "0af1552d-0375-55a3-89af-798e67ee2e8b", ":answer-field/key": "field-1", ":answer-field/type": ":answer-field.type/blank", ":answer-field/choices": [{":answer/id": "d1359401-b9f7-5351-ab69-c82607555f1a", ":answer/type": ":answer.type/math", ":answer/value": "-9"}], ":answer-field/correct": [":answer/id", "d1359401-b9f7-5351-ab69-c82607555f1a"]}, {":answer-field/id": "36fb9f54-c247-582e-9d2f-1eea7ffa3741", ":answer-field/key": "field-2", ":answer-field/type": ":answer-field.type/blank", ":answer-field/choices": [{":answer/id": "f2c22500-9066-5932-99b0-2d22c41b60d1", ":answer/type": ":answer.type/math", ":answer/value": "315"}], ":answer-field/correct": [":answer/id", "f2c22500-9066-5932-99b0-2d22c41b60d1"]}]}, "generation": {"version": "substitution-2275-draft-v2", "database": "math", "basis": 2275, "lineage": "01a12a15-3e0a-75a1-9dac-f8b8c5d5c3f1", "template": "coefficient_b_first", "target": "forward", "seed": 0, "parameters": {"C": "180", "k": "15", "m": "3", "n": "95", "R": "90"}, "bank_profile": null, "origin": "authored bank/level or parameter extension", "serving_eligible": true, "mathematical_fingerprint": "a6057d9671e02469f8564c9adc133a6fa295bdae3135de89b2c7cd59da735203", "content_fingerprint": "4579f41843afa59c736a014f428490e19dee1fc0291be3d646ef683ae6b5e855", "domain": "Unique real solution of supplied two-variable linear system; integer equation coefficients; exact rational answers; preisolated, unit-isolation, known-variable, or supplied-context substitution workload", "plot_rating": "none", "math_format": "course-academy-tex-v1"}}}]</script><script type="module" src="browser-player.js"></script></body></html>
