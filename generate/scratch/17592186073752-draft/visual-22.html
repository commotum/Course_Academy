4}\\end{aligned}\n$$\n\nTherefore, the solution to the system of equations is $u=\\frac{15}{4},\\,v=-\\frac{17}{4},$ which can be expressed as $(\\frac{15}{4},-\\frac{17}{4}).$", ":question/answer-fields": [{":answer-field/id": "0d73e632-7c7e-5265-a6f8-862b01c64cb6", ":answer-field/key": "field-1", ":answer-field/type": ":answer-field.type/blank", ":answer-field/choices": [{":answer/id": "09aa7ea4-53f8-578b-8667-ccd5e65f30b0", ":answer/type": ":answer.type/math", ":answer/value": "\\frac{15}{4}"}], ":answer-field/correct": [":answer/id", "09aa7ea4-53f8-578b-8667-ccd5e65f30b0"]}, {":answer-field/id": "88a7b4a9-76cd-59cc-8ea8-efac62ecb5a8", ":answer-field/key": "field-2", ":answer-field/type": ":answer-field.type/blank", ":answer-field/choices": [{":answer/id": "d3a495e3-2fe8-57a2-a334-6aa3d428de15", ":answer/type": ":answer.type/math", ":answer/value": "-\\frac{17}{4}"}], ":answer-field/correct": [":answer/id", "d3a495e3-2fe8-57a2-a334-6aa3d428de15"]}]}, "generation": {"version": "substitution-2275-draft-v2", "database": "math", "basis": 2275, "lineage": "01a12a15-3e0a-75a1-9dac-f8b8c5d5c3f1", "template": "preisolated_uv", "target": "forward", "seed": 0, "parameters": {"A": "3", "B": "1", "C": "7", "S": "1", "T": "8"}, "bank_profile": null, "origin": "authored bank/level or parameter extension", "serving_eligible": true, "mathematical_fingerprint": "5675a4de2c224ea0eeb5cbe3d9824bd1e99006971c244092855bbb3143425b46", "content_fingerprint": "593df704d3fbb802ae128e3edfaa57168718422c0525114798c2d08094647906", "domain": "Unique real solution of supplied two-variable linear system; integer equation coefficients; exact rational answers; preisolated, unit-isolation, known-variable, or supplied-context substitution workload", "plot_rating": "none", "math_format": "course-academy-tex-v1"}}}]</script><script type="module" src="browser-player.js"></script></body></html>
