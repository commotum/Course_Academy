<!doctype html><html data-theme="light"><head><meta charset="utf-8"><title>Rendering</title><link rel="stylesheet" href="reference/ui/navigation.css"><link rel="stylesheet" href="reference/ui/learning.css"><link rel="stylesheet" href="reference/ui/activity.css"><style>body{display:block;margin:24px;font:18px system-ui;background:white;color:#172033}article{max-width:1120px;margin:auto;padding:20px;border:1px solid #ddd}h1{font-size:21px}h2{font-size:18px;margin-top:24px}#summary{font-size:10px;max-width:1120px;white-space:pre-wrap;overflow-wrap:anywhere;margin:auto}mjx-container[display="true"]{overflow-x:auto}</style><script src="reference/ui/vendor/dompurify/purify.min.js"></script><script src="reference/ui/mathjax-config.js"></script><script defer src="reference/ui/vendor/mathjax/tex-svg.js"></script></head><body><pre id="summary">pending</pre><main><article></article></main><script type="application/json" id="data">{"knowledge_point": {"db_id": 17592186100869, "id": "b494140f-206a-5317-8079-ff719a253140", "title": "Determining Whether Two Matrices Are Conformable for Multiplication"}, "question": {":question/id": "25ed1e99-e63f-5e51-91c1-23cc333b3970", ":question/difficulty": ":question.difficulty/easy", ":question/problem": "$$\nD=\\begin{bmatrix}-2 & 3 \\\\ 1 & 0\\end{bmatrix},\\,E=\\begin{bmatrix}2 & 0 \\\\ -3 & 5 \\\\ 2 & 1\\end{bmatrix},\\,F=\\begin{bmatrix}3 & 1 & 4 \\\\ -2 & 3 & 2\\end{bmatrix}\n$$\n\nWhich of the following statements are true regarding the matrices $D,E,$ and $F?$\n\nSelect all that apply.\n\n- **I.** The product $ED$ is well defined\n- **II.** The product $FD$ is well defined\n- **III.** The product $EF$ is well defined", ":question/worked-solution": "Notice that $D$ is a $2\\times 2$ matrix, $E$ is a $3\\times 2$ matrix, and $F$ is a $2\\times 3$ matrix.\n\nThere are $2$ columns in $E$ and $2$ rows in $D.$ Since the number of columns in $E$ equals the number of rows in $D,$ the matrices $E$ and $D$ are conformable for multiplication:\n\n$$\n{E}_{3\\times \\boxed{\\text{2}}}{\\times }_{✓}{D}_{\\boxed{\\text{2}}\\times 2}=\\text{well defined}\n$$\n\nOn the other hand, there are $3$ columns in $F$ and $2$ rows in $D.$ Since the number of columns in $F$ does **not** equal the number of rows in $D,$ the matrices $F$ and $D$ are **not** conformable for multiplication:\n\n$$\n{F}_{2\\times 3}{\\times }_{\\ne }{D}_{2\\times 2}=\\text{undefined}\n$$\n\nFinally, there are $2$ columns in $E$ and $2$ rows in $F.$ Since the number of columns in $E$ equals the number of rows in $F,$ the matrices $E$ and $F$ are conformable for multiplication:\n\n$$\n{E}_{3\\times \\boxed{\\text{2}}}{\\times }_{✓}{F}_{\\boxed{\\text{2}}\\times 3}=\\text{well defined}\n$$\n\nTherefore, statements I and III are true, while statement II is false.", ":question/answer-fields": [{":answer-field/id": "bad4049a-dd9f-5e0d-bb41-778044e986d6", ":answer-field/key": "I", ":answer-field/type": ":answer-field.type/checkbox", ":answer-field/choices": [{":answer/id": "f7745b57-0153-5d33-bd60-82386e004932", ":answer/type": ":answer.type/text", ":answer/value": "false"}, {":answer/id": "fd841b88-4356-5a6d-a3a6-a9ecb17e198a", ":answer/type": ":answer.type/text", ":answer/value": "true"}], ":answer-field/correct": [":answer/id", "fd841b88-4356-5a6d-a3a6-a9ecb17e198a"]}, {":answer-field/id": "15c783ab-2523-5d3d-bf18-45672ab7fa16", ":answer-field/key": "II", ":answer-field/type": ":answer-field.type/checkbox", ":answer-field/choices": [{":answer/id": "440e2cf4-16fe-50c1-825d-46b404c3a73c", ":answer/type": ":answer.type/text", ":answer/value": "false"}, {":answer/id": "e61cd0db-63be-5a62-8457-265da3ca19ba", ":answer/type": ":answer.type/text", ":answer/value": "true"}], ":answer-field/correct": [":answer/id", "440e2cf4-16fe-50c1-825d-46b404c3a73c"]}, {":answer-field/id": "10b8fb84-5bda-5104-9622-a4d67b306b0c", ":answer-field/key": "III", ":answer-field/type": ":answer-field.type/checkbox", ":answer-field/choices": [{":answer/id": "3547a9c8-b278-57a7-a
