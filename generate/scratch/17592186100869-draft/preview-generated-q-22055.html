 are **not** conformable for multiplication:\n\n$$\n{X}_{2\\times 3}{\\times }_{\\ne }{Y}_{2\\times 3}=\\text{undefined}\n$$\n\nOn the other hand, there are $3$ columns in $X$ and $2$ rows in $Z.$ Since the number of columns in $X$ does **not** equal the number of rows in $Z,$ the matrices $X$ and $Z$ are **not** conformable for multiplication:\n\n$$\n{X}_{2\\times 3}{\\times }_{\\ne }{Z}_{2\\times 4}=\\text{undefined}\n$$\n\nFinally, there are $4$ columns in $Z$ and $2$ rows in $Y.$ Since the number of columns in $Z$ does **not** equal the number of rows in $Y,$ the matrices $Z$ and $Y$ are **not** conformable for multiplication:\n\n$$\n{Z}_{2\\times 4}{\\times }_{\\ne }{Y}_{2\\times 3}=\\text{undefined}\n$$\n\nWe conclude that all three statements are false.", ":question/answer-fields": [{":answer-field/id": "408c6fb5-e09a-50d6-8a7b-20e967cc34b9", ":answer-field/key": "I", ":answer-field/type": ":answer-field.type/checkbox", ":answer-field/choices": [{":answer/id": "e0af50fd-d3bb-5fcf-94ca-d3de9fb45ea2", ":answer/type": ":answer.type/text", ":answer/value": "false"}, {":answer/id": "b36ce2ad-d148-5cba-a085-96bf8c7920a4", ":answer/type": ":answer.type/text", ":answer/value": "true"}], ":answer-field/correct": [":answer/id", "e0af50fd-d3bb-5fcf-94ca-d3de9fb45ea2"]}, {":answer-field/id": "b1e18b0e-8bc9-513b-8c5b-2e795cfe6c78", ":answer-field/key": "II", ":answer-field/type": ":answer-field.type/checkbox", ":answer-field/choices": [{":answer/id": "926fb4f0-2647-5d01-9f7d-d777cc362923", ":answer/type": ":answer.type/text", ":answer/value": "false"}, {":answer/id": "a8ccd9e9-fd17-5388-ae5f-dcd3b3406afc", ":answer/type": ":answer.type/text", ":answer/value": "true"}], ":answer-field/correct": [":answer/id", "926fb4f0-2647-5d01-9f7d-d777cc362923"]}, {":answer-field/id": "75ade036-f253-5e5d-a905-3a1874985ff8", ":answer-field/key": "III", ":answer-field/type": ":answer-field.type/checkbox", ":answer-field/choices": [{":answer/id": "f477e615-c9e4-552e-bbe7-6ea4d99bfff6", ":a
