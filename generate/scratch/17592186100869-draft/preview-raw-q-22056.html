formable for multiplication:\n\n$$\n{S}_{2\\times \\boxed{\\text{4}}}{\\times }_{✓}{R}_{\\boxed{\\text{4}}\\times 2}=\\text{well defined}\n$$\n\nOn the other hand, there are $2$ columns in $R$ and $2$ rows in $S.$ Since the number of columns in $R$ equals the number of rows in $S,$ the matrices $R$ and $S$ are conformable for multiplication:\n\n$$\n{R}_{4\\times \\boxed{\\text{2}}}{\\times }_{✓}{S}_{\\boxed{\\text{2}}\\times 4}=\\text{well defined}\n$$\n\nFinally, there are $4$ columns in $S$ and $3$ rows in $T.$ Since the number of columns in $S$ does **not** equal the number of rows in $T,$ the matrices $S$ and $T$ are **not** conformable for multiplication:\n\n$$\n{S}_{2\\times 4}{\\times }_{\\ne }{T}_{3\\times 2}=\\text{undefined}\n$$\n\nTherefore, statements I and II are true, while statement III is false.", ":question/answer-fields": [{":answer-field/id": "7f31de81-6b1c-539b-bcfb-38b61fac56d3", ":answer-field/key": "I", ":answer-field/type": ":answer-field.type/checkbox", ":answer-field/choices": [{":answer/id": "2a7114c3-0ea8-5096-9707-f8a759443c50", ":answer/type": ":answer.type/text", ":answer/value": "false"}, {":answer/id": "cf64cb90-f6a9-5118-a849-4f87b86e17f3", ":answer/type": ":answer.type/text", ":answer/value": "true"}], ":answer-field/correct": [":answer/id", "cf64cb90-f6a9-5118-a849-4f87b86e17f3"]}, {":answer-field/id": "00eb3c77-770d-5499-8792-4485f199d9f1", ":answer-field/key": "II", ":answer-field/type": ":answer-field.type/checkbox", ":answer-field/choices": [{":answer/id": "fc219f17-330f-5f4b-98ce-f921f7402483", ":answer/type": ":answer.type/text", ":answer/value": "false"}, {":answer/id": "90e7204c-3695-539b-b748-b64012af4803", ":answer/type": ":answer.type/text", ":answer/value": "true"}], ":answer-field/correct": [":answer/id", "90e7204c-3695-539b-b748-b64012af4803"]}, {":answer-field/id": "6cfae031-b245-5a85-871a-9768fee0e4ae", ":answer-field/key": "III", ":answer-field/type": ":answer-field.type/checkbox", ":answer-field/choices": [{":ans
