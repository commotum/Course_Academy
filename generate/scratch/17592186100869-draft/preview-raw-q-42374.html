<!doctype html><html data-theme="light"><head><meta charset="utf-8"><title>Rendering</title><link rel="stylesheet" href="reference/ui/navigation.css"><link rel="stylesheet" href="reference/ui/learning.css"><link rel="stylesheet" href="reference/ui/activity.css"><style>body{display:block;margin:24px;font:18px system-ui;background:white;color:#172033}article{max-width:1120px;margin:auto;padding:20px;border:1px solid #ddd}h1{font-size:21px}h2{font-size:18px;margin-top:24px}#summary{font-size:10px;max-width:1120px;white-space:pre-wrap;overflow-wrap:anywhere;margin:auto}mjx-container[display="true"]{overflow-x:auto}</style><script src="reference/ui/vendor/dompurify/purify.min.js"></script><script src="reference/ui/mathjax-config.js"></script><script defer src="reference/ui/vendor/mathjax/tex-svg.js"></script></head><body><pre id="summary">pending</pre><main><article></article></main><script type="application/json" id="data">{"knowledge_point": {"db_id": 17592186100869, "id": "b494140f-206a-5317-8079-ff719a253140", "title": "Determining Whether Two Matrices Are Conformable for Multiplication"}, "question": {":question/id": "d3678c47-edff-5834-ad39-08901a3a311f", ":question/difficulty": ":question.difficulty/easy", ":question/problem": "$$\nA=\\begin{bmatrix}1 & -1 \\\\ 1 & 2 \\\\ 5 & 3 \\\\ -2 & 1\\end{bmatrix},\\,B=\\begin{bmatrix}5 & -2 & 1 & 7 \\\\ -1 & 3 & 3 & 0\\end{bmatrix},\\,C=\\begin{bmatrix}2 & 5 \\\\ -0 & 6\\end{bmatrix},\n$$\n\nWhich of the following statement are true regarding the matrices $A,B,$ and $C?$\n\nI. The product $AB$ is well defined\nII. The product $BA$ is well defined\nIII. The product $AC$ is well defined\n\nSelect all that apply.", ":question/worked-solution": "Notice that $A$ is a $4\\times 2$ matrix, $B$ is a $2\\times 4$ matrix, and $C$ is a $2\\times 2$ matrix.\n\nThere are $2$ columns in $A$ and $2$ rows in $B.$ Since the number of columns in $A$ equals the number of rows in $B,$ the matrices $A$ and $B$ are conformable for multiplication:\n\n$$\n{A}_{4\\times \\boxed{\\text{2}}}{\\times }_{✓}{B}_{\\boxed{\\text{2}}\\times 4}=\\text{well defined}\n$$\n\nOn the other hand, there are $4$ columns in $B$ and $4$ rows in $A.$ Since the number of columns in $B$ equals the number of rows in $A,$ the matrices $B$ and $A$ are conformable for multiplication:\n\n$$\n{B}_{2\\times \\boxed{\\text{4}}}{\\times }_{✓}{A}_{\\boxed{\\text{4}}\\times 2}=\\text{well defined}\n$$\n\nFinally, there are $2$ columns in $A$ and $2$ rows in $C.$ Since the number of columns in $A$ equals the number of rows in $C,$ the matrices $A$ and $C$ are conformable for multiplication:\n\n$$\n{A}_{4\\times \\boxed{\\text{2}}}{\\times }_{✓}{C}_{\\boxed{\\text{2}}\\times 2}=\\text{well defined}\n$$\n\nWe conclude that all three statements are true.", ":question/answer-fields": [{":answer-field/id": "201c480b-5bbe-5ed3-bdc5-b554430f9ebc", ":answer-field/key": "I", ":answer-field/type": ":answer-field.type/checkbox", ":answer-field/choices": [{":answer/id": "d4325e5c-74a5-5e07-a4cf-dca4ccf9ea91", ":answer/type": ":answer.type/text", ":answer/value": "false"}, {":answer/id": "8850dd22-abda-574c-a595-538bba9ef4cd", ":answer/type": ":answer.type/text", ":answer/value": "true"}], ":answer-field/correct": [":answer/id", "8850dd22-abda-574c-a595-538bba9ef4cd"]}, {":answer-field/id": "3af80adc-4d5c-57c0-9752-ea029fb304cf", ":answer-field/key": "II", ":answer-field/type": ":answer-field.type/checkbox", ":answer-field/choices": [{":answer/id": "f7501d01-9971-516b-9d2a-96372e73e832", ":answer/type": ":answer.type/text", ":answer/value": "false"}, {":answer/id": "0189089d-1b55-5a69-b77f-d4d044c40521", ":answer/type": ":answer.type/text", ":answer/value": "true"}], ":answer-field/correct": [":answer/id", "0189089d-1b55-5a69-b77f-d4d044c40521"]}, {":answer-field/id": "f81aacd6-4fff-5455-9210-fe721d5d54c2", ":answer-field/key": "III", ":answer-field/type": ":answer-field.type/checkbox", ":answer-field/choices": [{":answer/id": "4a894a00-ff64-5cc9-920e-14a
