plication:\n\n$$\n{O}_{4\\times 5}{\\times }_{\\ne }{R}_{1\\times 2}=\\text{undefined}\n$$\n\nOn the other hand, there are $2$ columns in $R$ and $2$ rows in $P.$ Since the number of columns in $R$ equals the number of rows in $P,$ the matrices $R$ and $P$ are conformable for multiplication:\n\n$$\n{R}_{1\\times \\boxed{\\text{2}}}{\\times }_{✓}{P}_{\\boxed{\\text{2}}\\times 2}=\\text{well defined}\n$$\n\nFinally, there are $2$ columns in $P$ and $1$ row in $R.$ Since the number of columns in $P$ does **not** equal the number of rows in $R,$ the matrices $P$ and $R$ are **not** conformable for multiplication:\n\n$$\n{P}_{2\\times 2}{\\times }_{\\ne }{R}_{1\\times 2}=\\text{undefined}\n$$\n\nThe product $RP$ is well defined. The products $OR$ and $PR$ are undefined.", ":question/answer-fields": [{":answer-field/id": "141208f2-9586-5f85-a5ed-69648c74d729", ":answer-field/key": "The product $OR$ is well defined.", ":answer-field/type": ":answer-field.type/checkbox", ":answer-field/choices": [{":answer/id": "c8e2a1b7-4f01-5d59-aab8-37a28b618f95", ":answer/type": ":answer.type/text", ":answer/value": "false"}, {":answer/id": "d3fdf98b-2803-5dd6-9218-2202d9811b9c", ":answer/type": ":answer.type/text", ":answer/value": "true"}], ":answer-field/correct": [":answer/id", "c8e2a1b7-4f01-5d59-aab8-37a28b618f95"]}, {":answer-field/id": "b107a241-484d-5028-8b59-3882d77b1f25", ":answer-field/key": "The product $RP$ is well defined.", ":answer-field/type": ":answer-field.type/checkbox", ":answer-field/choices": [{":answer/id": "5a6978f1-bb09-5af1-b367-52327b157e67", ":answer/type": ":answer.type/text", ":answer/value": "false"}, {":answer/id": "f9d577e0-97f1-5e53-a279-6e42cc78c851", ":answer/type": ":answer.type/text", ":answer/value": "true"}], ":answer-field/correct": [":answer/id", "f9d577e0-97f1-5e53-a279-6e42cc78c851"]}, {":answer-field/id": "d9af2678-0c13-5d97-aa36-f1dc778bc3d3", ":answer-field/key": "The product $PR$ is well defined.", ":answer-field/type": ":answer-field.ty
