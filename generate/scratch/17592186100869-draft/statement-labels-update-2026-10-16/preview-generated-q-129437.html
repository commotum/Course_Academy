_{\\ne }{R}_{1\\times 3}=\\text{undefined}\n$$\n\nOn the other hand, there are $3$ columns in $R$ and $3$ rows in $P.$ Since the number of columns in $R$ equals the number of rows in $P,$ the matrices $R$ and $P$ are conformable for multiplication:\n\n$$\n{R}_{1\\times \\boxed{\\text{3}}}{\\times }_{✓}{P}_{\\boxed{\\text{3}}\\times 3}=\\text{well defined}\n$$\n\nFinally, there are $5$ columns in $S$ and $3$ rows in $P.$ Since the number of columns in $S$ does **not** equal the number of rows in $P,$ the matrices $S$ and $P$ are **not** conformable for multiplication:\n\n$$\n{S}_{1\\times 5}{\\times }_{\\ne }{P}_{3\\times 3}=\\text{undefined}\n$$\n\nThe product $RP$ is well defined. The products $PR$ and $SP$ are undefined.", ":question/answer-fields": [{":answer-field/id": "eead5896-9980-5a1a-b85d-25d70e9e7df9", ":answer-field/key": "The product $PR$ is well defined.", ":answer-field/type": ":answer-field.type/checkbox", ":answer-field/choices": [{":answer/id": "ae5891e7-54dd-5c11-9f2f-e205f04f31ab", ":answer/type": ":answer.type/text", ":answer/value": "false"}, {":answer/id": "cb657348-3086-5c90-910b-3dd0d7e740ee", ":answer/type": ":answer.type/text", ":answer/value": "true"}], ":answer-field/correct": [":answer/id", "ae5891e7-54dd-5c11-9f2f-e205f04f31ab"]}, {":answer-field/id": "01691d0c-76eb-5a05-a917-265cfb4305ec", ":answer-field/key": "The product $RP$ is well defined.", ":answer-field/type": ":answer-field.type/checkbox", ":answer-field/choices": [{":answer/id": "ca4a5975-9dac-58b1-af6e-e1a18c5c489e", ":answer/type": ":answer.type/text", ":answer/value": "false"}, {":answer/id": "e1f630ec-bb2d-573f-b3a3-29fa5bd0725b", ":answer/type": ":answer.type/text", ":answer/value": "true"}], ":answer-field/correct": [":answer/id", "e1f630ec-bb2d-573f-b3a3-29fa5bd0725b"]}, {":answer-field/id": "c4aa521d-28c4-5131-af0a-b87558d79f84", ":answer-field/key": "The product $SP$ is well defined.", ":answer-field/type": ":answer-field.type/checkbox", ":answer-field/choices": [{":
