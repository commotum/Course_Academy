<!doctype html><html data-theme="light"><head><meta charset="utf-8"><title>Rendering</title><link rel="stylesheet" href="reference/ui/navigation.css"><link rel="stylesheet" href="reference/ui/learning.css"><link rel="stylesheet" href="reference/ui/activity.css"><style>body{display:block;margin:24px;font:18px system-ui;background:white;color:#172033}article{max-width:1120px;margin:auto;padding:20px;border:1px solid #ddd}h1{font-size:21px}h2{font-size:18px;margin-top:24px}#summary{font-size:10px;max-width:1120px;white-space:pre-wrap;overflow-wrap:anywhere;margin:auto}mjx-container[display="true"]{overflow-x:auto}</style><script src="reference/ui/vendor/dompurify/purify.min.js"></script><script src="reference/ui/mathjax-config.js"></script><script defer src="reference/ui/vendor/mathjax/tex-svg.js"></script></head><body><pre id="summary">pending</pre><main><article></article></main><script type="application/json" id="data">{"knowledge_point": {"db_id": 17592186100869, "id": "b494140f-206a-5317-8079-ff719a253140", "title": "Determining Whether Two Matrices Are Conformable for Multiplication"}, "question": {":question/id": "3ccc577f-3ee2-580d-8738-48e091dc115f", ":question/difficulty": ":question.difficulty/easy", ":question/problem": "<div class=\"matrix-operands\">\n<div>$R=\\begin{bmatrix}-2 & 8 \\\\ 5 & 7 \\\\ 4 & -3 \\\\ 9 & -7\\end{bmatrix}$</div>\n<div>$S=\\begin{bmatrix}-6 & -9 \\\\ 3 & 1 \\\\ -3 & -3 \\\\ 1 & 3\\end{bmatrix}$</div>\n<div>$T=\\begin{bmatrix}2 & -2 & -3 & -3 \\\\ 4 & 9 & 8 & -8\\end{bmatrix}$</div>\n</div>\n\nWhich of the following statements are true regarding the matrices $R,S,$ and $T?$\n\nSelect all that apply.", ":question/worked-solution": "Notice that $R$ is a $4\\times 2$ matrix, $S$ is a $4\\times 2$ matrix, and $T$ is a $2\\times 4$ matrix.\n\nThere are $2$ columns in $R$ and $4$ rows in $S.$ Since the number of columns in $R$ does **not** equal the number of rows in $S,$ the matrices $R$ and $S$ are **not** conformable for multiplication:\n\n$$\n{R}_{4\\times 2}{\\times }_{\\ne }{S}_{4\\times 2}=\\text{undefined}\n$$\n\nOn the other hand, there are $4$ columns in $T$ and $4$ rows in $S.$ Since the number of columns in $T$ equals the number of rows in $S,$ the matrices $T$ and $S$ are conformable for multiplication:\n\n$$\n{T}_{2\\times \\boxed{\\text{4}}}{\\times }_{✓}{S}_{\\boxed{\\text{4}}\\times 2}=\\text{well defined}\n$$\n\nFinally, there are $2$ columns in $R$ and $2$ rows in $T.$ Since the number of columns in $R$ equals the number of rows in $T,$ the matrices $R$ and $T$ are conformable for multiplication:\n\n$$\n{R}_{4\\times \\boxed{\\text{2}}}{\\times }_{✓}{T}_{\\boxed{\\text{2}}\\times 4}=\\text{well defined}\n$$\n\nThe products $TS$ and $RT$ are well defined. The product $RS$ is undefined.", ":question/answer-fields": [{":answer-field/id": "1244baa0-9e7c-5903-a8ee-67388856bb58", ":answer-field/key": "The product $RS$ is well defined.", ":answer-field/type": ":answer-field.type/checkbox", ":answer-field/choices": [{":answer/id": "be0aed07-8b91-52a2-b5d1-ba8f59243d1c", ":answer/type": ":answer.type/text", ":answer/value": "false"}, {":answer/id": "b9b0c0ec-c66a-5652-8b41-492403ed382d", ":answer/type": ":answer.type/text", ":answer/value": "true"}], ":answer-field/correct": [":answer/id", "be0aed07-8b91-52a2-b5d1-ba8f59243d1c"]}, {":answer-field/id": "85879aaa-a1dd-505c-9b7c-d9a7aaf70770", ":answer-field/key": "The product $TS$ is well defined.", ":answer-field/type": ":answer-field.type/checkbox", ":answer-field/choices": [{":answer/id": "b6997e81-91a9-5a63-9f70-d2bb4d7a1397", ":answer/type": ":answer.type/text", ":answer/value": "false"}, {":answer/id": "33654014-5e09-5f2a-9eca-3ea26f9cbeec", ":answer/type": ":answer.type/text", ":answer/value": "true"}], ":answer-field/correct": [":answer/id", "33654014-5e09-5f2a-9eca-3ea26f9cbeec"]}, {":answer-field/id": "2f1daa88-40ec-50ea-8677-8c477f712a80", ":answer-field/key": "The product $RT$ is well defined.", ":answer-field/type": ":answer-fie
