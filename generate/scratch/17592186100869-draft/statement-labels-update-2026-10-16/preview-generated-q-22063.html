imes }_{✓}{C}_{\\boxed{\\text{2}}\\times 1}=\\text{well defined}\n$$\n\nOn the other hand, there is $1$ column in $C$ and $2$ rows in $B.$ Since the number of columns in $C$ does **not** equal the number of rows in $B,$ the matrices $C$ and $B$ are **not** conformable for multiplication:\n\n$$\n{C}_{2\\times 1}{\\times }_{\\ne }{B}_{2\\times 4}=\\text{undefined}\n$$\n\nFinally, there are $4$ columns in $B$ and $2$ rows in $C.$ Since the number of columns in $B$ does **not** equal the number of rows in $C,$ the matrices $B$ and $C$ are **not** conformable for multiplication:\n\n$$\n{B}_{2\\times 4}{\\times }_{\\ne }{C}_{2\\times 1}=\\text{undefined}\n$$\n\nThe product $AC$ is well defined. The products $CB$ and $BC$ are undefined.", ":question/answer-fields": [{":answer-field/id": "a765d63a-a45c-5ce1-85b1-8d788974cc59", ":answer-field/key": "The product $AC$ is well defined.", ":answer-field/type": ":answer-field.type/checkbox", ":answer-field/choices": [{":answer/id": "b6872b8c-bf0f-5a94-9051-d7f16c4689a6", ":answer/type": ":answer.type/text", ":answer/value": "false"}, {":answer/id": "b4964fba-022d-52b7-8ce2-fb7fffd8edb2", ":answer/type": ":answer.type/text", ":answer/value": "true"}], ":answer-field/correct": [":answer/id", "b4964fba-022d-52b7-8ce2-fb7fffd8edb2"]}, {":answer-field/id": "3b206202-8c46-5fa0-a07f-124cc50f35cd", ":answer-field/key": "The product $CB$ is well defined.", ":answer-field/type": ":answer-field.type/checkbox", ":answer-field/choices": [{":answer/id": "36bc4abb-9fd3-5505-8ca2-4e326254bc77", ":answer/type": ":answer.type/text", ":answer/value": "false"}, {":answer/id": "30ad11c4-bdc5-566c-8bd9-aed4e65ac106", ":answer/type": ":answer.type/text", ":answer/value": "true"}], ":answer-field/correct": [":answer/id", "36bc4abb-9fd3-5505-8ca2-4e326254bc77"]}, {":answer-field/id": "fe9f693b-8abd-5080-9388-8ddc0dca8d56", ":answer-field/key": "The product $BC$ is well defined.", ":answer-field/type": ":answer-field.type/checkbox", ":answer-field/choices
