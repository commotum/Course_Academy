<!doctype html><html data-theme="light"><head><meta charset="utf-8"><title>Rendering</title><link rel="stylesheet" href="reference/ui/navigation.css"><link rel="stylesheet" href="reference/ui/learning.css"><link rel="stylesheet" href="reference/ui/activity.css"><style>body{display:block;margin:24px;font:18px system-ui;background:white;color:#172033}article{max-width:1120px;margin:auto;padding:20px;border:1px solid #ddd}h1{font-size:21px}h2{font-size:18px;margin-top:24px}#summary{font-size:10px;max-width:1120px;white-space:pre-wrap;overflow-wrap:anywhere;margin:auto}mjx-container[display="true"]{overflow-x:auto}</style><script src="reference/ui/vendor/dompurify/purify.min.js"></script><script src="reference/ui/mathjax-config.js"></script><script defer src="reference/ui/vendor/mathjax/tex-svg.js"></script></head><body><pre id="summary">pending</pre><main><article></article></main><script type="application/json" id="data">{"knowledge_point": {"db_id": 17592186100869, "id": "b494140f-206a-5317-8079-ff719a253140", "title": "Determining Whether Two Matrices Are Conformable for Multiplication"}, "question": {":question/id": "91bda501-3d84-50ff-8a15-fd722e32e4ae", ":question/difficulty": ":question.difficulty/easy", ":question/problem": "<div class=\"matrix-operands\">\n<div>$L=\\begin{bmatrix}-2 & 8 \\\\ 5 & 7 \\\\ 4 & -3 \\\\ 9 & -7\\end{bmatrix}$</div>\n<div>$M=\\begin{bmatrix}-6 & -9 \\\\ 3 & 1 \\\\ -3 & -3 \\\\ 1 & 3\\end{bmatrix}$</div>\n<div>$N=\\begin{bmatrix}2 & -2 & -3 & -3 \\\\ 4 & 9 & 8 & -8\\end{bmatrix}$</div>\n</div>\n\nWhich of the following statements are true regarding the matrices $L,M,$ and $N?$\n\nSelect all that apply.", ":question/worked-solution": "Notice that $L$ is a $4\\times 2$ matrix, $M$ is a $4\\times 2$ matrix, and $N$ is a $2\\times 4$ matrix.\n\nThere are $2$ columns in $L$ and $4$ rows in $M.$ Since the number of columns in $L$ does **not** equal the number of rows in $M,$ the matrices $L$ and $M$ are **not** conformable for multiplication:\n\n$$\n{L}_{4\\times 2}{\\times }_{\\ne }{M}_{4\\times 2}=\\text{undefined}\n$$\n\nOn the other hand, there are $4$ columns in $N$ and $4$ rows in $M.$ Since the number of columns in $N$ equals the number of rows in $M,$ the matrices $N$ and $M$ are conformable for multiplication:\n\n$$\n{N}_{2\\times \\boxed{\\text{4}}}{\\times }_{✓}{M}_{\\boxed{\\text{4}}\\times 2}=\\text{well defined}\n$$\n\nFinally, there are $2$ columns in $L$ and $2$ rows in $N.$ Since the number of columns in $L$ equals the number of rows in $N,$ the matrices $L$ and $N$ are conformable for multiplication:\n\n$$\n{L}_{4\\times \\boxed{\\text{2}}}{\\times }_{✓}{N}_{\\boxed{\\text{2}}\\times 4}=\\text{well defined}\n$$\n\nThe products $NM$ and $LN$ are well defined. The product $LM$ is undefined.", ":question/answer-fields": [{":answer-field/id": "26669745-9840-5cdf-943e-89d430b9f3e8", ":answer-field/key": "The product $LM$ is well defined.", ":answer-field/type": ":answer-field.type/checkbox", ":answer-field/choices": [{":answer/id": "08d7e613-8848-5f37-b20c-fa8fa5eaf103", ":answer/type": ":answer.type/text", ":answer/value": "false"}, {":answer/id": "ba5a8194-9275-5509-b364-6d76cc6c9b6a", ":answer/type": ":answer.type/text", ":answer/value": "true"}], ":answer-field/correct": [":answer/id", "08d7e613-8848-5f37-b20c-fa8fa5eaf103"]}, {":answer-field/id": "03dc8005-16e1-52f2-bbe6-87936bdf9b45", ":answer-field/key": "The product $NM$ is well defined.", ":answer-field/type": ":answer-field.type/checkbox", ":answer-field/choices": [{":answer/id": "509880d3-e0a8-5dab-82d8-fc25c90f1cfa", ":answer/type": ":answer.type/text", ":answer/value": "false"}, {":answer/id": "103cb232-e4c6-5a42-a46d-06c4386f924c", ":answer/type": ":answer.type/text", ":answer/value": "true"}], ":answer-field/correct": [":answer/id", "103cb232-e4c6-5a42-a46d-06c4386f924c"]}, {":answer-field/id": "a0ac857a-6321-5280-8530-0a1a95cb2cb1", ":answer-field/key": "The product $LN$ is well defined.", ":answer-field/type": ":answer-fie
