<!doctype html><html data-theme="light"><head><meta charset="utf-8"><title>Rendering</title><link rel="stylesheet" href="reference/ui/navigation.css"><link rel="stylesheet" href="reference/ui/learning.css"><link rel="stylesheet" href="reference/ui/activity.css"><style>body{display:block;margin:24px;font:18px system-ui;background:white;color:#172033}article{max-width:1120px;margin:auto;padding:20px;border:1px solid #ddd}h1{font-size:21px}h2{font-size:18px;margin-top:24px}#summary{font-size:10px;max-width:1120px;white-space:pre-wrap;overflow-wrap:anywhere;margin:auto}mjx-container[display="true"]{overflow-x:auto}</style><script src="reference/ui/vendor/dompurify/purify.min.js"></script><script src="reference/ui/mathjax-config.js"></script><script defer src="reference/ui/vendor/mathjax/tex-svg.js"></script></head><body><pre id="summary">pending</pre><main><article></article></main><script type="application/json" id="data">{"knowledge_point": {"db_id": 17592186100869, "id": "b494140f-206a-5317-8079-ff719a253140", "title": "Determining Whether Two Matrices Are Conformable for Multiplication"}, "question": {":question/id": "e33d7bef-4bc3-5439-b38c-d80db24c3395", ":question/difficulty": ":question.difficulty/easy", ":question/problem": "<div class=\"matrix-operands\">\n<div>$J=\\begin{bmatrix}-2 & 8 \\\\ 5 & 7 \\\\ 4 & -3 \\\\ 9 & -7\\end{bmatrix}$</div>\n<div>$K=\\begin{bmatrix}-6 & -9 \\\\ 3 & 1 \\\\ -3 & -3 \\\\ 1 & 3\\end{bmatrix}$</div>\n<div>$L=\\begin{bmatrix}2 & -2 & -3 & -3 \\\\ 4 & 9 & 8 & -8\\end{bmatrix}$</div>\n</div>\n\nWhich of the following statements are true regarding the matrices $J,K,$ and $L?$\n\nSelect all that apply.", ":question/worked-solution": "Notice that $J$ is a $4\\times 2$ matrix, $K$ is a $4\\times 2$ matrix, and $L$ is a $2\\times 4$ matrix.\n\nThere are $2$ columns in $J$ and $4$ rows in $K.$ Since the number of columns in $J$ does **not** equal the number of rows in $K,$ the matrices $J$ and $K$ are **not** conformable for multiplication:\n\n$$\n{J}_{4\\times 2}{\\times }_{\\ne }{K}_{4\\times 2}=\\text{undefined}\n$$\n\nOn the other hand, there are $4$ columns in $L$ and $4$ rows in $K.$ Since the number of columns in $L$ equals the number of rows in $K$, the matrices $L$ and $K$ are conformable for multiplication:\n\n$$\n{L}_{2\\times \\boxed{\\text{4}}}{\\times }_{✓}{K}_{\\boxed{\\text{4}}\\times 2}=\\text{well defined}\n$$\n\nFinally, there are $2$ columns in $J$ and $2$ rows in $L.$ Since the number of columns in $J$ equals the number of rows in $L$, the matrices $J$ and $L$ are conformable for multiplication:\n\n$$\n{J}_{4\\times \\boxed{\\text{2}}}{\\times }_{✓}{L}_{\\boxed{\\text{2}}\\times 4}=\\text{well defined}\n$$\n\nThe products $LK$ and $JL$ are well defined. The product $JK$ is undefined.", ":question/answer-fields": [{":answer-field/id": "36f5d235-752c-5609-847e-af3b4cb1e2ef", ":answer-field/key": "The product $JK$ is well defined.", ":answer-field/type": ":answer-field.type/checkbox", ":answer-field/choices": [{":answer/id": "354d0af6-0e04-55ca-b3e9-db4d61885342", ":answer/type": ":answer.type/text", ":answer/value": "false"}, {":answer/id": "2d421e46-1491-5a77-b81a-6bc15fbc8cb1", ":answer/type": ":answer.type/text", ":answer/value": "true"}], ":answer-field/correct": [":answer/id", "354d0af6-0e04-55ca-b3e9-db4d61885342"]}, {":answer-field/id": "3467c287-5aef-52a0-9c02-8cf4ee457fc2", ":answer-field/key": "The product $LK$ is well defined.", ":answer-field/type": ":answer-field.type/checkbox", ":answer-field/choices": [{":answer/id": "540c02dc-7fc6-5f2a-828d-18cfd0710de9", ":answer/type": ":answer.type/text", ":answer/value": "false"}, {":answer/id": "3d5e160e-dcff-5db0-bc02-0aed4acb364a", ":answer/type": ":answer.type/text", ":answer/value": "true"}], ":answer-field/correct": [":answer/id", "3d5e160e-dcff-5db0-bc02-0aed4acb364a"]}, {":answer-field/id": "aaad2b67-7659-5773-a41f-2bb1fa947e3e", ":answer-field/key": "The product $JL$ is well defined.", ":answer-field/type": ":answer-fie
