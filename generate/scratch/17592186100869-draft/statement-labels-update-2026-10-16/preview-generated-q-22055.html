<!doctype html><html data-theme="light"><head><meta charset="utf-8"><title>Rendering</title><link rel="stylesheet" href="reference/ui/navigation.css"><link rel="stylesheet" href="reference/ui/learning.css"><link rel="stylesheet" href="reference/ui/activity.css"><style>body{display:block;margin:24px;font:18px system-ui;background:white;color:#172033}article{max-width:1120px;margin:auto;padding:20px;border:1px solid #ddd}h1{font-size:21px}h2{font-size:18px;margin-top:24px}#summary{font-size:10px;max-width:1120px;white-space:pre-wrap;overflow-wrap:anywhere;margin:auto}mjx-container[display="true"]{overflow-x:auto}</style><script src="reference/ui/vendor/dompurify/purify.min.js"></script><script src="reference/ui/mathjax-config.js"></script><script defer src="reference/ui/vendor/mathjax/tex-svg.js"></script></head><body><pre id="summary">pending</pre><main><article></article></main><script type="application/json" id="data">{"knowledge_point": {"db_id": 17592186100869, "id": "b494140f-206a-5317-8079-ff719a253140", "title": "Determining Whether Two Matrices Are Conformable for Multiplication"}, "question": {":question/id": "ab2c0e1e-bb03-5209-8bf4-c2255fcf1424", ":question/difficulty": ":question.difficulty/easy", ":question/problem": "<div class=\"matrix-operands\">\n<div>$X=\\begin{bmatrix}-2 & 8 \\\\ 5 & 7 \\\\ 4 & -3 \\\\ 9 & -7\\end{bmatrix}$</div>\n<div>$Y=\\begin{bmatrix}-6 & -9 \\\\ 3 & 1 \\\\ -3 & -3 \\\\ 1 & 3\\end{bmatrix}$</div>\n<div>$Z=\\begin{bmatrix}2 & -2 & -3 & -3 \\\\ 4 & 9 & 8 & -8\\end{bmatrix}$</div>\n</div>\n\nWhich of the following statements are true regarding the matrices $X,Y,$ and $Z?$\n\nSelect all that apply.", ":question/worked-solution": "Notice that $X$ is a $4\\times 2$ matrix, $Y$ is a $4\\times 2$ matrix, and $Z$ is a $2\\times 4$ matrix.\n\nThere are $2$ columns in $X$ and $4$ rows in $Y.$ Since the number of columns in $X$ does **not** equal the number of rows in $Y,$ the matrices $X$ and $Y$ are **not** conformable for multiplication:\n\n$$\n{X}_{4\\times 2}{\\times }_{\\ne }{Y}_{4\\times 2}=\\text{undefined}\n$$\n\nOn the other hand, there are $4$ columns in $Z$ and $4$ rows in $Y.$ Since the number of columns in $Z$ equals the number of rows in $Y,$ the matrices $Z$ and $Y$ are conformable for multiplication:\n\n$$\n{Z}_{2\\times \\boxed{\\text{4}}}{\\times }_{✓}{Y}_{\\boxed{\\text{4}}\\times 2}=\\text{well defined}\n$$\n\nFinally, there are $2$ columns in $X$ and $2$ rows in $Z.$ Since the number of columns in $X$ equals the number of rows in $Z,$ the matrices $X$ and $Z$ are conformable for multiplication:\n\n$$\n{X}_{4\\times \\boxed{\\text{2}}}{\\times }_{✓}{Z}_{\\boxed{\\text{2}}\\times 4}=\\text{well defined}\n$$\n\nThe products $ZY$ and $XZ$ are well defined. The product $XY$ is undefined.", ":question/answer-fields": [{":answer-field/id": "eeb5d258-85e8-56ee-b686-ec0bde5427b3", ":answer-field/key": "The product $XY$ is well defined.", ":answer-field/type": ":answer-field.type/checkbox", ":answer-field/choices": [{":answer/id": "48b358a1-5f37-5bc4-9ecb-b77066c52429", ":answer/type": ":answer.type/text", ":answer/value": "false"}, {":answer/id": "c513bc94-9a9d-5a14-b45b-f2118ee30869", ":answer/type": ":answer.type/text", ":answer/value": "true"}], ":answer-field/correct": [":answer/id", "48b358a1-5f37-5bc4-9ecb-b77066c52429"]}, {":answer-field/id": "57a671a0-a7dc-5e4c-9b9c-a6cc0f1064ca", ":answer-field/key": "The product $ZY$ is well defined.", ":answer-field/type": ":answer-field.type/checkbox", ":answer-field/choices": [{":answer/id": "4b076b31-eb99-51b8-89c1-fbb7b560cf03", ":answer/type": ":answer.type/text", ":answer/value": "false"}, {":answer/id": "1233d0d3-9572-593e-8f82-ff094474e919", ":answer/type": ":answer.type/text", ":answer/value": "true"}], ":answer-field/correct": [":answer/id", "1233d0d3-9572-593e-8f82-ff094474e919"]}, {":answer-field/id": "df30f145-7ad9-5426-9006-aa93ffb1051c", ":answer-field/key": "The product $XZ$ is well defined.", ":answer-field/type": ":answer-fie
