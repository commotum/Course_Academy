imes 3}=\\text{undefined}\n$$\n\nOn the other hand, there are $2$ columns in $P$ and $2$ rows in $S.$ Since the number of columns in $P$ equals the number of rows in $S,$ the matrices $P$ and $S$ are conformable for multiplication:\n\n$$\n{P}_{1\\times \\boxed{\\text{2}}}{\\times }_{✓}{S}_{\\boxed{\\text{2}}\\times 3}=\\text{well defined}\n$$\n\nFinally, there are $2$ columns in $P$ and $1$ row in $R.$ Since the number of columns in $P$ does **not** equal the number of rows in $R,$ the matrices $P$ and $R$ are **not** conformable for multiplication:\n\n$$\n{P}_{1\\times 2}{\\times }_{\\ne }{R}_{1\\times 5}=\\text{undefined}\n$$\n\nThe product $PS$ is well defined. The products $RS$ and $PR$ are undefined.", ":question/answer-fields": [{":answer-field/id": "92b02eb2-c7ea-5307-bbe3-eebf8db0e066", ":answer-field/key": "The product $RS$ is well defined.", ":answer-field/type": ":answer-field.type/checkbox", ":answer-field/choices": [{":answer/id": "53d12d33-6987-5320-819d-1e80fc393ece", ":answer/type": ":answer.type/text", ":answer/value": "false"}, {":answer/id": "d63bc039-ccbf-56ca-b4e9-6b241cfbe93b", ":answer/type": ":answer.type/text", ":answer/value": "true"}], ":answer-field/correct": [":answer/id", "53d12d33-6987-5320-819d-1e80fc393ece"]}, {":answer-field/id": "5d09696f-8e9c-5e57-9bdf-fbb563e6e297", ":answer-field/key": "The product $PS$ is well defined.", ":answer-field/type": ":answer-field.type/checkbox", ":answer-field/choices": [{":answer/id": "61b996fc-3aee-5e85-8531-6c80675ccd45", ":answer/type": ":answer.type/text", ":answer/value": "false"}, {":answer/id": "2987a595-08b5-5b5f-946b-2ccbeea47774", ":answer/type": ":answer.type/text", ":answer/value": "true"}], ":answer-field/correct": [":answer/id", "2987a595-08b5-5b5f-946b-2ccbeea47774"]}, {":answer-field/id": "d8163aa5-178e-576c-b7b0-b5fffcf228c4", ":answer-field/key": "The product $PR$ is well defined.", ":answer-field/type": ":answer-field.type/checkbox", ":answer-field/choices": [{":answer/id": "2fca6
