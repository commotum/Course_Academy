<!doctype html><html data-theme="light"><head><meta charset="utf-8"><title>Rendering</title><link rel="stylesheet" href="reference/ui/navigation.css"><link rel="stylesheet" href="reference/ui/learning.css"><link rel="stylesheet" href="reference/ui/activity.css"><style>body{display:block;margin:24px;font:18px system-ui;background:white;color:#172033}article{max-width:1120px;margin:auto;padding:20px;border:1px solid #ddd}h1{font-size:21px}h2{font-size:18px;margin-top:24px}#summary{font-size:10px;max-width:1120px;white-space:pre-wrap;overflow-wrap:anywhere;margin:auto}mjx-container[display="true"]{overflow-x:auto}</style><script src="reference/ui/vendor/dompurify/purify.min.js"></script><script src="reference/ui/mathjax-config.js"></script><script defer src="reference/ui/vendor/mathjax/tex-svg.js"></script></head><body><pre id="summary">pending</pre><main><article></article></main><script type="application/json" id="data">{"knowledge_point": {"db_id": 17592186100869, "id": "b494140f-206a-5317-8079-ff719a253140", "title": "Determining Whether Two Matrices Are Conformable for Multiplication"}, "question": {":question/id": "edd30af3-6a6a-5823-b05a-ce121062e070", ":question/difficulty": ":question.difficulty/easy", ":question/problem": "<div class=\"matrix-operands\">\n<div>$A=\\begin{bmatrix}-2 & 8 \\\\ 5 & 7 \\\\ 4 & -3 \\\\ 9 & -7\\end{bmatrix}$</div>\n<div>$B=\\begin{bmatrix}-6 & -9 \\\\ 3 & 1 \\\\ -3 & -3 \\\\ 1 & 3\\end{bmatrix}$</div>\n<div>$C=\\begin{bmatrix}2 & -2 & -3 & -3 \\\\ 4 & 9 & 8 & -8\\end{bmatrix}$</div>\n</div>\n\nWhich of the following statements are true regarding the matrices $A,B,$ and $C?$\n\nSelect all that apply.", ":question/worked-solution": "Notice that $A$ is a $4\\times 2$ matrix, $B$ is a $4\\times 2$ matrix, and $C$ is a $2\\times 4$ matrix.\n\nThere are $2$ columns in $A$ and $4$ rows in $B.$ Since the number of columns in $A$ does **not** equal the number of rows in $B,$ the matrices $A$ and $B$ are **not** conformable for multiplication:\n\n$$\n{A}_{4\\times 2}{\\times }_{\\ne }{B}_{4\\times 2}=\\text{undefined}\n$$\n\nOn the other hand, there are $4$ columns in $C$ and $4$ rows in $B.$ Since the number of columns in $C$ equals the number of rows in $B,$ the matrices $C$ and $B$ are conformable for multiplication:\n\n$$\n{C}_{2\\times \\boxed{\\text{4}}}{\\times }_{✓}{B}_{\\boxed{\\text{4}}\\times 2}=\\text{well defined}\n$$\n\nFinally, there are $2$ columns in $A$ and $2$ rows in $C.$ Since the number of columns in $A$ equals the number of rows in $C,$ the matrices $A$ and $C$ are conformable for multiplication:\n\n$$\n{A}_{4\\times \\boxed{\\text{2}}}{\\times }_{✓}{C}_{\\boxed{\\text{2}}\\times 4}=\\text{well defined}\n$$\n\nThe products $CB$ and $AC$ are well defined. The product $AB$ is undefined.", ":question/answer-fields": [{":answer-field/id": "1ff5b92e-e479-5f15-810a-7be8405c3009", ":answer-field/key": "The product $AB$ is well defined.", ":answer-field/type": ":answer-field.type/checkbox", ":answer-field/choices": [{":answer/id": "94a2654e-0685-54c9-83e9-b58a6ecb6794", ":answer/type": ":answer.type/text", ":answer/value": "false"}, {":answer/id": "ae563a9b-dcfa-5f72-aa8b-bcb4c2eae890", ":answer/type": ":answer.type/text", ":answer/value": "true"}], ":answer-field/correct": [":answer/id", "94a2654e-0685-54c9-83e9-b58a6ecb6794"]}, {":answer-field/id": "9708cb6c-dd4f-53e9-b84e-46ed4d88395b", ":answer-field/key": "The product $CB$ is well defined.", ":answer-field/type": ":answer-field.type/checkbox", ":answer-field/choices": [{":answer/id": "3c44d0f6-677f-517f-8cca-df05328494b8", ":answer/type": ":answer.type/text", ":answer/value": "false"}, {":answer/id": "ac2777d6-7ae8-581c-9d38-05532e354425", ":answer/type": ":answer.type/text", ":answer/value": "true"}], ":answer-field/correct": [":answer/id", "ac2777d6-7ae8-581c-9d38-05532e354425"]}, {":answer-field/id": "1830ef1b-ec40-5425-94ba-0cd7c9786923", ":answer-field/key": "The product $AC$ is well defined.", ":answer-field/type": ":answer-fie
