<!doctype html><html data-theme="light"><head><meta charset="utf-8"><title>Rendering</title><link rel="stylesheet" href="reference/ui/navigation.css"><link rel="stylesheet" href="reference/ui/learning.css"><link rel="stylesheet" href="reference/ui/activity.css"><style>body{display:block;margin:24px;font:18px system-ui;background:white;color:#172033}article{max-width:1120px;margin:auto;padding:20px;border:1px solid #ddd}h1{font-size:21px}h2{font-size:18px;margin-top:24px}#summary{font-size:10px;max-width:1120px;white-space:pre-wrap;overflow-wrap:anywhere;margin:auto}mjx-container[display="true"]{overflow-x:auto}</style><script src="reference/ui/vendor/dompurify/purify.min.js"></script><script src="reference/ui/mathjax-config.js"></script><script defer src="reference/ui/vendor/mathjax/tex-svg.js"></script></head><body><pre id="summary">pending</pre><main><article></article></main><script type="application/json" id="data">{"knowledge_point": {"db_id": 17592186100869, "id": "b494140f-206a-5317-8079-ff719a253140", "title": "Determining Whether Two Matrices Are Conformable for Multiplication"}, "question": {":question/id": "d8e2e44a-57da-5d8b-9797-8a1f083e72ee", ":question/difficulty": ":question.difficulty/easy", ":question/problem": "$$\nL=\\begin{bmatrix}8 & -2 & -5 \\\\ -5 & -8 & -8\\end{bmatrix},\\,M=\\begin{bmatrix}-5 & -2 & 8 \\\\ 5 & 7 & 4\\end{bmatrix},\\,N=\\begin{bmatrix}-3 & 9 & -7 & -6 \\\\ -9 & 3 & 1 & -3\\end{bmatrix}\n$$\n\nWhich of the following statements are true regarding the matrices $L,M,$ and $N?$\n\nSelect all that apply.\n\n- **I.** The product $LM$ is well defined\n- **II.** The product $LN$ is well defined\n- **III.** The product $NM$ is well defined", ":question/worked-solution": "Notice that $L$ is a $2\\times 3$ matrix, $M$ is a $2\\times 3$ matrix, and $N$ is a $2\\times 4$ matrix.\n\nThere are $3$ columns in $L$ and $2$ rows in $M.$ Since the number of columns in $L$ does **not** equal the number of rows in $M,$ the matrices $L$ and $M$ are **not** conformable for multiplication:\n\n$$\n{L}_{2\\times 3}{\\times }_{\\ne }{M}_{2\\times 3}=\\text{undefined}\n$$\n\nOn the other hand, there are $3$ columns in $L$ and $2$ rows in $N.$ Since the number of columns in $L$ does **not** equal the number of rows in $N,$ the matrices $L$ and $N$ are **not** conformable for multiplication:\n\n$$\n{L}_{2\\times 3}{\\times }_{\\ne }{N}_{2\\times 4}=\\text{undefined}\n$$\n\nFinally, there are $4$ columns in $N$ and $2$ rows in $M.$ Since the number of columns in $N$ does **not** equal the number of rows in $M,$ the matrices $N$ and $M$ are **not** conformable for multiplication:\n\n$$\n{N}_{2\\times 4}{\\times }_{\\ne }{M}_{2\\times 3}=\\text{undefined}\n$$\n\nWe conclude that all three statements are false.", ":question/answer-fields": [{":answer-field/id": "2a9c861d-c5e9-5b12-a17a-d951e0683af7", ":answer-field/key": "I", ":answer-field/type": ":answer-field.type/checkbox", ":answer-field/choices": [{":answer/id": "82877d59-e538-56fc-b721-9f5f2de0773e", ":answer/type": ":answer.type/text", ":answer/value": "false"}, {":answer/id": "8cbfdbe2-39a4-5231-afce-dbbb6f19aeae", ":answer/type": ":answer.type/text", ":answer/value": "true"}], ":answer-field/correct": [":answer/id", "82877d59-e538-56fc-b721-9f5f2de0773e"]}, {":answer-field/id": "1c455068-6ae4-549f-a990-a2ea284a1f5c", ":answer-field/key": "II", ":answer-field/type": ":answer-field.type/checkbox", ":answer-field/choices": [{":answer/id": "c8f5dd03-d175-5106-9de8-560eea30b8e7", ":answer/type": ":answer.type/text", ":answer/value": "false"}, {":answer/id": "36a50ef9-3448-5899-9eff-6370760115c9", ":answer/type": ":answer.type/text", ":answer/value": "true"}], ":answer-field/correct": [":answer/id", "c8f5dd03-d175-5106-9de8-560eea30b8e7"]}, {":answer-field/id": "9429747d-02e7-5936-b1ff-1b8eb8e38700", ":answer-field/key": "III", ":answer-field/type": ":answer-field.type/checkbox", ":answer-field/choices": [{":answer/id": "a250126f-868f-5bab-9563-579c167fd115", ":answe
