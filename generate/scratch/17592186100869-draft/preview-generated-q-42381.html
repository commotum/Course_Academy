<!doctype html><html data-theme="light"><head><meta charset="utf-8"><title>Rendering</title><link rel="stylesheet" href="reference/ui/navigation.css"><link rel="stylesheet" href="reference/ui/learning.css"><link rel="stylesheet" href="reference/ui/activity.css"><style>body{display:block;margin:24px;font:18px system-ui;background:white;color:#172033}article{max-width:1120px;margin:auto;padding:20px;border:1px solid #ddd}h1{font-size:21px}h2{font-size:18px;margin-top:24px}#summary{font-size:10px;max-width:1120px;white-space:pre-wrap;overflow-wrap:anywhere;margin:auto}mjx-container[display="true"]{overflow-x:auto}</style><script src="reference/ui/vendor/dompurify/purify.min.js"></script><script src="reference/ui/mathjax-config.js"></script><script defer src="reference/ui/vendor/mathjax/tex-svg.js"></script></head><body><pre id="summary">pending</pre><main><article></article></main><script type="application/json" id="data">{"knowledge_point": {"db_id": 17592186100869, "id": "b494140f-206a-5317-8079-ff719a253140", "title": "Determining Whether Two Matrices Are Conformable for Multiplication"}, "question": {":question/id": "50d67ff6-a6a1-5fec-a7c5-5b77c19154a3", ":question/difficulty": ":question.difficulty/moderate", ":question/problem": "$$\nO=\\begin{bmatrix}-5 & -6 \\\\ 8 & -2\\end{bmatrix},\\,P=\\begin{bmatrix}-5 & -5 & -8 & -8 & -5 \\\\ -2 & 8 & 5 & 7 & 4 \\\\ -3 & 9 & -7 & -6 & -9\\end{bmatrix},\\,R=\\begin{bmatrix}3 & 1\\end{bmatrix}\n$$\n\nWhich of the following statements are true regarding the matrices $O,P,$ and $R?$\n\nSelect all that apply.\n\n- **I.** The product $PR$ is well defined\n\n- **II.** The product $OR$ is well defined\n\n- **III.** The product $OP$ is well defined", ":question/worked-solution": "Notice that $O$ is a $2\\times 2$ matrix, $P$ is a $3\\times 5$ matrix, and $R$ is a $1\\times 2$ row vector.\n\nThere are $5$ columns in $P$ and $1$ row in $R.$ Since the number of columns in $P$ does **not** equal the number of rows in $R,$ the matrices $P$ and $R$ are **not** conformable for multiplication:\n\n$$\n{P}_{3\\times 5}{\\times }_{\\ne }{R}_{1\\times 2}=\\text{undefined}\n$$\n\nOn the other hand, there are $2$ columns in $O$ and $1$ row in $R.$ Since the number of columns in $O$ does **not** equal the number of rows in $R,$ the matrices $O$ and $R$ are **not** conformable for multiplication:\n\n$$\n{O}_{2\\times 2}{\\times }_{\\ne }{R}_{1\\times 2}=\\text{undefined}\n$$\n\nFinally, there are $2$ columns in $O$ and $3$ rows in $P.$ Since the number of columns in $O$ does **not** equal the number of rows in $P,$ the matrices $O$ and $P$ are **not** conformable for multiplication:\n\n$$\n{O}_{2\\times 2}{\\times }_{\\ne }{P}_{3\\times 5}=\\text{undefined}\n$$\n\nWe conclude that all three statements are false.", ":question/answer-fields": [{":answer-field/id": "705aa8c1-6d5c-55c2-a907-0ccf28c71faa", ":answer-field/key": "I", ":answer-field/type": ":answer-field.type/checkbox", ":answer-field/choices": [{":answer/id": "bafe234c-21cf-56ce-a8fb-cce474087e2d", ":answer/type": ":answer.type/text", ":answer/value": "false"}, {":answer/id": "b6dadde1-60de-57e1-a6d1-9c368998eaf2", ":answer/type": ":answer.type/text", ":answer/value": "true"}], ":answer-field/correct": [":answer/id", "bafe234c-21cf-56ce-a8fb-cce474087e2d"]}, {":answer-field/id": "d1841185-caf2-5089-918a-916005a8435c", ":answer-field/key": "II", ":answer-field/type": ":answer-field.type/checkbox", ":answer-field/choices": [{":answer/id": "0f3ed595-58e3-5fb6-9232-dccac60c1669", ":answer/type": ":answer.type/text", ":answer/value": "false"}, {":answer/id": "4b10c891-7cc5-5c77-b922-6eb480361d00", ":answer/type": ":answer.type/text", ":answer/value": "true"}], ":answer-field/correct": [":answer/id", "0f3ed595-58e3-5fb6-9232-dccac60c1669"]}, {":answer-field/id": "bfca5b74-6729-5ad2-8dbe-c99b0804c423", ":answer-field/key": "III", ":answer-field/type": ":answer-field.type/checkbox", ":answer-field/choices": [{":answer/id": "1eae7acc-bb45-5631-b214-ce66e42
