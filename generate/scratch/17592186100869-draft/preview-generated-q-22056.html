<!doctype html><html data-theme="light"><head><meta charset="utf-8"><title>Rendering</title><link rel="stylesheet" href="reference/ui/navigation.css"><link rel="stylesheet" href="reference/ui/learning.css"><link rel="stylesheet" href="reference/ui/activity.css"><style>body{display:block;margin:24px;font:18px system-ui;background:white;color:#172033}article{max-width:1120px;margin:auto;padding:20px;border:1px solid #ddd}h1{font-size:21px}h2{font-size:18px;margin-top:24px}#summary{font-size:10px;max-width:1120px;white-space:pre-wrap;overflow-wrap:anywhere;margin:auto}mjx-container[display="true"]{overflow-x:auto}</style><script src="reference/ui/vendor/dompurify/purify.min.js"></script><script src="reference/ui/mathjax-config.js"></script><script defer src="reference/ui/vendor/mathjax/tex-svg.js"></script></head><body><pre id="summary">pending</pre><main><article></article></main><script type="application/json" id="data">{"knowledge_point": {"db_id": 17592186100869, "id": "b494140f-206a-5317-8079-ff719a253140", "title": "Determining Whether Two Matrices Are Conformable for Multiplication"}, "question": {":question/id": "dd90f8ee-704f-5c09-a205-8f0dacf901ba", ":question/difficulty": ":question.difficulty/easy", ":question/problem": "$$\nR=\\begin{bmatrix}8 & -2 & -5 \\\\ -5 & -8 & -8\\end{bmatrix},\\,S=\\begin{bmatrix}-5 & -2 & 8 \\\\ 5 & 7 & 4\\end{bmatrix},\\,T=\\begin{bmatrix}-3 & 9 & -7 & -6 \\\\ -9 & 3 & 1 & -3\\end{bmatrix}\n$$\n\nWhich of the following statements are true regarding the matrices $R,S,$ and $T?$\n\nSelect all that apply.\n\n- **I.** The product $RS$ is well defined\n- **II.** The product $RT$ is well defined\n- **III.** The product $TS$ is well defined", ":question/worked-solution": "Notice that $R$ is a $2\\times 3$ matrix, $S$ is a $2\\times 3$ matrix, and $T$ is a $2\\times 4$ matrix.\n\nThere are $3$ columns in $R$ and $2$ rows in $S.$ Since the number of columns in $R$ does **not** equal the number of rows in $S,$ the matrices $R$ and $S$ are **not** conformable for multiplication:\n\n$$\n{R}_{2\\times 3}{\\times }_{\\ne }{S}_{2\\times 3}=\\text{undefined}\n$$\n\nOn the other hand, there are $3$ columns in $R$ and $2$ rows in $T.$ Since the number of columns in $R$ does **not** equal the number of rows in $T,$ the matrices $R$ and $T$ are **not** conformable for multiplication:\n\n$$\n{R}_{2\\times 3}{\\times }_{\\ne }{T}_{2\\times 4}=\\text{undefined}\n$$\n\nFinally, there are $4$ columns in $T$ and $2$ rows in $S.$ Since the number of columns in $T$ does **not** equal the number of rows in $S,$ the matrices $T$ and $S$ are **not** conformable for multiplication:\n\n$$\n{T}_{2\\times 4}{\\times }_{\\ne }{S}_{2\\times 3}=\\text{undefined}\n$$\n\nWe conclude that all three statements are false.", ":question/answer-fields": [{":answer-field/id": "0ca618a9-0618-5ea0-8148-5d51187cdf46", ":answer-field/key": "I", ":answer-field/type": ":answer-field.type/checkbox", ":answer-field/choices": [{":answer/id": "985f9ab1-394b-5c6a-a7ec-3ede5c033e6c", ":answer/type": ":answer.type/text", ":answer/value": "false"}, {":answer/id": "598dd9cf-3c82-5ba8-a315-633e7f01e22c", ":answer/type": ":answer.type/text", ":answer/value": "true"}], ":answer-field/correct": [":answer/id", "985f9ab1-394b-5c6a-a7ec-3ede5c033e6c"]}, {":answer-field/id": "3be0ea4e-0cbc-50a2-848b-ea0a2e897265", ":answer-field/key": "II", ":answer-field/type": ":answer-field.type/checkbox", ":answer-field/choices": [{":answer/id": "b3ae8017-4be6-5abd-a77c-73029759b349", ":answer/type": ":answer.type/text", ":answer/value": "false"}, {":answer/id": "1adb1a12-254b-5705-a240-99e85a2e94e4", ":answer/type": ":answer.type/text", ":answer/value": "true"}], ":answer-field/correct": [":answer/id", "b3ae8017-4be6-5abd-a77c-73029759b349"]}, {":answer-field/id": "b7109fab-5a44-5fca-a394-fc6230d97fa1", ":answer-field/key": "III", ":answer-field/type": ":answer-field.type/checkbox", ":answer-field/choices": [{":answer/id": "23d2214a-8b77-5d1d-8c7d-394666a554b8", ":answe
