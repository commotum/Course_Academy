cation:\n\n$$\n{R}_{1\\times 5}{\\times }_{\\ne }{S}_{1\\times 2}=\\text{undefined}\n$$\n\nOn the other hand, there are $2$ columns in $P$ and $1$ row in $S.$ Since the number of columns in $P$ does **not** equal the number of rows in $S,$ the matrices $P$ and $S$ are **not** conformable for multiplication:\n\n$$\n{P}_{2\\times 2}{\\times }_{\\ne }{S}_{1\\times 2}=\\text{undefined}\n$$\n\nFinally, there are $2$ columns in $P$ and $1$ row in $R.$ Since the number of columns in $P$ does **not** equal the number of rows in $R,$ the matrices $P$ and $R$ are **not** conformable for multiplication:\n\n$$\n{P}_{2\\times 2}{\\times }_{\\ne }{R}_{1\\times 5}=\\text{undefined}\n$$\n\nWe conclude that all three statements are false.", ":question/answer-fields": [{":answer-field/id": "b19a20c5-afb7-5dc2-9fc1-9c594316a164", ":answer-field/key": "I", ":answer-field/type": ":answer-field.type/checkbox", ":answer-field/choices": [{":answer/id": "f014b7fd-ab32-5bb4-a516-8d9a267ee4fb", ":answer/type": ":answer.type/text", ":answer/value": "false"}, {":answer/id": "3edafb7e-5a8e-568e-93a2-d9776a6084b1", ":answer/type": ":answer.type/text", ":answer/value": "true"}], ":answer-field/correct": [":answer/id", "f014b7fd-ab32-5bb4-a516-8d9a267ee4fb"]}, {":answer-field/id": "c974abcf-7262-5f9f-bd6b-6da19ef7805f", ":answer-field/key": "II", ":answer-field/type": ":answer-field.type/checkbox", ":answer-field/choices": [{":answer/id": "809c9224-decc-5959-8d36-bdbe575f61bd", ":answer/type": ":answer.type/text", ":answer/value": "false"}, {":answer/id": "731763ab-ecfa-5d9f-b97e-e57ab7f3ac3e", ":answer/type": ":answer.type/text", ":answer/value": "true"}], ":answer-field/correct": [":answer/id", "809c9224-decc-5959-8d36-bdbe575f61bd"]}, {":answer-field/id": "be555373-045c-506a-8a35-eea9aaaa8935", ":answer-field/key": "III", ":answer-field/type": ":answer-field.type/checkbox", ":answer-field/choices": [{":answer/id": "d5bd226a-d5ac-511a-968f-be677f0cb766", ":answer/type": ":answer.type/text", ":ans
