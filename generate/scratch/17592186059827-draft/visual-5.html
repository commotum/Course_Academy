sed as an inequality. We use the following notations:\n\n- Parentheses ${\\color{red}{(}}\\phantom{0} \\phantom{0}{\\color{red}{)}}$ to indicate that the endpoints are *not* included.\n- Brackets ${\\color{blue}{[}}\\phantom{0}\\phantom{0}{\\color{blue}{]}}$ to indicate that the endpoints *are* included.\n\nFor the given interval\n\n$$\nx ∈ [-8, - 3\\sqrt{3})\n$$\n\nwe note the following:\n\n- The left endpoint $-8$ *is* included in the interval. Therefore, we use $\\le$.\n- The right endpoint $- 3\\sqrt{3}$ *is not* included in the interval. Therefore, we use $<$.\n\nTherefore, the inequality that corresponds to the given interval is\n\n$$\n-8 \\le x < - 3\\sqrt{3}\n$$"}, "generation": {"version": "half-open-v5-revalidated", "source": {"database": "math", "basis": 2275, "lineage": "01a12a15-3e0a-75a1-9dac-f8b8c5d5c3f1"}, "difficulty": "hard", "difficulty_origin": "authored; initial originals unrated", "template": "interval_to_inequality", "profile": "authored_endpoint_bank", "parameters": {"a": "-8", "b": "-3*sqrt(3)", "variable": "x", "left_closed": true}, "mathematical_fingerprint": "89b66ec6854869f8b6c25a9ec0498f503982bdc347f42bda92691be24fa04dc4", "content_fingerprint": "0c5a3d19bd10be8de89d7b6202222d92fe283403717849983b4fbd83ec74961b", "seed": 174, "source_id": null, "raw_missing_fields_preserved": false, "solution_origin": "absent in initial practice capture; authored using canonical shared opening/endpoint sequence", "semantic_catalog_count": 2820, "plot_rating": "none", "math_format": "course-academy-tex-v1"}}}]</script><script type="module" src="browser-player.js"></script></body></html>
